    # No restart: this is a one-shot job. `--rm` cleans up the container.

volumes:
  newdb_data:

networks:
  hotel-network:
    driver: bridge

# =============================================================================
# Docker secrets — production credentials moved off env vars (security audit
# 2026-05-14). Each service that previously got these via `environment:` now
# mounts the corresponding file at `/run/secrets/<name>` (read-only).
#
# The Rust binaries hydrate matching env vars from these files at process
# start (see `hotel-backend/src/secrets.rs`) — so any pre-migration code that
# reads `std::env::var("DB_PASSWORD")` keeps working unchanged.
#
# DEPLOY-TIME PREREQUISITES on evergreen (must exist BEFORE merge / pipeline
# runs `docker compose up`). The deploy script (`/srv/run-deploy.sh` on
# evergreen, NOT in this repo) is responsible for writing these from GH
# secrets, chmod 0400, chown deploy:docker:
#
#     /home/deploy/secrets/db_password
#     /home/deploy/secrets/postgres_password
#     /home/deploy/secrets/ville_db_password   # symlink to postgres_password
#                                              # until ADR 0001 Phase 8 split
#     /home/deploy/secrets/slack_webhook_url
#
# An entry under `secrets:` that points to a missing file fails fast with
#     "no such file or directory" before any container starts — operators
# see the error in CI logs, not after a half-rolled deploy.
#
# Reversibility: the Rust hydrator falls back to env vars when a secret
# file is unreadable or empty. So a `git revert` of this commit (which
# restores the `environment:` entries) is a single-step rollback, even if
# the secret files exist on disk.
# =============================================================================
secrets:
  # `${SECRETS_DIR:-/home/deploy/secrets}` lets local dev point at a
  # different directory without editing the compose file:
  #     SECRETS_DIR=$PWD/.secrets docker compose up
  # The evergreen default matches what `/srv/run-deploy.sh` writes (see
  # PR body for the deploy-time prereq checklist).
  db_password:
    file: ${SECRETS_DIR:-/home/deploy/secrets}/db_password
  postgres_password:
    file: ${SECRETS_DIR:-/home/deploy/secrets}/postgres_password
  ville_db_password:
    file: ${SECRETS_DIR:-/home/deploy/secrets}/ville_db_password
  slack_webhook_url:
    file: ${SECRETS_DIR:-/home/deploy/secrets}/slack_webhook_url
