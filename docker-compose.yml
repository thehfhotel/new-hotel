services:
  # PostgreSQL container for HotelNew database (self-hosted)
  newdb:
    # Pinned to digest (Batch C of post-Phase-5.5 audit). Source: Docker Hub
    # API `library/postgres/tags/17-alpine` on 2026-04-26. Dependabot
    # (`docker` ecosystem) will surface new digests as PRs.
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    container_name: new-hotel-db
    # Security audit 2026-05-14: `POSTGRES_PASSWORD` removed from env;
    # use `POSTGRES_PASSWORD_FILE` instead (a stock feature of the
    # `postgres:17-alpine` entrypoint — see
    # https://hub.docker.com/_/postgres "Docker Secrets" section).
    # The entrypoint reads the file ONCE during cluster init and never
    # exposes the value via `printenv`. POSTGRES_DB / POSTGRES_USER /
    # PGPORT are non-secrets and stay as env.
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - PGPORT=${PGPORT:-5439}
    secrets:
      - postgres_password
    volumes:
      - newdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    # No host-port publish: ville_sync (the only external consumer of the
    # WG-exposed 10.10.10.4:5441 mapping) was retired in task #77 once Phase
    # 5 Ville cutover repointed reads at the local `hotelville` PG database.
    # newdb is now reachable only on the internal `hotel-network` bridge.
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5439"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Resource ceiling — newdb is the heaviest service (Phase 5.5 CT
    # watcher amplifies write volume). 2G cap leaves enough headroom on
    # the evergreen 8G host while protecting other services from a
    # runaway query.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    # Web container does NOT consume any DB / Slack secret directly — it
    # proxies to `backend` via BACKEND_URL. The previous env entries
    # (DB_*, SLACK_WEBHOOK_URL) were dead weight that leaked secrets into
    # `docker exec printenv`. Removed wholesale (security audit 2026-05-14).
    environment:
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
      # Phase 4 PR3: enables the AuthGuard's redirect-to-/login enforcement.
      # MUST be flipped to `true` simultaneously with backend `AUTH_ENABLED=true`
      # at cutover — flipping only one side will either (a) lock users out of
      # every page with no working /api/auth/me, or (b) allow access without
      # authentication. Default `false` preserves additive-only behaviour.
      # - NEXT_PUBLIC_AUTH_REQUIRED=${NEXT_PUBLIC_AUTH_REQUIRED:-false}
      # Bind Next.js standalone server to ALL interfaces (incl. 127.0.0.1)
      # so the container-internal `wget http://localhost:3003` healthcheck
      # below actually resolves. Without this, Next.js 16 standalone binds
      # to the docker bridge IP only and the healthcheck flaps `unhealthy`
      # despite traffic working from outside the container. Mirrors the
      # `HOST=0.0.0.0` line on the `backend` service.
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      # `wget --spider` returns non-zero on connection refused / non-2xx.
      # node:alpine ships wget; no extra package needed. Hitting the
      # root path is enough to confirm Next.js bound the port and is
      # serving — a deeper API probe would couple us to backend health.
      # Use 127.0.0.1 (NOT `localhost`) to force IPv4: alpine's /etc/hosts
      # also defines `::1 localhost` and wget prefers IPv6 by default,
      # but Next.js standalone with HOSTNAME=0.0.0.0 binds IPv4 only,
      # so an IPv6 connect to ::1:3003 fails Connection refused even
      # though the site serves correctly. Documented post-incident
      # 2026-04-29 (false-positive `unhealthy` flap).
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3003 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    # Security audit 2026-05-14: DB_PASSWORD / POSTGRES_PASSWORD /
    # SLACK_WEBHOOK_URL / VILLE_DB_PASSWORD / NEW_DB_PASSWORD moved out of
    # this `environment:` block into `secrets:` below. The Rust startup
    # hydrator (`hotel-backend/src/secrets.rs`) reads each file at
    # `/run/secrets/<name>` and populates the matching env var in-process,
    # so downstream `env::var(...)` callers in `config.rs` keep working
    # unchanged. Net effect: `docker exec ... printenv` no longer leaks
    # any of these values.
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      # DB_PASSWORD — sourced from /run/secrets/db_password (see secrets: below)
      # TCP port. Default 1433 (HF Hotel). HF Ville's SS2025 Express
      # instance listens on 1436 — set MSSQL_PORT=1436 in that .env.
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      # New database (PostgreSQL Docker container - owned by this application)
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - NEW_DB_NAME=${POSTGRES_DB}
      - NEW_DB_USER=${POSTGRES_USER}
      # Headroom over the code default of 10 (config.rs) after the 2026-07-29 SSE pool-exhaustion incident.
      - NEW_DB_POOL_MAX=${NEW_DB_POOL_MAX:-20}
      # NEW_DB_PASSWORD — sourced from /run/secrets/postgres_password.
      # config.rs::NewDbConfig::from_env still reads `NEW_DB_PASSWORD`;
      # the hydrator copies POSTGRES_PASSWORD → NEW_DB_PASSWORD when only
      # the latter is set. Belt-and-suspenders: also expose POSTGRES_USER
      # so the hydrator's DATABASE_URL reconstruction has every piece.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=new
      # SLACK_WEBHOOK_URL — sourced from /run/secrets/slack_webhook_url
      - SLACK_NOTIFICATIONS_ENABLED=true
      # Per-job slack notification kill-switches (2026-05-15).
      # Registered in `scheduler::jobs::init_scheduler`.
      #
      # DEFAULT FLIPPED true -> false (2026-07-28) — fail CLOSED. All four
      # jobs are purely informational and POST to Slack once PER ROW, on the
      # same webhook that carries every `:rotating_light:` page; there is no
      # severity routing. A `true` default meant any environment that had not
      # explicitly opted out — a fresh stack, a fork, a cleared variable —
      # drowned the alert channel in a booking feed. Absence of config must
      # mean quiet. Matching fail-closed default in
      # `scheduler::jobs::notification_flag_enabled` (strict `true`/`1`).
      #
      # NOT part of the ADR-0004 compose-owned set below: unlike the
      # reconcile / watermark flags, these four ARE injected by
      # docker-build.yml (`vars.X || 'true'`), so in production the GitHub
      # repo variables win and the defaults here are unreachable. All four
      # have been `false` there since 2026-05-19 — this flip is a no-op for
      # production and only fixes the fallback for everyone else.
      - HOURLY_REPORT_ENABLED=${HOURLY_REPORT_ENABLED:-false}
      - CHECKIN_NOTIFICATIONS_ENABLED=${CHECKIN_NOTIFICATIONS_ENABLED:-false}
      - CHECKOUT_NOTIFICATIONS_ENABLED=${CHECKOUT_NOTIFICATIONS_ENABLED:-false}
      - BOOKING_NOTIFICATIONS_ENABLED=${BOOKING_NOTIFICATIONS_ENABLED:-false}
      - HOST=0.0.0.0
      - PORT=3003
      # HF Ville — Phase 5 Ville cutover (#76, 2026-04-30): ville_pool
      # repointed from the defunct `ville-tunnel` default to the local
      # `hotelville` PG database in the same `newdb` cluster (per ADR 0001
      # Q1 per-DB topology). Same credentials as POSTGRES_*; fed by
      # sync-hfville CT watcher.
      - VILLE_DB_ENABLED=${VILLE_DB_ENABLED:-true}
      - VILLE_DB_SERVER=${VILLE_DB_SERVER:-newdb}
      - VILLE_DB_PORT=${VILLE_DB_PORT:-5439}
      - VILLE_DB_NAME=${VILLE_DB_NAME:-hotelville}
      - VILLE_DB_USER=${VILLE_DB_USER:-${POSTGRES_USER}}
      # Headroom over the code default of 5 (config.rs) after the 2026-07-29 SSE pool-exhaustion incident.
      - VILLE_DB_POOL_MAX=${VILLE_DB_POOL_MAX:-10}
      # VILLE_DB_PASSWORD — sourced from /run/secrets/ville_db_password
      # CORS allowlist (Phase 3 hardening). Comma-separated absolute
      # origins. Default (when unset) covers the Next.js dev server on
      # the host + the in-container `web` service — fine for the current
      # internal-only deploy where the backend port isn't exposed.
      # Production should set this explicitly to the public hostname(s)
      # if the backend ever gets exposed externally.
      # - BACKEND_ALLOWED_ORIGINS=https://hotel.example.com,http://web:3003
      # Auth middleware (Phase 4 PR2). Defaults to `false` so existing
      # deployments stay unauthenticated until an operator opts in.
      # FLIP CHECKLIST before setting `true`:
      #   1. Provision at least one admin user — exec into the backend
      #      container (or run locally against PG) and run:
      #        cargo run --bin create_user -- --username alice --role admin
      #   2. Set `AUTH_ENABLED=true` in `.env` (or uncomment below).
      #   3. Redeploy.
      # When false: `/api/new/*` is wide open (legacy behavior).
      # When true:  every `/api/new/*` request must carry the `session`
      #             HttpOnly cookie minted by `POST /api/auth/login`.
      # Either way, `/api/auth/{login,logout,me}` and `/api/health`
      # remain public — that's how the frontend bootstraps.
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      # Cloudflare Access auto-login (`POST /api/auth/cf-login`). Staff who
      # already passed the CF Access edge check get an app session minted
      # from the verified `Cf-Access-Jwt-Assertion` email claim (mapped via
      # `ht_users.email`, migration 074) — no second password login.
      # STRICTLY ADDITIVE: password login is untouched and remains the
      # fallback for unmapped users. Default ON (read-only against PG; no
      # legacy write, so no ship-dark treatment needed). Kill-switch:
      # set `CF_AUTO_LOGIN=false` (route answers 404) + redeploy/restart.
      # `CF_ACCESS_AUD` overrides the baked-in Access-application AUD tag
      # (a public identifier) if the CF application is ever recreated.
      - CF_AUTO_LOGIN=${CF_AUTO_LOGIN:-true}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      # Central HF-ID card-login (PMS↔central, PR #222) — card login dark
      # when unset. Delivered via the deploy payload like other secrets;
      # do NOT hand-edit on the host (each deploy rewrites compose + .env).
      - READER_RESOLVE_SECRET=${READER_RESOLVE_SECRET:-}
      # Housekeeping maid surface (hotel.thehfhotel.org/hk*, PR #231) —
      # AUD tag of its path-scoped CF Access app; every /api/hk 401s
      # while unset (ships dark).
      - CF_ACCESS_HK_AUD=${CF_ACCESS_HK_AUD:-}
      # Alias map for multi-identity users: `from1=to1,from2=to2`,
      # case-insensitive on the `from` side, applied AFTER the CF JWT is
      # verified and BEFORE the ht_users.email lookup (it can only remap
      # an identity Cloudflare already proved). Default covers the owner's
      # second Google account (live verification 2026-07-02: signs in
      # alternately as nut.winut@gmail.com and winut.hf@gmail.com). Not a
      # secret — plain emails. Malformed entries are ignored.
      - CF_EMAIL_ALIASES=${CF_EMAIL_ALIASES:-nut.winut@gmail.com=winut.hf@gmail.com,pahntaylor.december@gmail.com=treejutar.1659@gmail.com,winai_scm@msn.com=winai.sdy@gmail.com}
      # Round-bill writeback (Track J6). Defaults to `false` so iHOTEL stays
      # the sole opener of cashier rounds (`HT_Round_Bill`); our app only
      # MIRRORS rounds in via the read-only `sync_round_bills` poll. When
      # false, `POST /api/shifts/open|close` reject with HTTP 400
      # (`ServiceError::Conflict`) and no legacy write is ever attempted.
      # FLIP CHECKLIST before setting `true`:
      #   1. Ship-B per-site write bundle has LANDED (55f4ec8) — HF Ville
      #      open/close is now code-ready (the Ville ShiftService binds
      #      site_id='hfville'); a Ville round additionally needs
      #      HFVILLE_WRITES_ENABLED=true (below).
      #   2. A reception-coordinated live round test (open in our app at a real
      #      shift boundary, verify it lands in HT_Round_Bill + iHOTEL sees it;
      #      one person/one app at a time — the get_id MAX+1 race is rated Low).
      #      See docs/coexistence/RUNBOOK-round-writeback-flip.md.
      #   3. `gh variable set ROUND_WRITEBACK_ENABLED -b true` + redeploy (now
      #      plumbed through the deploy payload). Rollback = set back to false +
      #      redeploy (no state to undo; the legacy PK prevents duplicates and
      #      the mirror self-heals).
      - ROUND_WRITEBACK_ENABLED=${ROUND_WRITEBACK_ENABLED:-false}
      # Ship-dark coexistence flags — default false. Flip each via the GH Actions
      # repo variable of the same name (`gh variable set <NAME> -b true`) + redeploy;
      # all are plumbed through the workflow deploy payload (env block + jq) and
      # written to .env generically by run-deploy.sh.
      #   - CHECKOUT_SERVER_TOTAL_ENABLED (#30): new-app checkout writes back the
      #     server folio total. Folio parity verified 2026-06-30
      #     (docs/coexistence/checkout-folio-comparison.md); resolve the POS
      #     double-count before new-app POS is used at checkout.
      #   - BOOKING_VALIDATION_ENABLED (#31): the booking form surfaces the server
      #     availability verdict (fails open; advisory — backend acceptance unchanged).
      #   - HFVILLE_WRITES_ENABLED (#42): lifts the ville_write_guard so
      #     ?branch=hfville mutations execute (per-site routing hardened 55f4ec8;
      #     run docs/coexistence/ville-write-e2e-runbook.md live test first).
      - CHECKOUT_SERVER_TOTAL_ENABLED=${CHECKOUT_SERVER_TOTAL_ENABLED:-false}
      - BOOKING_VALIDATION_ENABLED=${BOOKING_VALIDATION_ENABLED:-false}
      - HFVILLE_WRITES_ENABLED=${HFVILLE_WRITES_ENABLED:-false}
      # Check-in registration legacy mirrors (config.rs:392,425) — default false.
      # Same flip mechanism as the flags above (`gh variable set <NAME> -b true` +
      # redeploy, or a host .env line for a scoped test). These were shipped read
      # by the backend but were previously NOT plumbed here, so they could not be
      # turned on at all — this line is the missing plumbing.
      #   - GUEST_DOCUMENT_STORAGE_ENABLED: mirror captured ID/passport image into
      #     iHOTEL (INSERT Tb_Save_Image via writeback/recipes/save_image.rs).
      #   - TM30_COMPANION_WRITEBACK_ENABLED: mirror an app-added companion into
      #     iHOTEL (INSERT HT_CheckIn_Other_People via companion_people.rs).
      # Reception-coordinated live test before flipping permanently:
      # docs/coexistence/task8-writeback-test-runsheet.md (+ legacy-writeback-test-runbook.md).
      - GUEST_DOCUMENT_STORAGE_ENABLED=${GUEST_DOCUMENT_STORAGE_ENABLED:-false}
      - TM30_COMPANION_WRITEBACK_ENABLED=${TM30_COMPANION_WRITEBACK_ENABLED:-false}
      # Layout-edit mode (จัดผัง, #236) — default false (ship-dark). Gates the
      # WHOLE mode: PUT /api/rooms/layout 409s and the rooms-page toggle is
      # hidden (a canonical-only rearrange would fork the shared board). Each
      # drop writes ht_rooms_new.room_x/room_y AND mirrors HT_Rooms.Room_X/Room_y
      # (FormRoomMain byte-shape, writeback/recipes/move_room_tiles.rs). Flip:
      #   1. Reception-coordinated live test — drag one tile in our app, verify
      #      iHOTEL FormRoomMain shows it in the same cell (and vice versa).
      #   2. `gh variable set LAYOUT_WRITEBACK_ENABLED -b true` + redeploy.
      #      Rollback = set back to false + redeploy (no state to undo — the
      #      already-written coordinates are converged on both sides).
      - LAYOUT_WRITEBACK_ENABLED=${LAYOUT_WRITEBACK_ENABLED:-false}
      # Self-healing reconcile sweep (scheduler/sync.rs). NARROW BY DESIGN —
      # NOT a general-purpose repair arm. It fires only for
      # `table_name IN ('customers','rooms')` (single-PK mappers that are safe
      # to re-drive idempotently; bookings/checkins hit the `_ => Ok(false)`
      # arm at scheduler/sync.rs:2033-2035) and only for VALUE DRIFT — rows
      # where BOTH hashes are present. `missing_pg` / `missing_mssql` rows are
      # left open for the normal paths / operator review. When such a row
      # resists convergence past FORCE_CONVERGE_MIN_AGE_SECS (1h), the sweep
      # re-projects the legacy row through the CT mapper instead of leaving it
      # logged-but-unrepaired. Default OFF — the CT watcher + writeback do the
      # real reconciliation; this only catches durable lag. This backend runs
      # HF Hotel's reconcile; sync-hfville runs Ville's (its own override below).
      #
      # ┌─ OPERATIONAL FLAG STATE — READ BEFORE EDITING (ADR 0004) ──────────┐
      # │ The DEFAULT BELOW IS THE LIVE PRODUCTION VALUE. These flags are    │
      # │ deliberately NOT passed through .github/workflows/docker-build.yml │
      # │ and are NOT GitHub repo variables. Flip one by editing its default │
      # │ here — docker-compose.yml is in the workflow's `deploy` paths       │
      # │ filter, so the edit triggers its own deploy.                       │
      # │                                                                     │
      # │ DO NOT "restore" these keys to docker-build.yml. run-deploy.sh      │
      # │ materialises .env wholesale from the workflow payload, and the      │
      # │ workflow shipped `vars.X || 'false'` for every key — so any key it  │
      # │ sets makes the `:-default` here UNREACHABLE, silently reverting     │
      # │ every flag to false on the next deploy. That trap is what stranded  │
      # │ a booking for 16 days; see docs/adr/0004-flag-state-in-compose.md.  │
      # └─────────────────────────────────────────────────────────────────────┘
      - RECONCILE_FORCE_CONVERGE_ENABLED=${RECONCILE_FORCE_CONVERGE_ENABLED:-true}
      # Self-healing RE-INGEST arm for the reconcile sweep's `missing_pg`
      # rows — the dropped-legacy-change class the force-converge arm above
      # deliberately skips. This backend runs HF Hotel's reconcile.
      # ENABLED after the HF Ville canary healed C2413 / R002066 on
      # 2026-07-27 (16 days stranded) with correct data and no legacy write.
      - RECONCILE_REINGEST_MISSING_PG_ENABLED=${RECONCILE_REINGEST_MISSING_PG_ENABLED:-true}
      # Phase 6-A — `payments` reconcile arm (legacy HT_Receipt_H ↔ canonical
      # ht_payments, keyed on Receipt_no). DETECTION ONLY: it records
      # divergence into ht_reconcile_log and writes nothing but its own ack
      # cache (ht_receipts_legacy, migration 080); it is deliberately NOT in
      # FORCE_CONVERGE_VALUE_DRIFT_TABLES / REINGEST_MISSING_PG_TABLES.
      #
      # SHIPS DARK. With this false, run_sync never calls sync_payments, so the
      # arm issues zero MSSQL and zero PG queries. Enable HF VILLE FIRST, soak
      # 48h, then HF Hotel — pre-set LEGACY_RECONCILE_DRIFT_ALERT_THRESHOLD_<SITE>
      # or enable in an announced window.
      #
      # SCOPE: the scan is floored at the canonical mirror's own coverage era
      # (PAYMENTS_ERA_FLOOR_SQL — derived from MIN(ht_payments.pay_date), never
      # configured). Receipts older than that were never imported and never can
      # be, so hashing them would build a PERMANENT missing_pg backlog: >20k
      # rows at HF Hotel on 2026-07-28 (21,566 ref-carrying legacy receipts vs
      # 1,154 canonical payments, all 2026-04-27+). Those rows are unclosable —
      # missing_pg is never acked and `payments` is in neither self-heal list —
      # and would have starved every other entity out of the 500-row auto-resolve
      # batch. Floored, the same data yields ~13 first-enable finds.
      #
      # So do NOT expect a big transient backlog here: what lands is small and
      # each row needs OPERATOR ACTION (nothing auto-closes it), and the >72h
      # escalation tier will fire on any that sit. This backend runs HF Hotel's
      # reconcile; sync-hfville runs Ville's (its own HFVILLE_ override below).
      # ENABLED 2026-07-31 (T2 rollout step 2 of 8) after a clean 46h Ville
      # soak: 165 consecutive ticks, 0 findings, 0 alerts. Runs on backend-1's
      # own MSSQL pool, architecturally isolated from sync-1's CT watcher —
      # see #275, which gates the REMAINING arms on Ville (shared pool) but
      # not this one.
      - RECONCILE_PAYMENTS_ARM_ENABLED=${RECONCILE_PAYMENTS_ARM_ENABLED:-true}
      # Phase 6-B — `guest_registry` reconcile arm (legacy
      # HT_CheckIn_Other_People ↔ canonical ht_guest_registry). Reconciles per
      # FOLIO (the whole companion set of one Cin_no), NOT per row: iHOTEL
      # edits companions by DELETE+REINSERT, so per-row keying would report a
      # divergence on every correctly-applied edit. DETECTION ONLY: it records
      # into ht_reconcile_log and writes nothing but its own ack cache
      # (ht_guest_registry_legacy, migration 081); it is deliberately NOT in
      # FORCE_CONVERGE_VALUE_DRIFT_TABLES / REINGEST_MISSING_PG_TABLES —
      # "repairing" a folio would mean DELETING canonical companion rows,
      # i.e. a sweep destroying TM.30 immigration-registry state.
      #
      # SHIPS DARK. With this false, run_sync never calls sync_guest_registry,
      # so the arm issues zero MSSQL and zero PG queries. Enable HF VILLE
      # FIRST, soak 48h, then HF Hotel — in an announced window.
      #
      # SCOPE: folios are admitted only when their parent check-in exists in
      # canonical AND is at/after the mirror's own coverage era (derived from
      # MIN(ht_checkins.cin_checkin_time) over check-ins carrying a mirrored
      # companion; never configured). ht_guest_registry is CT-populated with
      # no historical backfill while ht_checkins IS backfilled to 2021, so
      # unfloored the first tick would open ~19.6k rows here (HF Hotel) that
      # can NEVER close and would starve the 500-row auto-resolve batch.
      # Floored, live 2026-07-28: 830 in-era legacy folios vs 818 canonical
      # (~12 first-enable finds). Each needs OPERATOR ACTION — nothing
      # auto-closes it, and the >72h escalation tier will fire on any that
      # sit. This backend runs HF Hotel's reconcile; sync-hfville runs
      # Ville's (its own HFVILLE_ override below).
      - RECONCILE_GUEST_REGISTRY_ARM_ENABLED=${RECONCILE_GUEST_REGISTRY_ARM_ENABLED:-false}
      # Phase 6-C — generic mirror-table probe: the 8 CT-mirrored
      # legacy_mirror.* tables (cupon / checkin_product / deposit /
      # changed_room / bill_debt_h / bill_debt_ds / rooms_cancel / book_pro)
      # plus canonical ht_room_calendar. Compares ONE UNION-ALL aggregate
      # batch per side (COUNT, MAX(pk), SUM of the money total on the 5
      # tables that carry one) and only pays for a per-key diff when that
      # aggregate disagrees. DETECTION ONLY: it records into
      # ht_reconcile_log and writes nothing else — no ack cache, no new PG
      # table, and no probe key is in FORCE_CONVERGE_VALUE_DRIFT_TABLES /
      # REINGEST_MISSING_PG_TABLES.
      #
      # SHIPS DARK. With this false, run_sync never calls run_mirror_probe,
      # so the probe issues zero MSSQL and zero PG queries. Enable HF VILLE
      # FIRST, soak 48h, then HF Hotel — in an announced window.
      #
      # SCOPE: the legacy scan is floored at MIN(mirror pk) — the mirror's
      # own coverage boundary, derived, never configured. HT_Rooms_Cancel is
      # why: it is the one CT-mirrored table missing from the --bootstrap
      # snapshot set, so 315 of its HF Hotel rows (36 at Ville) predate the
      # mirror and can never converge. Floored, 8 of the 9 probes are
      # EXACTLY converged at both sites today (2026-07-28, read-only).
      #
      # EXPECT A QUIET LEDGER PLUS ONE RECURRING LOG LINE:
      # mirror_ht_room_calendar has a genuine structural gap (1507 in-era
      # legacy rows vs 1298 canonical at HF Hotel; 1302 vs 1071 at Ville),
      # and NOTHING can close it today — the CT mapper permanently NULLs
      # rcal_legacy_id when iHOTEL's MAX+1 allocator rebinds an id, the gap
      # persists even on the business key, no self-heal touches probe keys,
      # and a hand-resolved row is re-minted on the next tick. So that probe
      # is observe_only: it LOGS both counts every tick and records no
      # ht_reconcile_log row (which would otherwise pin the 4h digest and
      # the >72h escalation tier at both sites forever). Issue #273 tracks
      # the calendar business-key arm + remediation path (deferred past 6-D);
      # only when that lands does it start recording.
      - RECONCILE_MIRROR_PROBE_ENABLED=${RECONCILE_MIRROR_PROBE_ENABLED:-false}
      # Phase 6-D — payment-ledger probe: legacy HT_CheckIn_Pay vs canonical
      # ht_payment_ledger, compared per FOLIO (Cin_No) on line count +
      # itemized amount + receipt-deduped ACTIVE tender. The folio is the
      # unit because the CT mapper DELETEs a Cin_No's lines and re-INSERTs
      # the whole current set; the tender dedupe is the house convention
      # (task #63) because iHOTEL replicates the tender split onto every
      # line of a multi-line receipt. DETECTION ONLY: it records into
      # ht_reconcile_log and writes nothing else — no ack cache, no new PG
      # table, and the key is in neither FORCE_CONVERGE_VALUE_DRIFT_TABLES
      # nor REINGEST_MISSING_PG_TABLES.
      #
      # SHIPS DARK. With this false, run_sync never calls the probe, so it
      # issues zero MSSQL and zero PG queries. Enable HF VILLE FIRST, soak
      # 48h, then HF Hotel — in an announced window.
      #
      # SCOPE: the legacy scan is floored at MIN(ledger_legacy_id) — the
      # canonical mirror's own coverage boundary, derived, never configured
      # — as a HAVING over the per-folio MIN, so a folio straddling the
      # boundary is excluded whole rather than compared on a partial line
      # set. Unfloored the first tick would weigh ~20k legacy folios against
      # ~1.3k canonical ones.
      #
      # EXPECT AT HF HOTEL: exactly 19 rows on the first tick (2026-07-28
      # read-only), all missing_pg, contiguous at the era boundary
      # (CH26-004952…CH26-004971 minus CH26-004960) — folios whose payments
      # the Track J7e backfill never reached, i.e. money the round report
      # under-counts today. They are CLOSEABLE: re-drive with
      # `docker compose run --rm backend backfill_payment_ledger` (bin
      # `backfill_payment_ledger`) and the next auto-resolve sweep resolves
      # them. Nothing closes them on its own, and the >72h escalation tier
      # WILL fire if they are left, so pre-set
      # LEGACY_RECONCILE_DRIFT_ALERT_THRESHOLD_<SITE> or flip in a window.
      - RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED=${RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED:-false}
      # ADR 0005 NULL-clear sentinel tripwire (docs/adr/0005-null-clear-sentinel-semantics.md).
      # Two read-only SELECT COUNT(*)s per reconcile tick (HT_Book_H.Book_Cust_ID,
      # HT_CheckIn_H.Cin_cust_no IS NULL) guarding the ADR's one accepted gap: a
      # guarded reconcile-gate term cannot represent a legacy Some->None clear, so
      # a genuine one produces an ht_reconcile_log row that can NEVER auto-close.
      # The owner accepted the gap because the ADR's pre-flight audit found zero
      # rows on both columns at both sites (2026-07-31) and iHOTEL has no code
      # path that writes a literal NULL there (its customer-delete cascade writes
      # the 'C0000' sentinel instead) — so the only live trigger is a legacy
      # hand-edit outside iHOTEL.
      #
      # UNLIKE every Phase 6 reconcile arm above, this defaults ON: it is
      # read-only and writes nothing to legacy or canonical, so it carries none
      # of the "ship dark" risk that gate exists to manage (same posture as
      # CF_AUTO_LOGIN). This backend runs HF Hotel's reconcile; sync-hfville runs
      # Ville's (its own HFVILLE_ override below). Silence with
      # NULL_SENTINEL_TRIPWIRE_ENABLED=false if it ever proves noisy.
      - NULL_SENTINEL_TRIPWIRE_ENABLED=${NULL_SENTINEL_TRIPWIRE_ENABLED:-true}
      # Tracing log level. Default `hotel_backend=info,tower_http=info`
      # matches `main.rs::tracing_subscriber::EnvFilter::try_from_default_env`'s
      # fallback. Override at deploy time to crank up debug logging
      # (e.g. `hotel_backend::scheduler::sync=debug`) for diagnostic
      # windows. Set via GH variable `RUST_LOG`.
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,tower_http=info}
      # Thai national-ID card server-side compositing (routes/guest_documents.rs
      # → render/thai_id_card.rs). BOTH assets now ship IN the image (Dockerfile):
      # the DilleniaUPC-Bold font (exact reference face) and the authoritative
      # template PNG. Defaults below point at those bundled copies — no host mount
      # needed. Override either env to a bind-mounted host path for a custom
      # background/face. If an asset is absent the endpoint returns
      # {success:false, reason:'render_unavailable'} (HTTP 200) and the client
      # falls back to uploading the raw face photo — no 5xx.
      - THAI_ID_TEMPLATE_PATH=${THAI_ID_TEMPLATE_PATH:-/app/assets/thai_id_template.png}
      - THAI_ID_FONT_PATH=${THAI_ID_FONT_PATH:-/usr/share/fonts/truetype/dillenia/DilleniaUPC-Bold.ttf}
      # Dir holding the card-reader middleware installers, served by
      # /api/downloads/middleware/{platform}. Bind-mounted read-only below.
      - MIDDLEWARE_ASSETS_DIR=${MIDDLEWARE_ASSETS_DIR:-/run/assets/middleware}
    secrets:
      - db_password
      - postgres_password
      - ville_db_password
      - slack_webhook_url
    volumes:
      # Thai-ID card template background now ships IN the image (Dockerfile:
      # /app/assets/thai_id_template.png) and is the default THAI_ID_TEMPLATE_PATH,
      # so no host mount is required. To use a site-specific background instead,
      # drop a PNG on the host and re-point the env, e.g.:
      #   - ${ASSETS_DIR:-/home/deploy/assets}/thai_id_template.png:/run/assets/thai_id_template.png:ro
      #   (and set THAI_ID_TEMPLATE_PATH=/run/assets/thai_id_template.png)
      # Card-reader middleware installers (out-of-band host assets, NOT in git),
      # served self-hosted by /api/downloads/middleware/{platform}. Absence just
      # yields 404 from that endpoint. Populate ${ASSETS_DIR}/middleware/ on the
      # host with the release .msi/.exe/.dmg.
      - ${ASSETS_DIR:-/home/deploy/assets}/middleware:/run/assets/middleware:ro
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      # /health is the public, no-auth liveness endpoint. /api/mode used
      # to be the probe but is now behind `require_auth` middleware
      # (Phase 4 cutover) — without a session cookie it returns 401 and
      # would mark this container `unhealthy`. /health is mounted in
      # `health_routes` outside the auth-gated subrouter precisely so
      # ops/healthcheck callers don't need credentials.
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:3003/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M

  # Writeback worker — drains the writeback_jobs outbox into the legacy MSSQL DB
  # via the Phase 4b adapter (per docs/architecture.md §3.6c, §6, §8).
  #
  # Same image as `backend`, different entrypoint. Lives under the `legacy`
  # profile so State C deploys (`docker compose up`) skip it. Activate with:
  #     docker compose --profile legacy up -d
  #
  # When WRITEBACK_ENABLED=false the binary exits cleanly, so it's safe to
  # leave the service registered even mid-cutover.
  writeback:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./writeback"]
    profiles:
      - legacy
    # Security audit 2026-05-14: DB_PASSWORD + pre-baked DATABASE_URL
    # removed from `environment:`. The writeback bin hydrates DB_PASSWORD
    # from /run/secrets/db_password and reconstructs DATABASE_URL from
    # POSTGRES_USER + POSTGRES_PASSWORD (also a secret file) + the
    # NEW_DB_* parts at process start. See hotel-backend/src/secrets.rs.
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      # DB_PASSWORD — sourced from /run/secrets/db_password
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      # PostgreSQL — pieces for DATABASE_URL reconstruction (see
      # hotel-backend/src/secrets.rs::reconstruct_database_url). The
      # POSTGRES_PASSWORD piece comes from /run/secrets/postgres_password.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      # SLACK_WEBHOOK_URL — sourced from /run/secrets/slack_webhook_url
      # Worker-specific knobs (per docs/architecture.md §7)
      - WRITEBACK_ENABLED=${WRITEBACK_ENABLED:-true}
      - WRITEBACK_POLL_INTERVAL_SECS=${WRITEBACK_POLL_INTERVAL_SECS:-30}
      - WRITEBACK_MAX_ATTEMPTS=${WRITEBACK_MAX_ATTEMPTS:-3}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,writeback=info}
    secrets:
      - db_password
      - postgres_password
      - slack_webhook_url
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # The image's baked HEALTHCHECK probes /api/mode (the backend HTTP endpoint).
    # Writeback doesn't bind that port — disable per-service so it's not flagged
    # `unhealthy` and starve restart attempts under `on-failure:5`.
    healthcheck:
      disable: true
    # `on-failure:5` instead of `unless-stopped` so the binary's clean
    # `Ok(0)` exit when WRITEBACK_ENABLED=false does NOT trigger the
    # restart-loop (Docker treats exit 0 as expected under on-failure;
    # the `:5` cap protects against a genuine hot-loop crash).
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # CT watcher worker — Phase 5.5 production cutover. Polls MSSQL Change
  # Tracking on the 10 CT-enabled legacy tables, projects each change into
  # canonical PG state, and publishes one DomainEvent per aggregate per
  # tick. Per docs/architecture.md §3.6d, §8 Phase 5 / 5.5.
  #
  # Same image as `backend`, different entrypoint. Lives under the `legacy`
  # profile so State C deploys (`docker compose up`) skip it. Activate with:
  #     docker compose --profile legacy up -d
  #
  # CRITICAL: ships default-DISABLED. Operator flips LEGACY_SYNC_ENABLED=true
  # AFTER running `docker compose --profile legacy run --rm sync ./sync --bootstrap`
  # once to seed the canonical state + watermark. See docs/runbook-sync.md.
  #
  # When LEGACY_SYNC_ENABLED=false the binary exits cleanly, so it's safe to
  # leave the service registered even mid-cutover.
  sync:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./sync"]
    profiles:
      - legacy
    # Security audit 2026-05-14: same secret-file migration as the
    # writeback service — DB_PASSWORD, POSTGRES_PASSWORD (for the
    # reconstructed DATABASE_URL), and SLACK_WEBHOOK_URL are now mounted
    # as files under /run/secrets/.
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      # DB_PASSWORD — sourced from /run/secrets/db_password
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      # PostgreSQL DATABASE_URL — reconstructed at startup from these
      # pieces plus the POSTGRES_PASSWORD secret file.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      # Slack notifier — schema fingerprint drift and CT retention overflow
      # alert here. (Removed 2026-07-28: a "mapper consecutive-failure
      # threshold" claim describing a breaker that does not exist. The
      # nearest real knobs, LEGACY_SYNC_OUTAGE_ALERT_THRESHOLD /
      # _COOLDOWN_SECS, were deleted 2026-06-30 as parsed-but-dead; a
      # sustained unreachable legacy is paged by the watchdog's probe-outage
      # escalation instead.)
      # SLACK_WEBHOOK_URL — sourced from /run/secrets/slack_webhook_url
      - SLACK_NOTIFICATIONS_ENABLED=true
      # Phase 5.5 watcher knobs (per docs/architecture.md §3.6d, §7).
      # MUST stay default-false. Operator flip is the cutover step.
      - LEGACY_SYNC_ENABLED=${LEGACY_SYNC_ENABLED:-false}
      # Default-on for first deploy: shadow mode runs the full pipeline
      # (read CT, dispatch mappers, build events) but rolls back the PG
      # TX so canonical state stays untouched. Lets operators soak the
      # mappers against live traffic before flipping live.
      - LEGACY_SYNC_SHADOW_MODE=${LEGACY_SYNC_SHADOW_MODE:-true}
      # Empty allowlist = poll every CT-enabled table. Comma-separated
      # subset (e.g. `HT_Customers,HT_Rooms`) narrows the watcher during
      # incremental rollout.
      - LEGACY_SYNC_TABLE_ALLOWLIST=${LEGACY_SYNC_TABLE_ALLOWLIST:-}
      # Sub-second polling target per architecture §3.6d.
      - CT_POLL_INTERVAL_MS=${CT_POLL_INTERVAL_MS:-1000}
      # CT keep-warm (2026-06-30): periodically run a read-only
      # CHANGE_TRACKING_CURRENT_VERSION() so the CT machinery stays hot on
      # a quiescent overnight iHOTEL and the watchdog stall probe stops
      # timing out. 45s sits under the 60s pool idle_timeout / watchdog
      # interval. 0 disables. See docs/runbook-sync.md §2.
      - LEGACY_SYNC_CT_KEEPALIVE_SECS=${LEGACY_SYNC_CT_KEEPALIVE_SECS:-45}
      # Cold-replay refusal: if last_seen_version=0 the watcher refuses
      # to start unless explicitly overridden — protects against the
      # "process every CT row from time-zero" footgun. Operator flips
      # via `--bootstrap` (preferred) or this env var (escape hatch).
      - LEGACY_SYNC_ALLOW_COLD_REPLAY=${LEGACY_SYNC_ALLOW_COLD_REPLAY:-false}
      # Per-table CT watermarks (Resilience PR R3, migration 050). OFF = the
      # single-row `legacy_ct_state` gates every table, so a row-lock wedge on
      # one hot table stalls all 19. ON = each table advances independently
      # from `legacy_ct_state_per_table`.
      #
      # SAFE to enable since #259 (the global row is now written as a
      # conservative min-of-per-table floor, and the watchdog names the stalest
      # table), but left OFF: the stall it prevents is loud, bounded (~2 days
      # of CT retention) and rare — one 74-min instance in ~2.5 months. Enable
      # if a wedge actually happens, not as routine hygiene.
      # Procedure + 24h soak checklist: RUNBOOK-reconcile-flag-flips.md §2.
      - SYNC_PER_TABLE_WATERMARK=${SYNC_PER_TABLE_WATERMARK:-false}
      # Self-healing re-ingest arm for the reconcile sweep's `missing_pg` rows
      # (dropped legacy changes). INERT in this process — only a process that
      # runs a reconcile reads it, and this HF Hotel sync worker leaves
      # WORKER_RECONCILE_ENABLED at its default-false. It takes effect on
      # `backend` (HF Hotel) and `sync-hfville` (Ville). Kept in step with the
      # backend default purely so the two never read differently for HF Hotel;
      # if WORKER_RECONCILE_ENABLED is ever turned on here, this is already
      # correct rather than silently stale.
      - RECONCILE_REINGEST_MISSING_PG_ENABLED=${RECONCILE_REINGEST_MISSING_PG_ENABLED:-true}
      # Phase 6-A `payments` reconcile arm — INERT in this process for the same
      # reason as the re-ingest knob above (only a process that runs a reconcile
      # reads it, and this HF Hotel sync worker leaves WORKER_RECONCILE_ENABLED
      # at its default-false). Carried here so the two HF Hotel processes never
      # read differently. Ships DARK; see the backend service for the rollout.
      - RECONCILE_PAYMENTS_ARM_ENABLED=${RECONCILE_PAYMENTS_ARM_ENABLED:-false}
      # Phase 6-B `guest_registry` (companion folio) reconcile arm — INERT in
      # this process for the same reason as the two knobs above. Carried here
      # so the two HF Hotel processes never read differently. Ships DARK; see
      # the backend service for the rollout.
      - RECONCILE_GUEST_REGISTRY_ARM_ENABLED=${RECONCILE_GUEST_REGISTRY_ARM_ENABLED:-false}
      # Phase 6-C mirror-table probe — INERT in this process for the same
      # reason as the knobs above (only a process that runs a reconcile
      # reads it, and this HF Hotel sync worker leaves WORKER_RECONCILE_ENABLED
      # at its default-false). Carried here so the two HF Hotel processes
      # never read differently. Ships DARK; see the backend service for the
      # rollout and for what the first enabled tick is expected to say.
      - RECONCILE_MIRROR_PROBE_ENABLED=${RECONCILE_MIRROR_PROBE_ENABLED:-false}
      # Phase 6-D payment-ledger probe — INERT in this process for the same
      # reason as the knobs above (only a process that runs a reconcile reads
      # it, and this HF Hotel sync worker leaves WORKER_RECONCILE_ENABLED at
      # its default-false). Carried here so the two HF Hotel processes never
      # read differently. Ships DARK; see the backend service for the rollout
      # and for what the first enabled tick is expected to open.
      - RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED=${RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED:-false}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,sync=info}
    secrets:
      - db_password
      - postgres_password
      - slack_webhook_url
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # See the writeback healthcheck note — the image's baked /api/mode probe
    # doesn't apply to this binary either.
    healthcheck:
      disable: true
    # `on-failure:5` instead of `unless-stopped` so the binary's clean
    # `Ok(0)` exit when LEGACY_SYNC_ENABLED=false (the default) does NOT
    # trigger the restart-loop. Same reasoning as the writeback service.
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # =========================================================================
  # HF Ville stack — Phase 5 (Ville) multi-site deploy.
  # Per ADR 0001 the Ville backend stack runs CENTRAL on evergreen, talking
  # to Ville's MSSQL via WG (10.10.10.4 → MikroTik DNAT → 192.168.11.51,1436)
  # and writing canonical state into the `hotelville` PG database (sibling
  # of `hotelnew` in the same `newdb` cluster — see init-db/01-create-...).
  #
  # NO separate backend container — the existing `backend` service's
  # `ville_pool` will repoint at hotelville at cutover (#76). These two
  # services are just the worker pair (CT watcher + writeback LISTEN'er)
  # for the Ville pipeline.
  #
  # Profile `hfville` keeps both services INERT until the operator opts in:
  #     docker compose --profile hfville up -d
  # On first activation each service ships LEGACY_SYNC_ENABLED=false /
  # WRITEBACK_ENABLED=false so they exit cleanly (`Ok(0)` → `restart:
  # on-failure:5` does NOT loop). The shadow-mode flip happens via env at
  # task #74 (bootstrap), live flip at #76 (cutover).
  #
  # Container names suffixed `-hfville` so they never collide with HF
  # Hotel's `sync` / `writeback` containers under the same compose project.
  # =========================================================================
  sync-hfville:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    container_name: new-hotel-production-sync-hfville-1
    command: ["./sync"]
    profiles:
      - hfville
    # Security audit 2026-05-14: same secret-file migration as the
    # HF Hotel sync service. Note `NEW_DB_NAME=hotelville` — that's the
    # per-service override the hydrator's DATABASE_URL reconstruction
    # picks up to point at the sibling logical PG database (per ADR 0001
    # per-DB topology). Replaces the pre-baked
    # `postgres://...${POSTGRES_PASSWORD}...@newdb:.../hotelville` URL.
    environment:
      # Ville legacy MSSQL via WG path (DNAT through MikroTik).
      - DB_SERVER=192.168.11.51
      - DB_NAME=HOTEL
      - DB_USER=sa
      # DB_PASSWORD — sourced from /run/secrets/db_password. Reusing it
      # for now: both sites' legacy MSSQL share the same `sa` credential.
      # Split into a HFVILLE-specific secret file when one site rotates
      # ahead of the other (see ADR 0001 Phase 8 ops-hardening notes;
      # gated on iHOTEL2025 vendor coordination).
      - MSSQL_PORT=1436
      # PostgreSQL DATABASE_URL — reconstructed at startup from these
      # pieces plus the POSTGRES_PASSWORD secret file. NEW_DB_NAME wins
      # over POSTGRES_DB so the hfhotel cluster password targets the
      # sibling `hotelville` DB.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_NAME=hotelville
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      # SLACK_WEBHOOK_URL — sourced from /run/secrets/slack_webhook_url
      - SLACK_NOTIFICATIONS_ENABLED=true
      # Site identity for alert prefixes + tracing spans + healthcheck JSON
      # (see hotel-backend/src/notifications/slack.rs::format_site_prefixed).
      - SITE_ID=hfville
      # Phase 5 Ville cutover (#76, 2026-04-30) is LIVE — shadow_mode default
      # flipped from `true` (soak) to `false` (production) so the next CI
      # deploy doesn't silently revert the cutover. The `.env` file gets
      # rewritten from GH secrets on every deploy, so this default MUST be
      # the desired post-cutover value or the operator-set HFVILLE_LEGACY_SYNC_SHADOW_MODE
      # in `.env` gets wiped on each push and the watcher reverts to TX-rollback.
      # Operator can still set HFVILLE_LEGACY_SYNC_SHADOW_MODE=true in .env to
      # re-soak (e.g. for rollback) and that will win over this default.
      - LEGACY_SYNC_ENABLED=${HFVILLE_LEGACY_SYNC_ENABLED:-true}
      - LEGACY_SYNC_SHADOW_MODE=${HFVILLE_LEGACY_SYNC_SHADOW_MODE:-false}
      # Task #67 — per-site reconcile safety net. The backend scheduler's
      # 15-min diff-only reconcile runs ONLY for HF Hotel (against hotelnew);
      # HF Ville had no drift backstop, so a dropped CT event went undetected
      # (2026-06-28 room-114 / cin 19906). This worker holds Ville's MSSQL +
      # hotelville pools, so it runs Ville's reconcile here. ON for sync-hfville
      # only; HF Hotel keeps its single backend-side reconcile (no double-run).
      - WORKER_RECONCILE_ENABLED=${HFVILLE_WORKER_RECONCILE_ENABLED:-true}
      # Self-healing force-converge for Ville's reconcile (sibling of the
      # backend's RECONCILE_FORCE_CONVERGE_ENABLED above). Separate HFVILLE_
      # default so we can enable Ville-first and soak before HF Hotel — Ville
      # carries the reconcile-drift history (#69).
      # LIVE VALUE — see the flag-state block on the backend service (ADR 0004).
      - RECONCILE_FORCE_CONVERGE_ENABLED=${HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED:-true}
      # Phase 5.5b Ville cutover (#80, 2026-04-30): allowlist cleared
      # post-021. Empty = poll every CT-enabled table (all 16 now). The
      # explicit 11-table list was Phase 5 only; with mirror tables CT-
      # enabled the watcher needs to see them too. Operator can still
      # narrow via HFVILLE_LEGACY_SYNC_TABLE_ALLOWLIST=HT_X,HT_Y to
      # debug a specific table.
      - LEGACY_SYNC_TABLE_ALLOWLIST=${HFVILLE_LEGACY_SYNC_TABLE_ALLOWLIST:-}
      - CT_POLL_INTERVAL_MS=${HFVILLE_CT_POLL_INTERVAL_MS:-1000}
      # CT keep-warm: wired but default-OFF for Ville (its WG tunnel flaps
      # ~2min every couple of days; the per-tick query is harmless during a
      # flap but we enable site-by-site). Flip HFVILLE_LEGACY_SYNC_CT_KEEPALIVE_SECS=45
      # in .env to enable — no code change. See docs/runbook-sync.md §2.
      - LEGACY_SYNC_CT_KEEPALIVE_SECS=${HFVILLE_LEGACY_SYNC_CT_KEEPALIVE_SECS:-0}
      - LEGACY_SYNC_ALLOW_COLD_REPLAY=${HFVILLE_LEGACY_SYNC_ALLOW_COLD_REPLAY:-false}
      # Per-table CT watermarks (Resilience PR R3, migration 050) — sibling of
      # the sync service's SYNC_PER_TABLE_WATERMARK above.
      #
      # SAFE to enable since #259: under per-table mode `run_one_tick` now
      # writes the global row as a conservative floor (the MINIMUM per-table
      # watermark across polled tables), so it no longer freezes and the
      # watchdog / /health / sync-status.sh keep working; the watchdog also
      # names the stalest table. The refuse-to-start guard is gone.
      #
      # Left OFF deliberately — the wedge it prevents is loud, bounded (~2 days
      # of CT retention) and rare. Ville is the canary if you do enable it.
      # Migration 078's reseed is done (Ville's rows were pinned at 9060 against
      # a global of 37843). Procedure + 24h soak checklist:
      # docs/coexistence/RUNBOOK-reconcile-flag-flips.md §2.
      - SYNC_PER_TABLE_WATERMARK=${HFVILLE_SYNC_PER_TABLE_WATERMARK:-false}
      # Self-healing re-ingest arm for `missing_pg` reconcile rows (dropped CT
      # events) — sibling of the backend's RECONCILE_REINGEST_MISSING_PG_ENABLED.
      # This worker DOES run Ville's reconcile (WORKER_RECONCILE_ENABLED above),
      # so the knob is live here. Per-site so Ville canaries first. Ships dark.
      - RECONCILE_REINGEST_MISSING_PG_ENABLED=${HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED:-true}
      # Phase 6-A — `payments` reconcile arm (legacy HT_Receipt_H ↔ canonical
      # ht_payments, keyed on Receipt_no). DETECTION ONLY; writes nothing but
      # its own ack cache (ht_receipts_legacy, migration 080). This worker runs
      # Ville's reconcile, so the knob is LIVE here — and Ville is the canary
      # for it: enable HERE first, soak 48h, then flip the backend (HF Hotel).
      # Ships DARK. NOTE the canary is WEAK by construction: Ville has 105
      # ref-carrying legacy receipts vs 4 canonical payments, so a green Ville
      # soak says nothing about HF Hotel's 21.5k-receipt history — that is what
      # the canonical era floor (PAYMENTS_ERA_FLOOR_SQL) exists to bound, not
      # this soak. Findings need operator action; nothing here auto-closes.
      # ENABLED 2026-07-29 (T2 rollout step 1 of 8): Ville canary live, 48h
      # soak before flipping the backend (HF Hotel) default above.
      - RECONCILE_PAYMENTS_ARM_ENABLED=${HFVILLE_RECONCILE_PAYMENTS_ARM_ENABLED:-true}
      # Phase 6-B — `guest_registry` (companion folio) reconcile arm (legacy
      # HT_CheckIn_Other_People ↔ canonical ht_guest_registry, keyed on Cin_no,
      # compared per FOLIO). DETECTION ONLY; writes nothing but its own ack
      # cache (ht_guest_registry_legacy, migration 081). This worker runs
      # Ville's reconcile, so the knob is LIVE here — and Ville is the canary:
      # enable HERE first, soak 48h, then flip the backend (HF Hotel).
      # Ships DARK. Unlike the payments canary this one is REPRESENTATIVE:
      # Ville has 2,184 legacy companion folios and 545 canonical ones, the
      # same shape and era boundary as HF Hotel, so the ~29 first-enable finds
      # here really do predict HF Hotel's ~12. Findings need operator action;
      # nothing here auto-closes, and a TM.30 under-count is the exact class
      # this arm exists to surface.
      # ENABLED 2026-07-31 (T2 rollout step 3 of 8). Ville is the canary and
      # this arm is the REPRESENTATIVE one — 2,184 legacy companion folios vs
      # 545 canonical here, the same shape and era boundary as HF Hotel, so
      # the ~29 first-enable finds really do predict HF Hotel's ~12. Soak 48h
      # before flipping the backend (step 4). Findings need operator triage;
      # nothing auto-closes, and a TM.30 under-count is exactly the class
      # this arm exists to surface.
      - RECONCILE_GUEST_REGISTRY_ARM_ENABLED=${HFVILLE_RECONCILE_GUEST_REGISTRY_ARM_ENABLED:-true}
      # Phase 6-C — generic mirror-table probe (8 legacy_mirror.* tables +
      # ht_room_calendar). DETECTION ONLY; writes nothing but
      # ht_reconcile_log — no ack cache and no new PG table. This worker runs
      # Ville's reconcile, so the knob is LIVE here — and Ville is the canary:
      # enable HERE first, soak 48h, then flip the backend (HF Hotel).
      # Ships DARK. The canary is REPRESENTATIVE for the 8 mirror tables
      # (Ville is exactly converged on all of them once floored, same as HF
      # Hotel) and for the calendar gap, which Ville has in a WORSE ratio
      # (1302 in-era legacy rows vs 1071 canonical, against 1507 vs 1298).
      # So a green 48h soak here really does predict HF Hotel. The calendar
      # gap is observe_only — logged with both counts each tick, never
      # recorded into ht_reconcile_log, because no sweep or self-heal can
      # close such a row and a hand-resolved one re-mints itself. It starts
      # recording only when a closure path lands (issue #273; deferred
      # past 6-D).
      # ENABLED 2026-07-31 — PULLED FORWARD out of rollout order (was step 7/8).
      # It was scheduled last for exactly one reason: the calendar gap would
      # open a durable row no sweep could ever close. That reason is gone —
      # backfill_room_calendar closed the deficit on both sites the same day
      # (HF Hotel +3,137 nights, Ville +513, surplus rows untouched), and the
      # 8 legacy_mirror.* tables were already exactly converged once floored.
      # So this arm should now find NOTHING, and that silence is the proof
      # issue #273 needs before it can close. If it does fire, that is a real
      # finding worth having today rather than a week from now.
      - RECONCILE_MIRROR_PROBE_ENABLED=${HFVILLE_RECONCILE_MIRROR_PROBE_ENABLED:-true}
      # Phase 6-D — payment-ledger per-folio probe (HT_CheckIn_Pay ↔
      # ht_payment_ledger). DETECTION ONLY; writes nothing but
      # ht_reconcile_log — no ack cache and no new PG table. This worker runs
      # Ville's reconcile, so the knob is LIVE here — and Ville is the canary:
      # enable HERE first, soak 48h, then flip the backend (HF Hotel).
      # Ships DARK. Ville is EXACTLY converged today (2026-07-28, read-only:
      # 1016 in-era folios, identical line counts, itemized amounts AND
      # receipt-deduped tenders on both sides), so a green soak here is a
      # clean baseline rather than proof the detector fires — HF Hotel is
      # where the 19 known missing_pg folios live. Watch for a QUIET ledger;
      # anything new here is a genuine mirror gap in the money the round
      # report reads, remediable with the backfill_payment_ledger bin.
      - RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED=${HFVILLE_RECONCILE_PAYMENT_LEDGER_PROBE_ENABLED:-false}
      # ADR 0005 NULL-clear sentinel tripwire — see the backend service's
      # comment for the full rationale. This worker runs Ville's reconcile,
      # so the knob is LIVE here (not the inert-carried-for-parity pattern
      # the other RECONCILE_* arms use). Read-only, writes nothing, so —
      # unlike those — it defaults ON rather than shipping dark.
      - NULL_SENTINEL_TRIPWIRE_ENABLED=${HFVILLE_NULL_SENTINEL_TRIPWIRE_ENABLED:-true}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,sync=info}
    secrets:
      - db_password
      - postgres_password
      - slack_webhook_url
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      disable: true
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  writeback-hfville:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    container_name: new-hotel-production-writeback-hfville-1
    command: ["./writeback"]
    profiles:
      - hfville
    # Security audit 2026-05-14: same secret-file migration as the
    # HF Hotel writeback service. `NEW_DB_NAME=hotelville` makes the
    # hydrator's reconstructed DATABASE_URL target the Ville logical DB.
    environment:
      - DB_SERVER=192.168.11.51
      - DB_NAME=HOTEL
      - DB_USER=sa
      # DB_PASSWORD — sourced from /run/secrets/db_password
      - MSSQL_PORT=1436
      # PostgreSQL DATABASE_URL — reconstructed at startup from these
      # pieces plus the POSTGRES_PASSWORD secret file.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_NAME=hotelville
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      # SLACK_WEBHOOK_URL — sourced from /run/secrets/slack_webhook_url
      - SITE_ID=hfville
      # Default ON post-#76 cutover (2026-04-30): mirrors the sync-hfville
      # default flip pattern. The Ville legacy app is still active at the
      # receptionist desk, so canonical-PG → Ville-MSSQL writeback must run
      # for nightly billing/reports to see new bookings. Operator can flip
      # HFVILLE_WRITEBACK_ENABLED=false in .env to pause (e.g. during a
      # MSSQL-side incident) and that override will win over this default.
      - WRITEBACK_ENABLED=${HFVILLE_WRITEBACK_ENABLED:-true}
      - WRITEBACK_POLL_INTERVAL_SECS=${HFVILLE_WRITEBACK_POLL_INTERVAL_SECS:-30}
      - WRITEBACK_MAX_ATTEMPTS=${HFVILLE_WRITEBACK_MAX_ATTEMPTS:-3}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,writeback=info}
    secrets:
      - db_password
      - postgres_password
      - slack_webhook_url
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      disable: true
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # One-shot backfill: legacy MSSQL HT_Rooms + HT_SET_RoomType -> PG.
  # Same image as `backend`, different entrypoint. Lives under the `backfill`
  # profile so normal `docker compose up` skips it. Activate on demand:
  #     docker compose --profile backfill run --rm backfill-rooms
  # Idempotent — safe to re-run after legacy room edits.
  backfill-rooms:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./backfill_rooms"]
    profiles:
      - backfill
    # Security audit 2026-05-14: DB_PASSWORD + pre-baked DATABASE_URL
    # moved to secret-file hydration. Backfill is one-shot, so an operator
    # running this without secrets mounted would hit the loud `require_secret`
    # panic — same failure mode as missing GH secrets in CI today.
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      # DB_PASSWORD — sourced from /run/secrets/db_password
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      # DATABASE_URL — reconstructed by the hydrator from these pieces +
      # the POSTGRES_PASSWORD secret file.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - RUST_LOG=${RUST_LOG:-backfill_rooms=info}
    secrets:
      - db_password
      - postgres_password
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # No restart: this is a one-shot job. `--rm` cleans up the container.

  # Track J7e — one-shot backfill of `ht_payment_ledger` from legacy
  # `HT_CheckIn_Pay` (READ-ONLY on MSSQL). Makes the round-close report
  # accurate for current/recent rounds instead of forward-only. Idempotent.
  #     docker compose --profile backfill run --rm backfill-payment-ledger
  backfill-payment-ledger:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./backfill_payment_ledger"]
    profiles:
