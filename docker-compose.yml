services:
  # PostgreSQL container for HotelNew database (self-hosted)
  newdb:
    image: postgres:17-alpine
    container_name: new-hotel-db
    environment:
      - POSTGRES_DB=hotelnew
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=***REMOVED***
      - PGPORT=5439
    volumes:
      - newdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5439"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    environment:
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
    depends_on:
      - backend
    networks:
      - hotel-network
    restart: unless-stopped

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      # New database (PostgreSQL Docker container - owned by this application)
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=5439
      - NEW_DB_NAME=hotelnew
      - NEW_DB_USER=postgres
      - NEW_DB_PASSWORD=***REMOVED***
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=new
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      - HOST=0.0.0.0
      - PORT=3003
      # HF Ville database (PostgreSQL mirror via cloudflared tunnel)
      - VILLE_DB_SERVER=ville-tunnel
      - VILLE_DB_PORT=5440
      - VILLE_DB_NAME=hfville
      - VILLE_DB_USER=postgres
      - VILLE_DB_PASSWORD=***REMOVED***
      - VILLE_DB_ENABLED=${VILLE_DB_ENABLED:-false}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

  # SSH tunnel to HF Ville PostgreSQL mirror (on jump box 192.168.11.147)
  ville-tunnel:
    image: alpine:3.21
    container_name: ville-tunnel
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache openssh-client autossh &&
        chmod 600 /root/.ssh/id_rsa &&
        exec autossh -M 0 -N \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -L 0.0.0.0:5440:localhost:5440 \
          nut@192.168.11.147
    volumes:
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
    networks:
      - hotel-network
    restart: unless-stopped

volumes:
  newdb_data:

networks:
  hotel-network:
    driver: bridge
