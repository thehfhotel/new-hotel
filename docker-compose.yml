services:
  # PostgreSQL container for HotelNew database (self-hosted)
  newdb:
    image: postgres:17-alpine
    container_name: new-hotel-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPORT=${PGPORT:-5439}
    volumes:
      - newdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "10.10.10.4:5441:5439"  # Expose on WireGuard interface for ville_sync push
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5439"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # New database (PostgreSQL Docker container - owned by this application)
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - NEW_DB_NAME=${POSTGRES_DB}
      - NEW_DB_USER=${POSTGRES_USER}
      - NEW_DB_PASSWORD=${POSTGRES_PASSWORD}
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=new
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      - HOST=0.0.0.0
      - PORT=3003
      # HF Ville — reads from local newdb ville schema (pushed by ville_sync)
      - VILLE_DB_ENABLED=${VILLE_DB_ENABLED:-true}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      # /api/mode is a cheap, dependency-light endpoint that confirms the
      # backend has bound to the port and answered an HTTP request.
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:3003/api/mode > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Writeback worker — drains the writeback_jobs outbox into the legacy MSSQL DB
  # via the Phase 4b adapter (per docs/architecture.md §3.6c, §6, §8).
  #
  # Same image as `backend`, different entrypoint. Lives under the `legacy`
  # profile so State C deploys (`docker compose up`) skip it. Activate with:
  #     docker compose --profile legacy up -d
  #
  # When WRITEBACK_ENABLED=false the binary exits cleanly, so it's safe to
  # leave the service registered even mid-cutover.
  writeback:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./writeback"]
    profiles:
      - legacy
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # PostgreSQL — same DSN the backend uses, but with explicit URL form
      # because the writeback bin reads DATABASE_URL directly (no AppConfig).
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@newdb:${PGPORT:-5439}/${POSTGRES_DB}
      # Worker-specific knobs (per docs/architecture.md §7)
      - WRITEBACK_ENABLED=${WRITEBACK_ENABLED:-true}
      - WRITEBACK_POLL_INTERVAL_SECS=${WRITEBACK_POLL_INTERVAL_SECS:-30}
      - WRITEBACK_MAX_ATTEMPTS=${WRITEBACK_MAX_ATTEMPTS:-3}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,writeback=info}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

  # One-shot backfill: legacy MSSQL HT_Rooms + HT_SET_RoomType -> PG.
  # Same image as `backend`, different entrypoint. Lives under the `backfill`
  # profile so normal `docker compose up` skips it. Activate on demand:
  #     docker compose --profile backfill run --rm backfill-rooms
  # Idempotent — safe to re-run after legacy room edits.
  backfill-rooms:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./backfill_rooms"]
    profiles:
      - backfill
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@newdb:${PGPORT:-5439}/${POSTGRES_DB}
      - RUST_LOG=${RUST_LOG:-backfill_rooms=info}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # No restart: this is a one-shot job. `--rm` cleans up the container.

volumes:
  newdb_data:

networks:
  hotel-network:
    driver: bridge
