services:
  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    environment:
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    environment:
      # Legacy database (shared with legacy application)
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      # New database (owned by this application)
      - NEW_DB_SERVER=192.168.100.222
      - NEW_DB_NAME=HotelNew
      - NEW_DB_USER=sa
      - NEW_DB_PASSWORD=***REMOVED***
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=legacy
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      - HOST=0.0.0.0
      - PORT=3003
    restart: unless-stopped
