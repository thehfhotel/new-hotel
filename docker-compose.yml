services:
  # SQL Server container for HotelNew database (self-hosted)
  newdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: new-hotel-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=***REMOVED***
      - MSSQL_PID=Express
    volumes:
      - newdb_data:/var/opt/mssql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - hotel-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "***REMOVED***" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    environment:
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
    depends_on:
      - backend
    networks:
      - hotel-network
    restart: unless-stopped

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=192.168.100.222
      - DB_NAME=db
      - DB_USER=sa
      - DB_PASSWORD=***REMOVED***
      # New database (Docker container - owned by this application)
      - NEW_DB_SERVER=newdb
      - NEW_DB_NAME=HotelNew
      - NEW_DB_USER=sa
      - NEW_DB_PASSWORD=***REMOVED***
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=new
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      - HOST=0.0.0.0
      - PORT=3003
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    restart: unless-stopped

volumes:
  newdb_data:

networks:
  hotel-network:
    driver: bridge
