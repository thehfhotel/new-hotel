services:
  # PostgreSQL container for HotelNew database (self-hosted)
  newdb:
    # Pinned to digest (Batch C of post-Phase-5.5 audit). Source: Docker Hub
    # API `library/postgres/tags/17-alpine` on 2026-04-26. Dependabot
    # (`docker` ecosystem) will surface new digests as PRs.
    image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    container_name: new-hotel-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGPORT=${PGPORT:-5439}
    volumes:
      - newdb_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "10.10.10.4:5441:5439"  # Expose on WireGuard interface for ville_sync push
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5439"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Resource ceiling — newdb is the heaviest service (Phase 5.5 CT
    # watcher amplifies write volume). 2G cap leaves enough headroom on
    # the evergreen 8G host while protecting other services from a
    # runaway query.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M

  web:
    image: ghcr.io/thehfhotel/new-hotel:latest
    ports:
      - "3003:3003"
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=false
      - BACKEND_URL=http://backend:3003
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      # `wget --spider` returns non-zero on connection refused / non-2xx.
      # node:alpine ships wget; no extra package needed. Hitting the
      # root path is enough to confirm Next.js bound the port and is
      # serving — a deeper API probe would couple us to backend health.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3003 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  backend:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # New database (PostgreSQL Docker container - owned by this application)
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - NEW_DB_NAME=${POSTGRES_DB}
      - NEW_DB_USER=${POSTGRES_USER}
      - NEW_DB_PASSWORD=${POSTGRES_PASSWORD}
      # System mode: 'legacy' or 'new' (controls which database is primary)
      - SYSTEM_MODE=new
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      - HOST=0.0.0.0
      - PORT=3003
      # HF Ville — reads from local newdb ville schema (pushed by ville_sync)
      - VILLE_DB_ENABLED=${VILLE_DB_ENABLED:-true}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    healthcheck:
      # /api/mode is a cheap, dependency-light endpoint that confirms the
      # backend has bound to the port and answered an HTTP request.
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:3003/api/mode > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M

  # Writeback worker — drains the writeback_jobs outbox into the legacy MSSQL DB
  # via the Phase 4b adapter (per docs/architecture.md §3.6c, §6, §8).
  #
  # Same image as `backend`, different entrypoint. Lives under the `legacy`
  # profile so State C deploys (`docker compose up`) skip it. Activate with:
  #     docker compose --profile legacy up -d
  #
  # When WRITEBACK_ENABLED=false the binary exits cleanly, so it's safe to
  # leave the service registered even mid-cutover.
  writeback:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./writeback"]
    profiles:
      - legacy
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # PostgreSQL — same DSN the backend uses, but with explicit URL form
      # because the writeback bin reads DATABASE_URL directly (no AppConfig).
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@newdb:${PGPORT:-5439}/${POSTGRES_DB}
      # Worker-specific knobs (per docs/architecture.md §7)
      - WRITEBACK_ENABLED=${WRITEBACK_ENABLED:-true}
      - WRITEBACK_POLL_INTERVAL_SECS=${WRITEBACK_POLL_INTERVAL_SECS:-30}
      - WRITEBACK_MAX_ATTEMPTS=${WRITEBACK_MAX_ATTEMPTS:-3}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,writeback=info}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # `on-failure:5` instead of `unless-stopped` so the binary's clean
    # `Ok(0)` exit when WRITEBACK_ENABLED=false does NOT trigger the
    # restart-loop (Docker treats exit 0 as expected under on-failure;
    # the `:5` cap protects against a genuine hot-loop crash).
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # CT watcher worker — Phase 5.5 production cutover. Polls MSSQL Change
  # Tracking on the 10 CT-enabled legacy tables, projects each change into
  # canonical PG state, and publishes one DomainEvent per aggregate per
  # tick. Per docs/architecture.md §3.6d, §8 Phase 5 / 5.5.
  #
  # Same image as `backend`, different entrypoint. Lives under the `legacy`
  # profile so State C deploys (`docker compose up`) skip it. Activate with:
  #     docker compose --profile legacy up -d
  #
  # CRITICAL: ships default-DISABLED. Operator flips LEGACY_SYNC_ENABLED=true
  # AFTER running `docker compose --profile legacy run --rm sync ./sync --bootstrap`
  # once to seed the canonical state + watermark. See docs/runbook-sync.md.
  #
  # When LEGACY_SYNC_ENABLED=false the binary exits cleanly, so it's safe to
  # leave the service registered even mid-cutover.
  sync:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./sync"]
    profiles:
      - legacy
    environment:
      # Legacy database (external server - shared with legacy application)
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # PostgreSQL — same DSN the writeback worker uses, explicit URL form
      # because the sync bin reads DATABASE_URL directly (no AppConfig).
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@newdb:${PGPORT:-5439}/${POSTGRES_DB}
      # Slack notifier — schema fingerprint drift, CT retention overflow,
      # mapper consecutive-failure threshold all alert here.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_NOTIFICATIONS_ENABLED=true
      # Phase 5.5 watcher knobs (per docs/architecture.md §3.6d, §7).
      # MUST stay default-false. Operator flip is the cutover step.
      - LEGACY_SYNC_ENABLED=${LEGACY_SYNC_ENABLED:-false}
      # Default-on for first deploy: shadow mode runs the full pipeline
      # (read CT, dispatch mappers, build events) but rolls back the PG
      # TX so canonical state stays untouched. Lets operators soak the
      # mappers against live traffic before flipping live.
      - LEGACY_SYNC_SHADOW_MODE=${LEGACY_SYNC_SHADOW_MODE:-true}
      # Empty allowlist = poll every CT-enabled table. Comma-separated
      # subset (e.g. `HT_Customers,HT_Rooms`) narrows the watcher during
      # incremental rollout.
      - LEGACY_SYNC_TABLE_ALLOWLIST=${LEGACY_SYNC_TABLE_ALLOWLIST:-}
      # Sub-second polling target per architecture §3.6d.
      - CT_POLL_INTERVAL_MS=${CT_POLL_INTERVAL_MS:-1000}
      # Cold-replay refusal: if last_seen_version=0 the watcher refuses
      # to start unless explicitly overridden — protects against the
      # "process every CT row from time-zero" footgun. Operator flips
      # via `--bootstrap` (preferred) or this env var (escape hatch).
      - LEGACY_SYNC_ALLOW_COLD_REPLAY=${LEGACY_SYNC_ALLOW_COLD_REPLAY:-false}
      - RUST_LOG=${RUST_LOG:-hotel_backend=info,sync=info}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # `on-failure:5` instead of `unless-stopped` so the binary's clean
    # `Ok(0)` exit when LEGACY_SYNC_ENABLED=false (the default) does NOT
    # trigger the restart-loop. Same reasoning as the writeback service.
    restart: on-failure:5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M

  # One-shot backfill: legacy MSSQL HT_Rooms + HT_SET_RoomType -> PG.
  # Same image as `backend`, different entrypoint. Lives under the `backfill`
  # profile so normal `docker compose up` skips it. Activate on demand:
  #     docker compose --profile backfill run --rm backfill-rooms
  # Idempotent — safe to re-run after legacy room edits.
  backfill-rooms:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./backfill_rooms"]
    profiles:
      - backfill
    environment:
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@newdb:${PGPORT:-5439}/${POSTGRES_DB}
      - RUST_LOG=${RUST_LOG:-backfill_rooms=info}
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network
    # No restart: this is a one-shot job. `--rm` cleans up the container.

volumes:
  newdb_data:

networks:
  hotel-network:
    driver: bridge
