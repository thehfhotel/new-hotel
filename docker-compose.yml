    environment:
      - DB_SERVER=192.168.11.51
      - DB_NAME=HOTEL
      - DB_USER=sa
      # DB_PASSWORD — sourced from /run/secrets/db_password (shared sa today)
      - MSSQL_PORT=1436
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_NAME=hotelville
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - SITE_ID=hfville
      - RUST_LOG=${RUST_LOG:-backfill_payment_ledger=info,hotel_backend=info}
    secrets:
      - db_password
      - postgres_password
    depends_on:
      newdb:
        condition: service_healthy
    networks:
      - hotel-network

  # Track B5 (audit-2026-05-13.md T1 CRIT-1 follow-on) — one-shot backfill
  # of `ht_checkin_rooms` junction for active legacy folios that haven't
  # been re-synced through the post-B2 mapper yet. Same image / profile
  # shape as `backfill-rooms`; runbook is `docs/coexistence/RUNBOOK-b5-
  # backfill.md`. Idempotent — safe to re-run.
  #     # Dry run (writes nothing, prints would-Apply count):
  #     docker compose --profile backfill run --rm \
  #         --entrypoint ./backfill_checkin_rooms \
  #         backfill-checkin-rooms -- --dry-run
  #     # Apply:
  #     docker compose --profile backfill run --rm \
  #         backfill-checkin-rooms
  backfill-checkin-rooms:
    image: ghcr.io/thehfhotel/new-hotel-backend:latest
    command: ["./backfill_checkin_rooms"]
    profiles:
      - backfill
    # Security audit 2026-05-14: same secret-file migration as backfill-rooms.
    environment:
      - SITE_ID=${SITE_ID:-hfhotel}
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      # DB_PASSWORD — sourced from /run/secrets/db_password
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      # DATABASE_URL — reconstructed by the hydrator from these pieces +
      # the POSTGRES_PASSWORD secret file.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - NEW_DB_SERVER=newdb
      - NEW_DB_PORT=${PGPORT:-5439}
      - BACKFILL_CONCURRENCY=${BACKFILL_CONCURRENCY:-8}
      - RUST_LOG=${RUST_LOG:-backfill_checkin_rooms=info,hotel_backend=info}
    secrets:
