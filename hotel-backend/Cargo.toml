[package]
name = "hotel-backend"
version = "2.7.0"
edition = "2021"
description = "Hotel Management System Backend API"
authors = [""]

[[bin]]
name = "hotel-backend"
path = "src/main.rs"

[[bin]]
name = "migrate_legacy"
path = "src/bin/migrate_legacy.rs"

[dependencies]
# Web framework (matches Tauri middleware)
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database - Legacy (SQL Server via tiberius for read-only legacy DB)
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
bb8 = "0.8"
bb8-tiberius = "0.15"
tokio-util = { version = "0.7", features = ["compat"] }

# Database - New (PostgreSQL via sqlx for HotelNew DB)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "bigdecimal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (Slack webhooks)
reqwest = { version = "0.12", features = ["json"] }

# Scheduling
tokio-cron-scheduler = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling (matches Tauri)
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Hashing (SHA256 for sync change detection)
sha2 = "0.10"

# Config
dotenvy = "0.15"
