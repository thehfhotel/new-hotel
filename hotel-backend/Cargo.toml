[package]
name = "hotel-backend"
version = "2.22.0"
edition = "2021"
description = "Hotel Management System Backend API"
authors = [""]

[[bin]]
name = "hotel-backend"
path = "src/main.rs"

[[bin]]
name = "migrate_legacy"
path = "src/bin/migrate_legacy.rs"

[[bin]]
name = "writeback"
path = "src/bin/writeback.rs"

[[bin]]
name = "sync"
path = "src/bin/sync.rs"

[[bin]]
name = "backfill_rooms"
path = "src/bin/backfill_rooms.rs"

[[bin]]
name = "backfill_checkin_rooms"
path = "src/bin/backfill_checkin_rooms.rs"

[[bin]]
name = "backfill_legacy_checkins"
path = "src/bin/backfill_legacy_checkins.rs"

[[bin]]
name = "backfill_legacy_bookings"
path = "src/bin/backfill_legacy_bookings.rs"

[[bin]]
name = "backfill_customer_legacy_ids"
path = "src/bin/backfill_customer_legacy_ids.rs"

[[bin]]
name = "backfill_payment_ledger"
path = "src/bin/backfill_payment_ledger.rs"

[[bin]]
name = "create_user"
path = "src/bin/create_user.rs"

[dependencies]
# Web framework (matches Tauri middleware).
# 0.8 migration (2026-05-01): path param syntax changed from `/:id` to `/{id}`
# (matchit 0.8 upgrade — old syntax now panics at startup, see CHANGELOG).
axum = "0.8"
# Promoted from transitive (already in the dep tree via `url`) to direct so the
# ville-write guard middleware can robustly URL-decode the `branch` query param.
form_urlencoded = "1.2"
# Tokio: explicit minimal feature list (was "full", trimmed for faster builds).
# - macros: #[tokio::main], #[tokio::test]
# - rt-multi-thread: multi-threaded runtime + Runtime::new() in migrate_legacy bin
# - net: tokio::net::TcpListener for axum
# - time: tokio::time::sleep used by scheduler + sync/writeback workers
# - sync: tokio::sync::Mutex used by scheduler state
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "test-util"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Database - Legacy (SQL Server via tiberius for read-only legacy DB)
# - Drop `rustls` feature: legacy MSSQL connection is plaintext over WireGuard;
#   carrying rustls-webpki costs us 2 LOW CVEs (#118, #119) for code we never run.
# - Default-features off + explicit `chrono`: drops `winauth` (Windows NTLM,
#   never exercised on our Linux deploy) which transitively pulled in vulnerable
#   rand 0.7.3 (#120, #121).
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73"] }
bb8 = "0.9"
bb8-tiberius = { version = "0.16", default-features = false, features = ["chrono", "tds73", "with-tokio"] }
# tokio-util (compat) is needed for the tiberius<->tokio AsyncRead bridge, but
# bb8-tiberius enables it transitively (its `with-tokio` feature) — an explicit
# line here added nothing (cargo-machete flagged it unused, 2026-06-25).

# Database - New (PostgreSQL via sqlx for HotelNew DB)
# Note: "bigdecimal" feature dropped — no NUMERIC columns are read into BigDecimal;
# all DECIMAL columns are cast to ::float8 (f64) at the SQL level (see CLAUDE.md).
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (Slack webhooks) — sync/blocking, called via tokio::task::spawn_blocking
# from async context. Chosen over reqwest to avoid pulling in hyper/h2/tower (~100 crates).
ureq = { version = "2.12", features = ["json", "tls"], default-features = false }

# Scheduling
tokio-cron-scheduler = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
# Asia/Bangkok conversion for legacy MSSQL writes — the .NET app stores
# wall-clock Thai-local times (no offset). PG stores TIMESTAMPTZ in UTC, so the
# writeback worker must convert UTC → Bangkok before formatting.
chrono-tz = "0.9"

# UUID — canonical primary keys for the domain layer (per docs/architecture.md §4a).
# Already pulled in transitively by tiberius + tokio-cron-scheduler; declared
# explicitly here so the `serde` feature is available for our domain types.
uuid = { version = "1", features = ["serde", "v4", "v5"] }
# base64 — decode the `imageBase64` payload on `POST /api/guest-documents`
# into `bytea`. Promoted from transitive (already resolved at 0.22 in the dep
# tree) to a direct dep; no new version pulled.
base64 = "0.22"

# Error handling (matches Tauri)
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Hashing (SHA256 for sync change detection)
sha2 = "0.10"

# Randomness (used by writeback recipes for TM.30 batch numbers per spike §3a —
# `HT_CheckIn_H.Cin_Work_number` is a non-sequential random i32 the legacy app
# assigns ~5s after each save). Minimal feature set: only need `rand::random`.
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

# Config
dotenvy = "0.15"

# async fn in traits with object-safety. Already pulled in transitively by axum,
# bb8 and tiberius — declared explicitly so we can `#[async_trait::async_trait]`
# our `repository::*Repository` traits without depending on a transitive feature.
async-trait = "0.1"

# Stream plumbing for the SSE endpoint (`routes/events.rs`, Phase 4a).
# - `async-stream` provides the `stream!` macro so the SSE handler reads as a
#   straight async loop (`while let Some(n) = listener.recv().await`) rather
#   than hand-rolling `Stream::poll_next`.
# - `futures-util` carries the `Stream` trait the macro produces; already
#   pulled in transitively by axum/sqlx so this is a zero-cost declaration.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false }

# Authentication (Phase 4 PR1) — local-credentials login.
# - argon2: PHC-string Argon2id password hashing/verification. Pure Rust,
#   no system deps. Pulls in `password-hash` for the encoded format.
# - rpassword: TTY prompt for the create_user CLI so passwords don't end
#   up in shell history. Pure Rust, no curses dep.
argon2 = "0.5"
rpassword = "7"

# Cloudflare Access auto-login (middleware/cf_access.rs) — RS256
# VERIFICATION ONLY of the `Cf-Access-Jwt-Assertion` JWT against the team
# JWKS (n/e components via `DecodingKey::from_rsa_components`; the `use_pem`
# default feature additionally lets tests sign fixtures from a static PEM).
# We never issue JWTs in production paths — sessions stay opaque ht_sessions
# tokens. JWKS fetch rides the existing ureq dep (no reqwest, per policy).
# v10: a crypto backend must be selected explicitly — `rust_crypto`
# (RustCrypto, pure Rust) over `aws_lc_rs` (C/asm build deps we don't want).
# `use_pem` lets the cfg(test) fixtures sign with a static PEM key.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }

# Cookie extraction for the Phase 4 PR2 auth routes + middleware.
# - axum-extra: `cookie` feature gives us `axum_extra::extract::cookie::CookieJar`,
#   the canonical extractor + builder for `Cookie` request / `Set-Cookie`
#   response headers in axum 0.8. Version 0.12 is the line that targets
#   axum 0.8 (older 0.9.x lines target axum 0.7).
# - cookie: direct dep so we can refer to `cookie::time::Duration` (the
#   type `CookieBuilder::max_age` requires) without bouncing through a
#   transitive path. axum-extra carries the same crate transitively
#   under the `cookie` feature, so this adds no new compile work.
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"

# Track G8 (audit 2026-05-13 T4 CRIT-2) — RR.4 Thai immigration export.
# - csv: dev-convenience format (and the unit-test friendly serialiser).
#   Pure Rust, MIT/Apache-2.0, no system deps.
# - rust_xlsxwriter: regulator-facing default format. Cell-by-cell
#   builder, native UTF-8 (Thai literals pass through), one-sheet
#   exports, no JNI/Excel binding required. Chosen over umya-spreadsheet
#   which optimises for the read+modify workflow we don't need here.
csv = "1.3"
rust_xlsxwriter = "0.95"

# Thai national-ID card server-side compositing (render/thai_id_card.rs) — a
# clean reimplement of the iHOTEL ReportReg card face, NO vendor lib. resvg
# drives rustybuzz under the hood for correct Thai complex-script shaping (the
# whole reason we render server-side instead of on a client <canvas>).
#
# Version set = the resvg 0.44 line, which co-resolves cleanly: resvg 0.44 →
# usvg 0.44 (pins `fontdb ^0.22`, `tiny-skia-path ^0.11.4`, `rustybuzz ^0.18`)
# and `tiny-skia ^0.11`. DEFAULT features are left ON so `text`
# (fontdb + rustybuzz) and `raster-images` (embedded PNG/JPEG `<image>` decode)
# are wired without hand-picking the feature graph — all pure Rust, no C libs.
# `fontdb` is declared at the SAME 0.22 line usvg pins so our
# `fontdb::Database` unifies to the exact type `usvg::Options` expects
# (0.x is semver-incompatible across minors — a 0.23 here would be a *different*
# type and fail to compile). `base64` (already a dep) encodes the data-URLs.
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
fontdb = "0.23"

# Minimal PNG/JPEG decode+crop+encode for the guest-image sync-in: iHOTEL saves
# the landscape Thai-ID card on a tall white canvas (703×996, card at the top),
# so the sync worker trims the near-white border to just the card before storing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
