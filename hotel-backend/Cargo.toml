[package]
name = "hotel-backend"
version = "2.22.0"
edition = "2021"
description = "Hotel Management System Backend API"
authors = [""]

[[bin]]
name = "hotel-backend"
path = "src/main.rs"

[[bin]]
name = "migrate_legacy"
path = "src/bin/migrate_legacy.rs"

[[bin]]
name = "ville_sync"
path = "src/bin/ville_sync.rs"

[[bin]]
name = "writeback"
path = "src/bin/writeback.rs"

[[bin]]
name = "sync"
path = "src/bin/sync.rs"

[[bin]]
name = "backfill_rooms"
path = "src/bin/backfill_rooms.rs"

[dependencies]
# Web framework (matches Tauri middleware)
axum = "0.7"
# Tokio: explicit minimal feature list (was "full", trimmed for faster builds).
# - macros: #[tokio::main], #[tokio::test]
# - rt-multi-thread: multi-threaded runtime + Runtime::new() in migrate_legacy bin
# - net: tokio::net::TcpListener for axum
# - time: tokio::time::sleep used by scheduler/ville_sync
# - sync: tokio::sync::Mutex used by scheduler state
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database - Legacy (SQL Server via tiberius for read-only legacy DB)
tiberius = { version = "0.12", default-features = false, features = ["chrono", "rustls"] }
bb8 = "0.8"
bb8-tiberius = "0.16"
tokio-util = { version = "0.7", features = ["compat"] }

# Database - New (PostgreSQL via sqlx for HotelNew DB)
# Note: "bigdecimal" feature dropped — no NUMERIC columns are read into BigDecimal;
# all DECIMAL columns are cast to ::float8 (f64) at the SQL level (see CLAUDE.md).
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "macros", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (Slack webhooks) — sync/blocking, called via tokio::task::spawn_blocking
# from async context. Chosen over reqwest to avoid pulling in hyper/h2/tower (~100 crates).
ureq = { version = "2.12", features = ["json", "tls"], default-features = false }

# Scheduling
tokio-cron-scheduler = "0.10"

# Date/time
chrono = { version = "0.4", features = ["serde"] }
# Asia/Bangkok conversion for legacy MSSQL writes — the .NET app stores
# wall-clock Thai-local times (no offset). PG stores TIMESTAMPTZ in UTC, so the
# writeback worker must convert UTC → Bangkok before formatting.
chrono-tz = "0.9"

# UUID — canonical primary keys for the domain layer (per docs/architecture.md §4a).
# Already pulled in transitively by tiberius + tokio-cron-scheduler; declared
# explicitly here so the `serde` feature is available for our domain types.
uuid = { version = "1", features = ["serde", "v4", "v5"] }

# Error handling (matches Tauri)
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Hashing (SHA256 for sync change detection)
sha2 = "0.10"

# Randomness (used by writeback recipes for TM.30 batch numbers per spike §3a —
# `HT_CheckIn_H.Cin_Work_number` is a non-sequential random i32 the legacy app
# assigns ~5s after each save). Minimal feature set: only need `rand::random`.
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

# Config
dotenvy = "0.15"

# async fn in traits with object-safety. Already pulled in transitively by axum,
# bb8 and tiberius — declared explicitly so we can `#[async_trait::async_trait]`
# our `repository::*Repository` traits without depending on a transitive feature.
async-trait = "0.1"

# Stream plumbing for the SSE endpoint (`routes/events.rs`, Phase 4a).
# - `async-stream` provides the `stream!` macro so the SSE handler reads as a
#   straight async loop (`while let Some(n) = listener.recv().await`) rather
#   than hand-rolling `Stream::poll_next`.
# - `futures-util` carries the `Stream` trait the macro produces; already
#   pulled in transitively by axum/sqlx so this is a zero-cost declaration.
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false }
