name: CodeQL

# Phase 9 — post-flip security scanning. CodeQL runs on:
#   - every push to master (so a regression surfaces immediately)
#   - every PR (Dependabot + future external contributors)
#   - weekly cron (catches new advisories landing against unchanged code)
#
# Languages enabled: javascript-typescript (frontend) + rust (backend
# + Tauri middleware). The matrix splits them so a slow Rust build
# doesn't block JS results.
#
# Findings surface in the Security tab → Code scanning. Configure
# branch protection later if you want PRs to block on CodeQL.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly on Sunday 03:00 UTC = 10:00 Thai. Off-hours, low-traffic.
    - cron: '0 3 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers app/, components/, lib/, contexts/.
        # `rust` covers hotel-backend/ + thai-id-middleware-tauri/.
        language: [javascript-typescript, rust]

    steps:
      - name: Checkout
        # Pinned to commit SHA — matches docker-build.yml. Floating @v5
        # would silently pick up new releases between runs; SHA pinning is
        # supply-chain hygiene against a hostile tag-move.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Initialize CodeQL
        # v3 pinned to commit SHA (resolved from `gh api git/refs/tags/v3`).
        uses: github/codeql-action/init@52485aec7be33610227643b0fe83936b8b5f061a  # v3
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is the more thorough pack;
          # `security-extended` is the minimum-noise default. Picking the
          # noisier one because we want signal during the post-flip soak.
          queries: security-and-quality

      - name: Autobuild
        # v3 pinned to commit SHA (same SHA as init/analyze — all three
        # actions live in the same repo and share a release).
        uses: github/codeql-action/autobuild@52485aec7be33610227643b0fe83936b8b5f061a  # v3

      - name: Perform CodeQL analysis
        # v3 pinned to commit SHA.
        uses: github/codeql-action/analyze@52485aec7be33610227643b0fe83936b8b5f061a  # v3
        with:
          category: '/language:${{ matrix.language }}'
