name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Disable cargo incremental compilation in CI: produces large target/
  # artifacts that bloat caches and rarely pay back, since CI runs are
  # essentially cold (or warm via Swatinem/rust-cache + sccache) rather
  # than dev-loop incremental. Applied at workflow scope so every job
  # picks it up automatically. Mirrored in the chef Dockerfile stage so
  # the in-Docker `cargo build` follows the same policy.
  CARGO_INCREMENTAL: "0"

# Workflow-level concurrency: cancel an in-flight test/build run when a
# fresh push lands on the same ref. The `deploy` job overrides this with
# its own group (`deploy-prod-evergreen`, cancel-in-progress: false) so
# in-flight deploys are NEVER cancelled — a partially-rolled deploy is
# worse than a wasted runner minute.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # All jobs run on github-hosted ubuntu-latest. Briefly used self-hosted
    # runner on evergreen (v2.54.31 → v2.55.x) to dodge GH Actions billing,
    # but that combination caused snap-docker network flap + meant CI shared
    # a host with prod. Phase 1 CI/CD modernization (v2.56.5+) put us back
    # on github-hosted runners; deploy reaches evergreen via SSH over the
    # asgard cloudflared tunnel — see docs/runbook-deploy-modernization.md.
    runs-on: ubuntu-latest
    # GITHUB_TOKEN least-privilege: this job only reads the working tree.
    permissions:
      contents: read
    outputs:
      # `frontend` (was: `code`) — Next.js webapp + tooling files only.
      # Anything else (backend, infra, docs) leaves it false.
      frontend: ${{ steps.filter.outputs.frontend }}
      # `backend` — Rust workspace + schema files (sqlx compile-time queries
      # depend on schema). A migrations/ change retests + rebuilds the
      # backend so a schema/code mismatch can never reach a green deploy.
      backend: ${{ steps.filter.outputs.backend }}
      # `deploy` — files that ONLY affect the running services (compose,
      # migrations, deploy/runner scripts). When any of these fires WITHOUT
      # a build, the deploy job re-rolls the existing :latest images.
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Check for changes
        # v4.0.1 pinned to commit SHA. Bumped 2026-04-30 from v3 to clear
        # the Node.js 20 deprecation warning (forced node24 by 2026-06-02).
        # v4 release was a runtime-only update (PR #294) — no syntax change.
        # Bumps surface as Dependabot PRs (.github/dependabot.yml).
        #
        # ## Filter design
        #
        # Each filter is the COMPLETE list of paths whose change MUST trigger
        # the corresponding job(s). Paths NOT covered by any filter (e.g.
        # CHANGELOG.md, docs/**, README.md, AGENTS.md) cause every job to skip
        # — which is the correct outcome for doc-only commits: no rebuild,
        # no deploy, no wasted runner minutes.
        #
        # If you add a new top-level path, decide which filter it belongs
        # under and add it. Catch-all globs (`**` at the root) are deliberately
        # NOT used here — explicit lists make the test/build matrix legible.
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - '__tests__/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'Dockerfile'
              - '.dockerignore'
            backend:
              - 'hotel-backend/**'
              # Schema changes affect sqlx::query!() compile-time validation,
              # so any migration / init-db DDL change must retest + rebuild
              # the backend. Without this the .sqlx/ cache could go stale
              # without CI catching it before deploy.
              - 'migrations/pg/**'
              - 'init-db/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'
              - 'migrations/pg/**'
              - 'scripts/migrate.sh'
              - 'scripts/backup-db.sh'

  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Setup pnpm
        # v4 pinned to SHA. Resolved via gh api git/refs/tags/v4.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: pnpm test:components

  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # TEST_POSTGRES_PASSWORD is a CI-only throwaway secret; the value is
        # constrained to URL-safe characters (A-Za-z0-9) so it can be embedded
        # in DATABASE_URL below without percent-encoding.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      # Install mold (NOT in the github-hosted ubuntu-latest image; required by
      # hotel-backend/.cargo/config.toml's `-fuse-ld=mold` pin). clang and
      # postgresql-client ship on ubuntu-latest already; listed here as
      # belt-and-suspenders since `apt install -y` is idempotent.
      - name: Install build + test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold clang postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: psql -h localhost -p 5439 -U postgres -d hotelnew -f init-db/init-hotelnew.sql

      - name: Install Rust toolchain
        # Pinned to a `1.89` branch SHA (per Batch D). The `@stable` ref the
        # action publishes is a moving target — pinning it caps the toolchain
        # at the version used to generate `.sqlx/` cache files.
        uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e  # 1.89
        with:
          toolchain: "1.89"

      # sccache wraps every rustc invocation and caches its output keyed on the
      # exact crate inputs. It complements Swatinem/rust-cache (which caches
      # the whole target/ dir). Treated as opportunistic: if the action fails
      # OR the GHA Cache service is unreachable at server-start time, we skip
      # RUSTC_WRAPPER and fall through to a plain build instead of failing
      # the job. The probe step does the real check — the action above only
      # installs the binary.
      - name: Set up sccache
        id: sccache_setup
        # v0.0.9+ uses the GHA Cache v2 API (`ACTIONS_RESULTS_URL`).
        # GitHub sunset the v1 cache API on 2026-02-01, after which v0.0.6
        # got 400s from artifactcache.actions.githubusercontent.com on every
        # probe. Pinned to v0.0.10 (Batch D pinned to commit SHA — the
        # tag itself was last moved on the v0.0.10 release).
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        continue-on-error: true

      - name: Probe sccache (verify GHA Cache reachable)
        id: sccache_probe
        if: steps.sccache_setup.outcome == 'success'
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        run: |
          sccache --start-server
          sccache --show-stats
          sccache --stop-server

      - name: Cache Rust dependencies
        # v2 pinned to SHA. Resolved via gh api git/refs/tags/v2.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: hotel-backend
          # `cache-on-failure: true` — preserve the partially-built target/
          # when the test step fails. Without this, a flaky test (or a
          # transient `cargo test` panic) wipes the cache and the next
          # run pays the full cold-compile cost. Matches middleware-build.yml.
          cache-on-failure: true

      - name: Run backend tests
        working-directory: hotel-backend
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5439/hotelnew
          SQLX_OFFLINE: "true"
          SCCACHE_GHA_ENABLED: ${{ steps.sccache_probe.outcome == 'success' && 'true' || 'false' }}
          RUSTC_WRAPPER: ${{ steps.sccache_probe.outcome == 'success' && 'sccache' || '' }}
        # `--locked` aborts if Cargo.lock is out of date with Cargo.toml.
        # CI parity with the production Dockerfile build (also uses --locked).
        #
        # `--test-threads=1`: integration tests share ONE PostgreSQL instance
        # and ONE `ht_*` schema namespace. Running them in parallel races
        # against shared rows — see the `customer_search_by_name` flake
        # (CI run 24957295146) where a concurrent `customer_crud_lifecycle`
        # cleanup nuked the search test's freshly-inserted rows mid-assertion.
        # The cleanup helper in `tests/common/mod.rs` was tightened to use
        # exact-match markers instead of `LIKE 'TEST_%'`; this flag is
        # belt-and-suspenders against any future shared-DB race we haven't
        # yet enumerated. Cost is ~5-10s on a 13-test suite — acceptable.
        run: cargo test --locked -- --test-threads=1

  # init-db / migrations drift check (Batch E of post-Phase-5.5 audit).
  #
  # Why this exists: a fresh deployment runs `init-db/init-hotelnew.sql` (the
  # canonical seed) and then `scripts/migrate.sh` against the same database.
  # If a developer adds a migration to `migrations/pg/` but forgets to mirror
  # the change into `init-hotelnew.sql`, the seed lands one schema and migrate
  # then re-applies the same DDL on top — producing inconsistent schema_migrations
  # rows on fresh deploys vs. upgrade paths and (worse) silently masking that
  # the seed file is incomplete.
  #
  # The check spins up a throwaway Postgres, applies the init seed, then runs
  # migrate.sh. The contract is: zero migrations applied on top of the seed.
  # The migration runner emits "No pending migrations" when it has nothing
  # to do — we grep for that. Any other outcome fails the job loudly.
  #
  # Runs on EVERY push (not just master) so PRs catch drift before merge.
  init-db-migrations-drift-check:
    runs-on: ubuntu-latest
    needs: changes
    # Only worth running when init-db, migrations, the runner script, OR this
    # workflow itself was touched. The `deploy` paths-filter already covers
    # init-db + migrations + migrate.sh; piggyback on it.
    if: needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as the runtime newdb container in docker-compose.yml
        # (Batch C). Pinning the test runner to the same image ensures the
        # drift check exercises the exact PostgreSQL version production sees.
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --name drift-check-db
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      # postgresql-client ships on ubuntu-latest; this step is belt-and-suspenders
      # in case the image rotates a future major that drops it. `apt install -y`
      # is idempotent.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply init-db seed
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        # ON_ERROR_STOP=1 fails the step on the first SQL error so a broken
        # seed doesn't masquerade as "drift detected".
        run: |
          psql -h localhost -p 5439 -U postgres -d hotelnew \
            -v ON_ERROR_STOP=1 \
            -f init-db/init-hotelnew.sql

      - name: Run migrate.sh against seeded database
        env:
          # migrate.sh shells `docker exec ${DB_CONTAINER:-new-hotel-db} ...`.
          # The service container is renamed `drift-check-db` here so this
          # job's container doesn't conflict with anything else docker-named
          # `new-hotel-db` on the runner (originally a self-hosted-runner
          # collision; harmless and intentional on github-hosted too).
          DB_CONTAINER: drift-check-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: hotelnew
          PGPORT: "5439"
        run: |
          set -uo pipefail   # NOT -e: we want to inspect the runner's exit code
          OUTPUT=$(./scripts/migrate.sh 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          echo "----- migrate.sh exit code: $STATUS -----"

          # Contract: a fresh init-db + migrate.sh must apply ZERO migrations.
          # The runner prints exactly "Database is up to date. No pending
          # migrations." when the schema_migrations table already lists every
          # version found in migrations/pg/. Any other terminal state means
          # init-hotelnew.sql is missing something a migration adds.
          if [ "$STATUS" -eq 0 ] && echo "$OUTPUT" | grep -q "No pending migrations"; then
            echo "PASS: init-db/init-hotelnew.sql is in sync with migrations/pg/."
            exit 0
          fi

          echo "::error::Drift detected: init-db/init-hotelnew.sql is out of sync with migrations/pg/."
          echo "::error::Update init-db/init-hotelnew.sql to include the contents of the pending migrations (DDL + matching schema_migrations seed row)."
          exit 1

  build-frontend:
    runs-on: ubuntu-latest
    # Build runs in PARALLEL with test-frontend (Track F CI optimization).
    # The deploy job still gates on `test-frontend.result == success` so a
    # red test never reaches prod — but the build doesn't have to WAIT
    # for tests. Worst case: tests fail, an unused :latest image lands on
    # GHCR and gets garbage-collected by the next green build.
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          # PR runs MUST NOT push to GHCR — only master pushes (or a master-
          # targeted workflow_dispatch) do. The build itself still executes
          # (so the GHA cache + Docker layer cache measurements still apply),
          # and on master events the image is tagged + pushed exactly as before.
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: frontend` (Batch D): isolates the GHA cache namespace
          # so build-backend can't evict it.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}
            NEXT_PUBLIC_AUTH_REQUIRED=${{ vars.AUTH_REQUIRED || 'false' }}

  build-backend:
    runs-on: ubuntu-latest
    # Build runs in PARALLEL with test-backend (Track F CI optimization).
    # The deploy job still gates on `test-backend.result == success` so a
    # red test never reaches prod — but the build doesn't have to WAIT
    # for tests. Worst case: tests fail, an unused :latest image lands on
    # GHCR and gets garbage-collected by the next green build.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ./hotel-backend
          # PR runs MUST NOT push to GHCR — only master pushes (or a master-
          # targeted workflow_dispatch) do. See the equivalent comment in
          # build-frontend; same rationale.
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: backend` per Batch D — isolates GHA cache namespace.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, test-frontend, test-backend, init-db-migrations-drift-check, build-frontend, build-backend]
    # Least-privilege: the deploy step only needs to pull images from GHCR
    # (read on packages) and read the working tree.
    permissions:
      contents: read
      packages: read
    # Serialise deploys to evergreen so two back-to-back master pushes can
    # never have their `docker compose up` interleave. cancel-in-progress
    # is OFF because the in-flight deploy already pulled images + is
    # mid-migration; aborting it leaves PG and the backend container in
    # mismatched-schema state.
    concurrency:
      group: deploy-prod-evergreen
      cancel-in-progress: false
    # Gate on the new drift check too (Batch E): if init-db/init-hotelnew.sql
    # is out of sync with migrations/pg/, we refuse to deploy so the operator
    # can't accidentally leave production with a half-seeded schema.
    # `success || skipped` mirrors the test-* jobs — the check is skipped
    # when no migration / init-db / migrate.sh files changed.
    #
    # Deploy ONLY fires on master pushes or a master-targeted workflow_dispatch.
    # The `pull_request` trigger (added for CI measurement) MUST NOT touch prod —
    # the explicit event_name check below is the load-bearing guard against that.
    # The downstream build-* jobs still run on PRs but with push:false, so a PR
    # exercising the workflow can't end up with a half-pushed image either.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.init-db-migrations-drift-check.result == 'success' || needs.init-db-migrations-drift-check.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v5.0.0

      - name: Cache cloudflared binary
        id: cf-cache
        # actions/cache v4.2.0 pinned to commit SHA.
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: /usr/local/bin/cloudflared
          # Pin to a SPECIFIC release version so the cache key is stable.
          # NEVER key on `latest` — Cloudflare cuts a new release every few
          # weeks and the binary at /latest/ changes silently. That would
          # mean: cache hit, but cloudflared on disk is the old release,
          # leading to silent drift between CI runs.
          # Bump the version below to refresh the cached binary.
          key: cloudflared-2026.3.0-linux-amd64

      - name: Install cloudflared
        # GH-hosted runner needs cloudflared to reach evergreen via the same
        # asgard tunnel your daily SSH uses. No CF Access app gates evergreen,
        # so no service token / OAuth required — cloudflared just routes the
        # connection through the tunnel. Pinned to a specific release so the
        # cache step above remains valid; bump both together.
        if: steps.cf-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.3.0/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Verify cloudflared
        run: cloudflared --version

      - name: Install SSH key + known_hosts
        # ed25519 keypair generated locally; private half is GH Secret. Public
        # half is in /home/deploy/.ssh/authorized_keys on evergreen with a
        # forced-command pinning /srv/run-deploy.sh. The host key is pinned in
        # known_hosts so a mid-flight MITM via a tunnel hijack would be detected.
        env:
          SSH_KEY:  ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.EVERGREEN_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH to evergreen
        env:
          # Auth for the docker daemon on evergreen to pull private GHCR images.
          # GITHUB_TOKEN's packages:read scope is enough for `docker pull`;
          # token expires when this run ends, so no long-lived credential
          # lives on evergreen.
          GHCR_USER:               ${{ github.actor }}
          GHCR_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          DB_SERVER:               ${{ secrets.DB_SERVER }}
          DB_NAME:                 ${{ secrets.DB_NAME }}
          DB_USER:                 ${{ secrets.DB_USER }}
          DB_PASSWORD:             ${{ secrets.DB_PASSWORD }}
          MSSQL_PORT:              ${{ secrets.MSSQL_PORT }}
          POSTGRES_DB:             ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:           ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          SLACK_WEBHOOK_URL:       ${{ secrets.SLACK_WEBHOOK }}
          LEGACY_SYNC_ENABLED:     ${{ secrets.LEGACY_SYNC_ENABLED }}
          LEGACY_SYNC_SHADOW_MODE: ${{ secrets.LEGACY_SYNC_SHADOW_MODE }}
          AUTH_ENABLED:            ${{ vars.AUTH_ENABLED || 'false' }}
        # Build a JSON payload the way /srv/run-deploy.sh expects:
        #   { commit_sha, deploy_payload_b64 (tar.gz), env: {...} }
        # then pipe it over SSH to deploy@evergreen. The forced-command
        # in authorized_keys runs /srv/run-deploy.sh with this payload as stdin.
        # No commands beyond that are possible — the SSH key only triggers the script.
        run: |
          set -euo pipefail
          tar -czf /tmp/deploy.tar.gz docker-compose.yml init-db migrations/pg scripts/migrate.sh

          jq -n \
            --arg commit_sha          "$GITHUB_SHA" \
            --arg deploy_payload_b64  "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user           "$GHCR_USER" \
            --arg ghcr_token          "$GHCR_TOKEN" \
            --arg DB_SERVER           "$DB_SERVER" \
            --arg DB_NAME             "$DB_NAME" \
            --arg DB_USER             "$DB_USER" \
            --arg DB_PASSWORD         "$DB_PASSWORD" \
            --arg MSSQL_PORT          "${MSSQL_PORT:-1433}" \
            --arg POSTGRES_DB         "$POSTGRES_DB" \
            --arg POSTGRES_USER       "$POSTGRES_USER" \
            --arg POSTGRES_PASSWORD   "$POSTGRES_PASSWORD" \
            --arg SLACK_WEBHOOK_URL   "$SLACK_WEBHOOK_URL" \
            --arg LEGACY_SYNC_ENABLED "$LEGACY_SYNC_ENABLED" \
            --arg LEGACY_SYNC_SHADOW_MODE "$LEGACY_SYNC_SHADOW_MODE" \
            --arg AUTH_ENABLED        "$AUTH_ENABLED" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                DB_SERVER:               $DB_SERVER,
                DB_NAME:                 $DB_NAME,
                DB_USER:                 $DB_USER,
                DB_PASSWORD:             $DB_PASSWORD,
                MSSQL_PORT:              $MSSQL_PORT,
                POSTGRES_DB:             $POSTGRES_DB,
                POSTGRES_USER:           $POSTGRES_USER,
                POSTGRES_PASSWORD:       $POSTGRES_PASSWORD,
                SLACK_WEBHOOK_URL:       $SLACK_WEBHOOK_URL,
                LEGACY_SYNC_ENABLED:     $LEGACY_SYNC_ENABLED,
                LEGACY_SYNC_SHADOW_MODE: $LEGACY_SYNC_SHADOW_MODE,
                AUTH_ENABLED:            $AUTH_ENABLED,
              }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org
