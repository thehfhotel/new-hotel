name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cancel-previous:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          all_but_latest: true

  changes:
    runs-on: ubuntu-latest
    needs: cancel-previous
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      hfville: ${{ steps.filter.outputs.hfville }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile'
              - 'next.config.js'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
              - 'postcss.config.mjs'
            backend:
              - 'hotel-backend/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'
              - 'migrations/pg/**'
              - 'scripts/migrate.sh'
            hfville:
              - 'hotel-backend/**'
              - 'deploy/hfville/**'

  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run component tests
        run: pnpm test:components

  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ***REMOVED***
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize database
        env:
          PGPASSWORD: ***REMOVED***
        run: psql -h localhost -p 5439 -U postgres -d hotelnew -f init-db/init-hotelnew.sql

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hotel-backend

      - name: Run backend tests
        working-directory: hotel-backend
        env:
          DATABASE_URL: postgres://postgres:***REMOVED***@localhost:5439/hotelnew
          SQLX_OFFLINE: "true"
        run: cargo test --release

  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes, test-frontend]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}

  build-backend:
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ville-sync:
    runs-on: ubuntu-latest
    needs: [changes, test-backend]
    if: needs.changes.outputs.hfville == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thehfhotel/ville-sync
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ville-sync
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          file: ./hotel-backend/Dockerfile.ville-sync
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, linux, deploy]
    needs: [changes, build-frontend, build-backend]
    if: always() && (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.code != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -e
          DEPLOY_DIR=/home/nut/new-hotel-production

          # Create deployment directory and copy files
          mkdir -p $DEPLOY_DIR/init-db
          mkdir -p $DEPLOY_DIR/migrations/pg
          mkdir -p $DEPLOY_DIR/scripts
          mkdir -p $DEPLOY_DIR/backups
          cp docker-compose.yml $DEPLOY_DIR/
          cp -r init-db/* $DEPLOY_DIR/init-db/
          cp -r migrations/pg/* $DEPLOY_DIR/migrations/pg/ 2>/dev/null || true
          cp scripts/migrate.sh $DEPLOY_DIR/scripts/
          chmod +x $DEPLOY_DIR/scripts/migrate.sh

          cd $DEPLOY_DIR

          # Pull latest images and start all services
          docker compose pull
          docker compose up -d

          echo "Waiting for database to be healthy..."

          # Wait for database container to be healthy (max 2 minutes)
          TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' new-hotel-db 2>/dev/null || echo "not_found")
            if [ "$HEALTH" = "healthy" ]; then
              echo "Database is healthy!"
              break
            fi
            echo "Database status: $HEALTH (waiting...)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ "$HEALTH" != "healthy" ]; then
            echo "ERROR: Database did not become healthy within $TIMEOUT seconds"
            docker logs new-hotel-db --tail 50
            exit 1
          fi

          # Run database migrations
          echo "Running database migrations..."
          ./scripts/migrate.sh

          # Restart backend to pick up schema changes
          docker compose restart backend
          sleep 5

          echo "Deployment complete!"
          docker compose ps

  deploy-hfville:
    runs-on: [self-hosted, linux, deploy]
    needs: [changes, build-ville-sync]
    if: always() && (needs.build-ville-sync.result == 'success' || (needs.changes.outputs.hfville == 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to HF Ville jump box
        env:
          NEW_IMAGE: ${{ needs.build-ville-sync.result == 'success' }}
        run: |
          set -e
          JUMP_BOX=10.10.10.3  # HF Ville jump box via WireGuard
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15"

          echo "Deploying to HF Ville jump box ($JUMP_BOX) via WireGuard..."

          # Copy deployment files to jump box
          sshpass -p ***REMOVED*** scp $SSH_OPTS \
            deploy/hfville/docker-compose.yml nut@$JUMP_BOX:~/hfville/
          sshpass -p ***REMOVED*** scp $SSH_OPTS \
            deploy/hfville/init-db/init-hfville.sql nut@$JUMP_BOX:~/hfville/init-db/

          # Transfer new image only if ville-sync was rebuilt
          if [ "$NEW_IMAGE" = "true" ]; then
            echo "Transferring new ville-sync image..."
            docker pull ghcr.io/thehfhotel/ville-sync:latest
            docker save ghcr.io/thehfhotel/ville-sync:latest | gzip > /tmp/ville-sync.tar.gz

            sshpass -p ***REMOVED*** scp $SSH_OPTS \
              /tmp/ville-sync.tar.gz nut@$JUMP_BOX:~/hfville/

            sshpass -p ***REMOVED*** ssh $SSH_OPTS \
              nut@$JUMP_BOX "echo ***REMOVED*** | sudo -S docker load -i ~/hfville/ville-sync.tar.gz && rm ~/hfville/ville-sync.tar.gz"

            rm -f /tmp/ville-sync.tar.gz
          else
            echo "Config-only deploy, skipping image transfer"
          fi

          # Start/restart services
          sshpass -p ***REMOVED*** ssh $SSH_OPTS \
            nut@$JUMP_BOX "cd ~/hfville && echo ***REMOVED*** | sudo -S docker compose up -d"

          echo "HF Ville deployment complete!"
