name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cancel-previous:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          all_but_latest: true

  changes:
    runs-on: ubuntu-latest
    needs: cancel-previous
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile'
              - 'next.config.js'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
              - 'postcss.config.mjs'
            backend:
              - 'hotel-backend/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run component tests
        run: pnpm test:components

  build-and-push:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}

  build-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, linux, deploy]
    needs: [changes, build-and-push, build-backend]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.code != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          set -e
          DEPLOY_DIR=/home/nut/new-hotel-production

          # Create deployment directory and copy files
          mkdir -p $DEPLOY_DIR/init-db
          cp docker-compose.yml $DEPLOY_DIR/
          cp -r init-db/* $DEPLOY_DIR/init-db/

          cd $DEPLOY_DIR

          # Pull latest images and start all services
          docker compose pull
          docker compose up -d

          echo "Waiting for database to be healthy..."

          # Wait for database container to be healthy (max 2 minutes)
          TIMEOUT=120
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' new-hotel-db 2>/dev/null || echo "not_found")
            if [ "$HEALTH" = "healthy" ]; then
              echo "Database is healthy!"
              break
            fi
            echo "Database status: $HEALTH (waiting...)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ "$HEALTH" != "healthy" ]; then
            echo "ERROR: Database did not become healthy within $TIMEOUT seconds"
            docker logs new-hotel-db --tail 50
            exit 1
          fi

          echo "Deployment complete!"
          docker compose ps
