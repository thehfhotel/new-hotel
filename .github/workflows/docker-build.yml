name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Disable cargo incremental compilation in CI: produces large target/
  # artifacts that bloat caches and rarely pay back, since CI runs are
  # essentially cold (or warm via Swatinem/rust-cache + sccache) rather
  # than dev-loop incremental. Applied at workflow scope so every job
  # picks it up automatically. Mirrored in the chef Dockerfile stage so
  # the in-Docker `cargo build` follows the same policy.  # warm-cache trigger #1
  CARGO_INCREMENTAL: "0"

# Workflow-level concurrency: cancel an in-flight test/build run when a
# fresh push lands on the same ref. The `deploy` job overrides this with
# its own group (`deploy-prod-evergreen`, cancel-in-progress: false) so
# in-flight deploys are NEVER cancelled — a partially-rolled deploy is
# worse than a wasted runner minute.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # All jobs run on github-hosted ubuntu-latest. Briefly used self-hosted
    # runner on evergreen (v2.54.31 → v2.55.x) to dodge GH Actions billing,
    # but that combination caused snap-docker network flap + meant CI shared
    # a host with prod. Phase 1 CI/CD modernization (v2.56.5+) put us back
    # on github-hosted runners; deploy reaches evergreen via SSH over the
    # asgard cloudflared tunnel — see docs/runbook-deploy-modernization.md.
    runs-on: ubuntu-latest
    # GITHUB_TOKEN least-privilege: this job only reads the working tree.
    permissions:
      contents: read
    outputs:
      # `frontend` (was: `code`) — Next.js webapp + tooling files only.
      # Anything else (backend, infra, docs) leaves it false.
      frontend: ${{ steps.filter.outputs.frontend }}
      # `backend` — Rust workspace + schema files (sqlx compile-time queries
      # depend on schema). A migrations/ change retests + rebuilds the
      # backend so a schema/code mismatch can never reach a green deploy.
      backend: ${{ steps.filter.outputs.backend }}
      # `deploy` — files that ONLY affect the running services (compose,
      # migrations, deploy/runner scripts). When any of these fires WITHOUT
      # a build, the deploy job re-rolls the existing :latest images.
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Check for changes
        # v4.0.1 pinned to commit SHA. Bumped 2026-04-30 from v3 to clear
        # the Node.js 20 deprecation warning (forced node24 by 2026-06-02).
        # v4 release was a runtime-only update (PR #294) — no syntax change.
        # Bumps surface as Dependabot PRs (.github/dependabot.yml).
        #
        # ## Filter design
        #
        # Each filter is the COMPLETE list of paths whose change MUST trigger
        # the corresponding job(s). Paths NOT covered by any filter (e.g.
        # CHANGELOG.md, docs/**, README.md, AGENTS.md) cause every job to skip
        # — which is the correct outcome for doc-only commits: no rebuild,
        # no deploy, no wasted runner minutes.
        #
        # If you add a new top-level path, decide which filter it belongs
        # under and add it. Catch-all globs (`**` at the root) are deliberately
        # NOT used here — explicit lists make the test/build matrix legible.
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - '__tests__/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'Dockerfile'
              - '.dockerignore'
            backend:
              - 'hotel-backend/**'
              # Schema changes affect sqlx::query!() compile-time validation,
              # so any migration / init-db DDL change must retest + rebuild
              # the backend. Without this the .sqlx/ cache could go stale
              # without CI catching it before deploy.
              - 'migrations/pg/**'
              - 'init-db/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'
              - 'migrations/pg/**'
              # Legacy-MSSQL CT migrations are auto-applied + verified by
              # run-deploy.sh (incident 2026-06-24); a new one must trigger a
              # deploy so it actually lands on the legacy servers.
              - 'migrations/legacy-mssql/**'
              - 'scripts/migrate.sh'
              - 'scripts/migrate-legacy-mssql.sh'
              - 'scripts/backup-db.sh'
              # The deploy script self-updates from the tarball on every
              # deploy (Track J5, 2026-05-14), so a change here is only
              # visible to evergreen if a deploy actually fires. Likewise
              # the workflow file carries the RUST_LOG default + jq payload
              # template — a change to either is operationally meaningless
              # until a deploy ships them. Without these entries the
              # 2026-05-18 RUST_LOG visibility fix needed a manual
              # workflow_dispatch to take effect.
              - 'scripts/deploy/**'
              - '.github/workflows/docker-build.yml'

  # Track J8 guard (audit-2026-05-14 follow-on to PR #102 + #108).
  #
  # release-please's Release PR (wired in PR #102) is generated automatically:
  # it only edits CHANGELOG.md, package.json, and .release-please-manifest.json
  # — no Rust, TypeScript, schema, or deploy-script changes. When that PR
  # merges to master, the existing pipeline would rebuild identical images
  # and redeploy them: ~5 min of CI runner time + a container cycle on
  # evergreen for zero behaviour change. This job short-circuits that.
  #
  # ## Logic
  #
  # Computes whether the push diff (HEAD~1..HEAD) consists EXCLUSIVELY of
  # release-please-managed files. If so, sets `skip=true` and downstream
  # heavy jobs (build-frontend, build-backend, deploy) gate on it.
  #
  # ## What still runs when skip=true
  #
  # - test-frontend / test-backend — cheap, keep the green-CI signal honest
  #   even on a release-merge commit.
  # - lint-cardinality-map, lint-bin-hydrate, lint-no-changelog-version-edits,
  #   init-db-migrations-drift-check — same rationale (lints are seconds).
  # - The `should-deploy` check itself.
  #
  # Only the docker build + push and the evergreen SSH deploy step are
  # skipped, which is where ~95% of the wall-clock cost lives.
  #
  # ## PR + workflow_dispatch behaviour
  #
  # - On `pull_request`: `skip=false` unconditionally. PRs must still build
  #   to keep the green-CI signal honest before merge, and they don't deploy
  #   anyway (the deploy job's `event_name == 'push'` guard handles that).
  # - On `workflow_dispatch`: `skip=false` unconditionally. An operator
  #   manually firing the workflow always wants a fresh build + deploy
  #   regardless of which files moved on master.
  # - On `push` to master with no parent commit (impossible in practice
  #   but defensively handled): `skip=false`.
  #
  # ## Failure mode if the matcher is wrong
  #
  # The matcher is a tight allow-list of three exact filenames. If a future
  # release-please config adds more managed files (e.g. a Cargo.toml bump),
  # this job would NOT mistakenly set skip=true — any extra file would fall
  # through to the catch-all `*) ONLY_RP=false`. The opposite failure (an
  # actual code change that happens to ALSO touch one of the three files in
  # the same push) would also keep ONLY_RP=false because the code file
  # wouldn't match any of the three cases. So the worst the matcher can do
  # is fail-open (deploy when it could have skipped) — never fail-closed.
  should-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0
        with:
          # Need HEAD and HEAD~1 locally to compute the diff. fetch-depth: 2
          # is the minimum: 1 commit gives us no parent to diff against.
          fetch-depth: 2

      - name: Decide whether to deploy
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Non-push events always deploy/build as usual. The deploy job's
          # own `event_name == 'push'` guard handles workflow_dispatch + PR
          # safety separately; this job just doesn't intervene.
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Event is $EVENT_NAME, not push — skip=false"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If HEAD has no parent (first commit on a fresh repo), fall through
          # to the deploy path. `git rev-parse HEAD~1` exits non-zero in that
          # case; we treat any rev-parse failure as "can't determine, deploy
          # to be safe".
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "No parent commit available — skip=false"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files in HEAD~1..HEAD:"
          echo "$CHANGED_FILES"

          # Empty diff (shouldn't happen on a push event but defensively
          # handled): treat as a real change and deploy.
          if [ -z "$CHANGED_FILES" ]; then
            echo "Empty diff — skip=false"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Allow-list of files release-please manages. Any path outside this
          # list flips ONLY_RP=false and the deploy proceeds.
          ONLY_RP=true
          while IFS= read -r f; do
            case "$f" in
              CHANGELOG.md|package.json|.release-please-manifest.json) ;;
              *) ONLY_RP=false; break ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$ONLY_RP" = "true" ]; then
            echo "::notice::All changed files are release-please-managed — skipping build + deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-release-please file(s) present — skip=false"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # PROCESS.md P1 enforcement (Track H, audit-2026-05-13).
  #
  # Every `CREATE TABLE ht_*` in migrations/pg/ must have a matching row in
  # docs/coexistence/CARDINALITY_MAP.md. Was reviewer discipline only; this
  # gate makes the rule a CI failure so it can't slip in unnoticed.
  #
  # Runs on pull_request AND push events:
  #   - PR: catches the gap before merge (the desirable case).
  #   - push: safety net for cases where a PR was merged from a fork or
  #     workflow_dispatch lands a change directly. Cheap enough to always run.
  #
  # The script is self-tested: `--self-test` exercises both the PASS and FAIL
  # branches inside a scratch directory, so a refactor of the script itself
  # doesn't ship with a broken matcher.
  #
  # test-backend / build-backend gate on this via `needs:` so a P1 violation
  # blocks any further backend work — no point compiling against a schema
  # that lacks its coexistence-map row.
  lint-cardinality-map:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Self-test the check script
        run: ./scripts/check-cardinality-map.sh --self-test

      - name: Enforce CARDINALITY_MAP coverage for ht_* tables in migrations
        run: ./scripts/check-cardinality-map.sh

      - name: Reject committed conflict markers
        # Backstop for the .husky/pre-commit hook (Track J6). Catches unresolved
        # git conflict markers leaking into the tree when a contributor skips
        # local hooks. The regex matches whole-line marker tokens only, so
        # legitimate `===== heading =====` style banners in docs/code are safe.
        run: |
          if grep -rnE '^(<<<<<<<|=======|>>>>>>>)( |$)' \
              --include='*.rs' --include='*.ts' --include='*.tsx' \
              --include='*.js' --include='*.yml' --include='*.toml' \
              --include='*.sql' --include='*.md' \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=target \
              hotel-backend app components scripts migrations init-db \
              2>/dev/null; then
            echo "::error::Committed git conflict markers detected. Resolve them before merging."
            exit 1
          fi
          echo "OK: no conflict markers in source tree"

  # Per-site write chokepoint gate (Ship-B / ADR 0002 — task #20).
  #
  # Every MUTATING route handler must resolve its PostgreSQL pool through the
  # unified chokepoint (`AppState::write_pool` / a delegating helper), never via
  # `state.new_pool` directly — otherwise, once `HFVILLE_WRITES_ENABLED` flips, a
  # `branch=hfville` write would silently land in the HF Hotel pool (risk R2,
  # cross-site corruption). This script makes that a CI failure so the next
  # mutating handler can't reintroduce the footgun. Legitimate exceptions
  # (HF-Hotel-only/global handlers, plus service-bound flows deferred to the flip
  # task) are on an explicit, reasoned allowlist inside the script.
  #
  # Same shape as lint-cardinality-map: self-tested (`--self-test` runs the PASS
  # and FAIL branches in a scratch dir) and added to test-backend / build-backend
  # `needs:` so a violation blocks backend work.
  lint-write-pool-routing:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Self-test the check script
        run: ./scripts/check-write-pool-routing.sh --self-test

      - name: Enforce per-site write-pool routing for mutating handlers
        run: ./scripts/check-write-pool-routing.sh

  # Track J2 guard (audit-2026-05-14 follow-on to PR #99).
  #
  # PR #89 added `hotel-backend/src/secrets.rs::hydrate_env_from_secret_files`
  # — the in-process hydrator that reads /run/secrets/<name> files and
  # populates the matching env vars BEFORE any `env::var(...)` call site
  # fires. It was unit-tested well but only wired into 2 of 5 binaries'
  # main(); the other 3 (src/main.rs, bin/sync.rs, bin/writeback.rs)
  # silently crashed in prod because they never called it. PR #99 fixed it.
  # This step catches the next "I forgot to wire the call" regression
  # cheaply (single grep, no cargo build) so a future binary added to
  # src/bin/ can't ship without the hydrator.
  #
  # Cheap enough to always run; no `needs:` paths-filter gate (unlike the
  # backend test/build jobs) — the cost of a grep over ~9 files is
  # negligible, and a workflow_dispatch with no file changes still wants
  # the assertion.
  lint-bin-hydrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Verify every binary main() calls hydrate_env_from_secret_files
        run: |
          set -e
          BIN_FILES=$(ls hotel-backend/src/main.rs hotel-backend/src/bin/*.rs)
          MISSING=""
          for f in $BIN_FILES; do
            if ! grep -q 'hydrate_env_from_secret_files' "$f"; then
              MISSING="$MISSING $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::These binaries don't call hydrate_env_from_secret_files() — they will crash in prod with empty DB_PASSWORD:"
            for f in $MISSING; do echo "  - $f"; done
            exit 1
          fi
          echo "OK: all $(echo $BIN_FILES | wc -w) binaries call the hydrator"

  # Track J7 guard (audit-2026-05-14 follow-on to PR #102).
  #
  # PR #102 wired up googleapis/release-please-action@v4: feature PRs are
  # forbidden to touch CHANGELOG.md or package.json's `version` field, and
  # the bot opens a "chore(main): release X.Y.Z" PR that owns both. That
  # contract is documented in CLAUDE.md §Versioning, but until now it was
  # documentation-only — nothing stopped a future PR (or an agent acting
  # on stale instructions) from editing those files anyway. If it did,
  # release-please's auto-Release PR would conflict with the feature PR,
  # defeating the whole point.
  #
  # This job makes the policy load-bearing: any PR that diffs CHANGELOG.md
  # or moves the `"version":` line in package.json fails CI. The exception
  # is release-please's own PRs (branch prefix `release-please--branches/`
  # for action@v4), which legitimately own both files.
  #
  # PR-only: pushes to master and workflow_dispatch don't trigger the guard
  # — a release-please Release PR being merged TO master is the one path
  # that legitimately bumps both files, and that lands as a push (not a PR
  # opened against master), so the guard's `if:` clause naturally skips it.
  #
  # No `needs:` gate (cheap grep over a 2-line diff); always runs on PRs.
  lint-no-changelog-version-edits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--branches/')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0
        with:
          # PR events default to a refs/pull/N/merge checkout with depth=1.
          # We need the base ref locally so `git diff origin/<base>...HEAD`
          # can resolve. Fetch it explicitly below (cheaper than fetch-depth: 0).
          fetch-depth: 1

      - name: Prevent manual CHANGELOG / version edits
        run: |
          set -e
          # Fetch base ref so diff works (single-commit shallow is enough).
          git fetch --depth=1 origin "${{ github.base_ref }}"

          # CHANGELOG.md must not appear in the PR's diff. release-please
          # auto-aggregates it from conventional commits.
          if git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::Feature PRs may not edit CHANGELOG.md. release-please auto-manages it from conventional commits. See CLAUDE.md §Versioning."
            exit 1
          fi

          # package.json `"version":` line must not be touched. Other edits
          # (deps, scripts, etc.) are fine — only the version key is locked.
          if git diff "origin/${{ github.base_ref }}" HEAD -- package.json | grep -qE '^[+-]\s*"version":'; then
            echo "::error file=package.json::Feature PRs may not bump the version field. release-please auto-bumps from conventional commits."
            exit 1
          fi

          echo "OK: PR does not touch CHANGELOG.md or package.json version"

  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Setup pnpm
        # v4 pinned to SHA. Resolved via gh api git/refs/tags/v4.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: pnpm test:components

  test-backend:
    runs-on: ubuntu-latest
    # `lint-cardinality-map` + `lint-write-pool-routing` added as dependencies so
    # a P1 / write-routing violation blocks backend work before sqlx/test cycles
    # burn runner minutes. Both lint jobs are cheap (~1s) so the serialisation
    # cost is negligible.
    needs: [changes, lint-cardinality-map, lint-write-pool-routing]
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # TEST_POSTGRES_PASSWORD is a CI-only throwaway secret; the value is
        # constrained to URL-safe characters (A-Za-z0-9) so it can be embedded
        # in DATABASE_URL below without percent-encoding. The `|| 'citestpw'`
        # fallback keeps this throwaway DB working in Dependabot's restricted
        # context, where repo secrets are not exposed and the bare secret would
        # be empty (postgres then refuses to initialize and the job fails).
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      # Install mold (NOT in the github-hosted ubuntu-latest image; required by
      # hotel-backend/.cargo/config.toml's `-fuse-ld=mold` pin). clang and
      # postgresql-client ship on ubuntu-latest already; listed here as
      # belt-and-suspenders since `apt install -y` is idempotent.
      - name: Install build + test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold clang postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}
        run: |
          psql -h localhost -p 5439 -U postgres -d hotelnew -f init-db/init-hotelnew.sql
          # Second logical DB (same schema) so the HF Ville write-routing test
          # (tests/test_ville_write_routing.rs) can prove branch=hfville writes
          # land in hotelville, not hotelnew. Skips itself if VILLE_DATABASE_URL is unset.
          createdb -h localhost -p 5439 -U postgres hotelville
          psql -h localhost -p 5439 -U postgres -d hotelville -f init-db/init-hotelnew.sql

      - name: Install Rust toolchain
        # This action derives the toolchain from the pinned ref itself — the SHA
        # is the tip of dtolnay/rust-toolchain's per-version branch. This action
        # version does NOT accept a `toolchain:` input (it would be ignored with
        # a warning), so the version is encoded by the SHA alone.
        # Bumped 1.89 -> 1.96 (SHA of the `1.96` branch) to match the runtime
        # Dockerfile (rust:1.96-bookworm) and satisfy sqlx 0.9's MSRV of 1.94.
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e  # 1.96

      # sccache wraps every rustc invocation and caches its output keyed on the
      # exact crate inputs. It complements Swatinem/rust-cache (which caches
      # the whole target/ dir). Treated as opportunistic: if the action fails
      # OR the GHA Cache service is unreachable at server-start time, we skip
      # RUSTC_WRAPPER and fall through to a plain build instead of failing
      # the job. The probe step does the real check — the action above only
      # installs the binary.
      - name: Set up sccache
        id: sccache_setup
        # v0.0.9+ uses the GHA Cache v2 API (`ACTIONS_RESULTS_URL`).
        # GitHub sunset the v1 cache API on 2026-02-01, after which v0.0.6
        # got 400s from artifactcache.actions.githubusercontent.com on every
        # probe. Pinned to v0.0.10 (Batch D pinned to commit SHA — the
        # tag itself was last moved on the v0.0.10 release).
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        continue-on-error: true

      - name: Probe sccache (verify GHA Cache reachable)
        id: sccache_probe
        if: steps.sccache_setup.outcome == 'success'
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        run: |
          sccache --start-server
          sccache --show-stats
          sccache --stop-server

      - name: Cache Rust dependencies
        # v2 pinned to SHA. Resolved via gh api git/refs/tags/v2.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: hotel-backend
          # `cache-on-failure: true` — preserve the partially-built target/
          # when the test step fails. Without this, a flaky test (or a
          # transient `cargo test` panic) wipes the cache and the next
          # run pays the full cold-compile cost. Matches middleware-build.yml.
          cache-on-failure: true

      - name: Run backend tests
        working-directory: hotel-backend
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}@localhost:5439/hotelnew
          VILLE_DATABASE_URL: postgres://postgres:${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}@localhost:5439/hotelville
          SQLX_OFFLINE: "true"
          SCCACHE_GHA_ENABLED: ${{ steps.sccache_probe.outcome == 'success' && 'true' || 'false' }}
          RUSTC_WRAPPER: ${{ steps.sccache_probe.outcome == 'success' && 'sccache' || '' }}
        # `--locked` aborts if Cargo.lock is out of date with Cargo.toml.
        # CI parity with the production Dockerfile build (also uses --locked).
        #
        # `--test-threads=1`: integration tests share ONE PostgreSQL instance
        # and ONE `ht_*` schema namespace. Running them in parallel races
        # against shared rows — see the `customer_search_by_name` flake
        # (CI run 24957295146) where a concurrent `customer_crud_lifecycle`
        # cleanup nuked the search test's freshly-inserted rows mid-assertion.
        # The cleanup helper in `tests/common/mod.rs` was tightened to use
        # exact-match markers instead of `LIKE 'TEST_%'`; this flag is
        # belt-and-suspenders against any future shared-DB race we haven't
        # yet enumerated. Cost is ~5-10s on a 13-test suite — acceptable.
        run: cargo test --locked -- --test-threads=1

  # init-db / migrations drift check (Batch E of post-Phase-5.5 audit).
  #
  # Why this exists: a fresh deployment runs `init-db/init-hotelnew.sql` (the
  # canonical seed) and then `scripts/migrate.sh` against the same database.
  # If a developer adds a migration to `migrations/pg/` but forgets to mirror
  # the change into `init-hotelnew.sql`, the seed lands one schema and migrate
  # then re-applies the same DDL on top — producing inconsistent schema_migrations
  # rows on fresh deploys vs. upgrade paths and (worse) silently masking that
  # the seed file is incomplete.
  #
  # The check spins up a throwaway Postgres, applies the init seed, then runs
  # migrate.sh. The contract is: zero migrations applied on top of the seed.
  # The migration runner emits "No pending migrations" when it has nothing
  # to do — we grep for that. Any other outcome fails the job loudly.
  #
  # Runs on EVERY push (not just master) so PRs catch drift before merge.
  init-db-migrations-drift-check:
    runs-on: ubuntu-latest
    needs: changes
    # Only worth running when init-db, migrations, the runner script, OR this
    # workflow itself was touched. The `deploy` paths-filter already covers
    # init-db + migrations + migrate.sh; piggyback on it.
    if: needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as the runtime newdb container in docker-compose.yml
        # (Batch C). Pinning the test runner to the same image ensures the
        # drift check exercises the exact PostgreSQL version production sees.
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --name drift-check-db
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      # postgresql-client ships on ubuntu-latest; this step is belt-and-suspenders
      # in case the image rotates a future major that drops it. `apt install -y`
      # is idempotent.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply init-db seed
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}
        # ON_ERROR_STOP=1 fails the step on the first SQL error so a broken
        # seed doesn't masquerade as "drift detected".
        run: |
          psql -h localhost -p 5439 -U postgres -d hotelnew \
            -v ON_ERROR_STOP=1 \
            -f init-db/init-hotelnew.sql

      - name: Run migrate.sh against seeded database
        env:
          # migrate.sh shells `docker exec ${DB_CONTAINER:-new-hotel-db} ...`.
          # The service container is renamed `drift-check-db` here so this
          # job's container doesn't conflict with anything else docker-named
          # `new-hotel-db` on the runner (originally a self-hosted-runner
          # collision; harmless and intentional on github-hosted too).
          DB_CONTAINER: drift-check-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD || 'citestpw' }}
          POSTGRES_DB: hotelnew
          PGPORT: "5439"
        run: |
          set -uo pipefail   # NOT -e: we want to inspect the runner's exit code
          OUTPUT=$(./scripts/migrate.sh 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          echo "----- migrate.sh exit code: $STATUS -----"

          # Contract: a fresh init-db + migrate.sh must apply ZERO migrations.
          # The runner prints exactly "Database is up to date. No pending
          # migrations." when the schema_migrations table already lists every
          # version found in migrations/pg/. Any other terminal state means
          # init-hotelnew.sql is missing something a migration adds.
          if [ "$STATUS" -eq 0 ] && echo "$OUTPUT" | grep -q "No pending migrations"; then
            echo "PASS: init-db/init-hotelnew.sql is in sync with migrations/pg/."
            exit 0
          fi

          echo "::error::Drift detected: init-db/init-hotelnew.sql is out of sync with migrations/pg/."
          echo "::error::Update init-db/init-hotelnew.sql to include the contents of the pending migrations (DDL + matching schema_migrations seed row)."
          exit 1

  build-frontend:
    runs-on: ubuntu-latest
    # Build runs in PARALLEL with test-frontend (Track F CI optimization).
    # The deploy job still gates on `test-frontend.result == success` so a
    # red test never reaches prod — but the build doesn't have to WAIT
    # for tests. Worst case: tests fail, an unused :latest image lands on
    # GHCR and gets garbage-collected by the next green build.
    #
    # `should-deploy` (Track J8) is in `needs:` so a release-please-only
    # push skips the build entirely. `skip != 'true'` keeps the original
    # change-filter semantics intact for every other push.
    needs: [changes, should-deploy]
    if: needs.changes.outputs.frontend == 'true' && needs.should-deploy.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          # PR runs MUST NOT push to GHCR — only master pushes (or a master-
          # targeted workflow_dispatch) do. The build itself still executes
          # (so the GHA cache + Docker layer cache measurements still apply),
          # and on master events the image is tagged + pushed exactly as before.
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: frontend` (Batch D): isolates the GHA cache namespace
          # so build-backend can't evict it.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}
            NEXT_PUBLIC_AUTH_REQUIRED=${{ vars.AUTH_REQUIRED || 'false' }}

  build-backend:
    runs-on: ubuntu-latest
    # Build runs in PARALLEL with test-backend (Track F CI optimization).
    # The deploy job still gates on `test-backend.result == success` so a
    # red test never reaches prod — but the build doesn't have to WAIT
    # for tests. Worst case: tests fail, an unused :latest image lands on
    # GHCR and gets garbage-collected by the next green build.
    #
    # `lint-cardinality-map` is added to needs so a P1 violation blocks the
    # backend image build too — pairs with the same dependency on
    # test-backend so the gate fires on both build and test paths.
    #
    # `should-deploy` (Track J8) skips backend image rebuild on release-please-
    # only pushes — see comment block at the `should-deploy` job for rationale.
    needs: [changes, lint-cardinality-map, lint-write-pool-routing, should-deploy]
    if: needs.changes.outputs.backend == 'true' && needs.should-deploy.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./hotel-backend
          # PR runs MUST NOT push to GHCR — only master pushes (or a master-
          # targeted workflow_dispatch) do. See the equivalent comment in
          # build-frontend; same rationale.
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: backend` per Batch D — isolates GHA cache namespace.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, lint-cardinality-map, lint-write-pool-routing, test-frontend, test-backend, init-db-migrations-drift-check, build-frontend, build-backend, should-deploy]
    # Least-privilege: the deploy step only needs to pull images from GHCR
    # (read on packages) and read the working tree.
    permissions:
      contents: read
      packages: read
    # Serialise deploys to evergreen so two back-to-back master pushes can
    # never have their `docker compose up` interleave. cancel-in-progress
    # is OFF because the in-flight deploy already pulled images + is
    # mid-migration; aborting it leaves PG and the backend container in
    # mismatched-schema state.
    concurrency:
      group: deploy-prod-evergreen
      cancel-in-progress: false
    # Gate on the new drift check too (Batch E): if init-db/init-hotelnew.sql
    # is out of sync with migrations/pg/, we refuse to deploy so the operator
    # can't accidentally leave production with a half-seeded schema.
    # `success || skipped` mirrors the test-* jobs — the check is skipped
    # when no migration / init-db / migrate.sh files changed.
    #
    # Deploy ONLY fires on master pushes or a master-targeted workflow_dispatch.
    # The `pull_request` trigger (added for CI measurement) MUST NOT touch prod —
    # the explicit event_name check below is the load-bearing guard against that.
    # The downstream build-* jobs still run on PRs but with push:false, so a PR
    # exercising the workflow can't end up with a half-pushed image either.
    #
    # Track J8: `needs.should-deploy.outputs.skip != 'true'` short-circuits the
    # deploy step on release-please-only pushes. See the `should-deploy` job's
    # comment block for the matcher's behaviour and failure modes.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' &&
      needs.should-deploy.outputs.skip != 'true' &&
      needs.lint-cardinality-map.result == 'success' &&
      needs.lint-write-pool-routing.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.init-db-migrations-drift-check.result == 'success' || needs.init-db-migrations-drift-check.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v5.0.0

      - name: Cache cloudflared binary
        id: cf-cache
        # actions/cache v4.2.0 pinned to commit SHA.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/cloudflared
          # Pin to a SPECIFIC release version so the cache key is stable.
          # NEVER key on `latest` — Cloudflare cuts a new release every few
          # weeks and the binary at /latest/ changes silently. That would
          # mean: cache hit, but cloudflared on disk is the old release,
          # leading to silent drift between CI runs.
          # Bump the version below to refresh the cached binary.
          key: cloudflared-2026.3.0-linux-amd64

      - name: Install cloudflared
        # GH-hosted runner needs cloudflared to reach evergreen via the same
        # asgard tunnel your daily SSH uses. No CF Access app gates evergreen,
        # so no service token / OAuth required — cloudflared just routes the
        # connection through the tunnel. Pinned to a specific release so the
        # cache step above remains valid; bump both together.
        if: steps.cf-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.3.0/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Verify cloudflared
        run: cloudflared --version

      - name: Install SSH key + known_hosts
        # ed25519 keypair generated locally; private half is GH Secret. Public
        # half is in /home/deploy/.ssh/authorized_keys on evergreen with a
        # forced-command pinning /srv/run-deploy.sh. The host key is pinned in
        # known_hosts so a mid-flight MITM via a tunnel hijack would be detected.
        env:
          SSH_KEY:  ${{ secrets.EVERGREEN_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.EVERGREEN_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH to evergreen
        env:
          # Auth for the docker daemon on evergreen to pull private GHCR images.
          # GITHUB_TOKEN's packages:read scope is enough for `docker pull`;
          # token expires when this run ends, so no long-lived credential
          # lives on evergreen.
          GHCR_USER:               ${{ github.actor }}
          GHCR_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          DB_SERVER:               ${{ secrets.DB_SERVER }}
          DB_NAME:                 ${{ secrets.DB_NAME }}
          DB_USER:                 ${{ secrets.DB_USER }}
          # DB_PASSWORD / POSTGRES_PASSWORD / SLACK_WEBHOOK_URL are now
          # delivered via the `secrets:` block of the JSON payload (see
          # security-audit 2026-05-14 follow-on). The deploy script
          # (/srv/run-deploy.sh on evergreen) writes each `.secrets[<key>]`
          # value to /home/deploy/secrets/<key> with mode 0400, owner
          # deploy:docker, then `docker compose up -d` bind-mounts those
          # files into the containers at /run/secrets/<key>. The Rust
          # binaries' startup hydrator reads them — see
          # hotel-backend/src/secrets.rs.
          DB_PASSWORD:             ${{ secrets.DB_PASSWORD }}
          MSSQL_PORT:              ${{ secrets.MSSQL_PORT }}
          POSTGRES_DB:             ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:           ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          # VILLE_DB_PASSWORD is the same value as POSTGRES_PASSWORD until
          # ADR 0001 Phase 8 splits them — passing it as a distinct entry
          # so a future rotation only touches the GH secret + this line.
          VILLE_DB_PASSWORD:       ${{ secrets.POSTGRES_PASSWORD }}
          SLACK_WEBHOOK_URL:       ${{ secrets.SLACK_WEBHOOK }}
          READER_RESOLVE_SECRET:   ${{ secrets.READER_RESOLVE_SECRET }}
          CF_ACCESS_HK_AUD:        ${{ secrets.CF_ACCESS_HK_AUD }}
          LEGACY_SYNC_ENABLED:     ${{ secrets.LEGACY_SYNC_ENABLED }}
          LEGACY_SYNC_SHADOW_MODE: ${{ secrets.LEGACY_SYNC_SHADOW_MODE }}
          AUTH_ENABLED:            ${{ vars.AUTH_ENABLED || 'false' }}
          # Ship-dark coexistence flags — default false; flip via `gh variable set
          # <NAME> -b true` + redeploy. Backend reads each at runtime (default false),
          # so an absent variable is a no-op. See docs/VERIFICATION-CHECKLIST.md.
          ROUND_WRITEBACK_ENABLED:        ${{ vars.ROUND_WRITEBACK_ENABLED || 'false' }}
          CHECKOUT_SERVER_TOTAL_ENABLED:  ${{ vars.CHECKOUT_SERVER_TOTAL_ENABLED || 'false' }}
          BOOKING_VALIDATION_ENABLED:     ${{ vars.BOOKING_VALIDATION_ENABLED || 'false' }}
          HFVILLE_WRITES_ENABLED:         ${{ vars.HFVILLE_WRITES_ENABLED || 'false' }}
          # Check-in registration legacy mirrors (Task #8) — Tb_Save_Image image
          # mirror + HT_CheckIn_Other_People companion mirror.
          GUEST_DOCUMENT_STORAGE_ENABLED:   ${{ vars.GUEST_DOCUMENT_STORAGE_ENABLED || 'false' }}
          TM30_COMPANION_WRITEBACK_ENABLED: ${{ vars.TM30_COMPANION_WRITEBACK_ENABLED || 'false' }}
          # Layout-edit mode (จัดผัง, #236) — shared-board room_x/room_y writeback.
          LAYOUT_WRITEBACK_ENABLED:         ${{ vars.LAYOUT_WRITEBACK_ENABLED || 'false' }}
          # Self-healing reconcile sweep — per-site so Ville can soak first.
          RECONCILE_FORCE_CONVERGE_ENABLED:         ${{ vars.RECONCILE_FORCE_CONVERGE_ENABLED || 'false' }}
          HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED: ${{ vars.HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED || 'false' }}
          # Self-healing re-ingest arm for the reconcile sweep's `missing_pg`
          # rows (dropped CT events) — per-site so Ville canaries first.
          RECONCILE_REINGEST_MISSING_PG_ENABLED:         ${{ vars.RECONCILE_REINGEST_MISSING_PG_ENABLED || 'false' }}
          HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED: ${{ vars.HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED || 'false' }}
          # Ville's reconcile backstop (#67) — the sync-hfville worker holds the
          # only reconcile for HF Ville. It was previously absent from this
          # payload, so run-deploy.sh's wholesale .env rewrite dropped any
          # host-set value and it only worked via the compose default. Default
          # MUST stay 'true' — flipping it to false takes Ville's drift
          # backstop dark.
          HFVILLE_WORKER_RECONCILE_ENABLED:         ${{ vars.HFVILLE_WORKER_RECONCILE_ENABLED || 'true' }}
          # Per-table CT watermarks (Resilience PR R3, migration 050; reseed in
          # migration 078) — per-site so Ville can soak first. Ships dark.
          SYNC_PER_TABLE_WATERMARK:         ${{ vars.SYNC_PER_TABLE_WATERMARK || 'false' }}
          HFVILLE_SYNC_PER_TABLE_WATERMARK: ${{ vars.HFVILLE_SYNC_PER_TABLE_WATERMARK || 'false' }}
          # Per-job slack notification kill-switches (2026-05-15).
          # Default 'true' preserves prior behavior. Operators flip to
          # 'false' via `gh variable set HOURLY_REPORT_ENABLED -b false`
          # during a CT-watcher backfill window to silence the cron noise.
          HOURLY_REPORT_ENABLED:          ${{ vars.HOURLY_REPORT_ENABLED || 'true' }}
          CHECKIN_NOTIFICATIONS_ENABLED:  ${{ vars.CHECKIN_NOTIFICATIONS_ENABLED || 'true' }}
          CHECKOUT_NOTIFICATIONS_ENABLED: ${{ vars.CHECKOUT_NOTIFICATIONS_ENABLED || 'true' }}
          BOOKING_NOTIFICATIONS_ENABLED:  ${{ vars.BOOKING_NOTIFICATIONS_ENABLED || 'true' }}
          # Tracing log level. Pinned to debug for scheduler::sync +
          # scheduler::jobs until Track B junction-table migration ships
          # and reconcile noise drops to a steady-state baseline (incident
          # 2026-05-18 — sync_checkins broke silently for 2+ days, the
          # CT watcher missed 28+ UPDATEs to HT_CheckIn_H/Ds with no
          # observable signal until the reconcile sweep flagged the
          # divergence). Override per-deploy via the GH variable when
          # quiet-mode is needed (e.g. major version cutovers); unset
          # restores the debug-pinned default.
          RUST_LOG:                      ${{ vars.RUST_LOG || 'hotel_backend::scheduler::sync=debug,hotel_backend::scheduler::jobs=debug,hotel_backend=info,writeback=info,sync=info,tower_http=info' }}
        # Build a JSON payload the way /srv/run-deploy.sh expects:
        #   { commit_sha, deploy_payload_b64 (tar.gz), env: {...},
        #     secrets: {...} }
        # then pipe it over SSH to deploy@evergreen. The forced-command
        # in authorized_keys runs /srv/run-deploy.sh with this payload as stdin.
        # No commands beyond that are possible — the SSH key only triggers the script.
        #
        # NEW (2026-05-14): `secrets` block carries the values that used
        # to ship inside `env`. Pre-merge prerequisite — /srv/run-deploy.sh
        # MUST be updated to write each `secrets[<key>]` value to
        # /home/deploy/secrets/<key> before `docker compose up`. The
        # `env` block deliberately keeps `DB_PASSWORD` / `POSTGRES_PASSWORD`
        # / `SLACK_WEBHOOK_URL` for now so a deploy script not yet updated
        # falls back to .env writing (and the worker's env-var fallback
        # still loads them) — pure additive change. Remove the env-side
        # entries in a follow-up PR ONCE the deploy script is updated
        # AND one production deploy has confirmed the secret-file path
        # works end to end.
        run: |
          set -euo pipefail
          # Track J5 (2026-05-14): scripts/deploy/run-deploy.sh is included
          # in the tarball so the live /srv/run-deploy.sh on evergreen
          # self-updates from the repo on every deploy. The repo copy at
          # scripts/deploy/run-deploy.sh is now the source of truth.
          # Forced-command SSH config on evergreen makes scp/rsync of
          # arbitrary paths impossible — bundling the script in the existing
          # payload + relying on the script's self-update tail block is the
          # only path that doesn't require relaxing authorized_keys.
          # migrations/legacy-mssql + scripts/migrate-legacy-mssql.sh ride the
          # tarball so run-deploy.sh can auto-apply + verify CT-prerequisite DDL
          # on the legacy servers, same as it does PG migrations (incident
          # 2026-06-24: binary shipped ahead of its CT-enable migration).
          tar -czf /tmp/deploy.tar.gz \
            docker-compose.yml \
            init-db \
            migrations/pg \
            migrations/legacy-mssql \
            scripts/migrate.sh \
            scripts/migrate-legacy-mssql.sh \
            scripts/deploy/run-deploy.sh

          # The tarball base64 is passed to jq via --rawfile (reads from a
          # file), NOT --arg "$(base64 ...)". A single command-line argument is
          # capped at MAX_ARG_STRLEN (128 KB on Linux); the payload crossed that
          # when migrations/legacy-mssql + the legacy runner were bundled
          # (2026-06-24 deploy failure: "jq: Argument list too long" → empty
          # payload → "malformed payload"). --rawfile has no length limit and
          # future-proofs further tarball growth. tr -d '\n' drops base64's
          # trailing newline so the string is exactly the encoded bytes.
          base64 -w0 < /tmp/deploy.tar.gz | tr -d '\n' > /tmp/deploy.b64

          # RUST_LOG default below is pinned to debug for scheduler::sync
          # + scheduler::jobs until Track B junction-table migration ships
          # and reconcile noise drops to a steady-state baseline (incident
          # 2026-05-18 — sync_checkins broke silently for 2+ days). Keep
          # in sync with the vars.RUST_LOG default in the `env:` block
          # above.
          jq -n \
            --arg commit_sha          "$GITHUB_SHA" \
            --rawfile deploy_payload_b64 /tmp/deploy.b64 \
            --arg ghcr_user           "$GHCR_USER" \
            --arg ghcr_token          "$GHCR_TOKEN" \
            --arg DB_SERVER           "$DB_SERVER" \
            --arg DB_NAME             "$DB_NAME" \
            --arg DB_USER             "$DB_USER" \
            --arg DB_PASSWORD         "$DB_PASSWORD" \
            --arg MSSQL_PORT          "${MSSQL_PORT:-1433}" \
            --arg POSTGRES_DB         "$POSTGRES_DB" \
            --arg POSTGRES_USER       "$POSTGRES_USER" \
            --arg POSTGRES_PASSWORD   "$POSTGRES_PASSWORD" \
            --arg VILLE_DB_PASSWORD   "$VILLE_DB_PASSWORD" \
            --arg SLACK_WEBHOOK_URL   "$SLACK_WEBHOOK_URL" \
            --arg READER_RESOLVE_SECRET "$READER_RESOLVE_SECRET" \
            --arg CF_ACCESS_HK_AUD    "$CF_ACCESS_HK_AUD" \
            --arg LEGACY_SYNC_ENABLED "$LEGACY_SYNC_ENABLED" \
            --arg LEGACY_SYNC_SHADOW_MODE "$LEGACY_SYNC_SHADOW_MODE" \
            --arg AUTH_ENABLED        "$AUTH_ENABLED" \
            --arg ROUND_WRITEBACK_ENABLED        "${ROUND_WRITEBACK_ENABLED:-false}" \
            --arg CHECKOUT_SERVER_TOTAL_ENABLED  "${CHECKOUT_SERVER_TOTAL_ENABLED:-false}" \
            --arg BOOKING_VALIDATION_ENABLED     "${BOOKING_VALIDATION_ENABLED:-false}" \
            --arg HFVILLE_WRITES_ENABLED         "${HFVILLE_WRITES_ENABLED:-false}" \
            --arg GUEST_DOCUMENT_STORAGE_ENABLED   "${GUEST_DOCUMENT_STORAGE_ENABLED:-false}" \
            --arg TM30_COMPANION_WRITEBACK_ENABLED "${TM30_COMPANION_WRITEBACK_ENABLED:-false}" \
            --arg LAYOUT_WRITEBACK_ENABLED         "${LAYOUT_WRITEBACK_ENABLED:-false}" \
            --arg RECONCILE_FORCE_CONVERGE_ENABLED         "${RECONCILE_FORCE_CONVERGE_ENABLED:-false}" \
            --arg HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED "${HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED:-false}" \
            --arg RECONCILE_REINGEST_MISSING_PG_ENABLED         "${RECONCILE_REINGEST_MISSING_PG_ENABLED:-false}" \
            --arg HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED "${HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED:-false}" \
            --arg HFVILLE_WORKER_RECONCILE_ENABLED         "${HFVILLE_WORKER_RECONCILE_ENABLED:-true}" \
            --arg SYNC_PER_TABLE_WATERMARK         "${SYNC_PER_TABLE_WATERMARK:-false}" \
            --arg HFVILLE_SYNC_PER_TABLE_WATERMARK "${HFVILLE_SYNC_PER_TABLE_WATERMARK:-false}" \
            --arg HOURLY_REPORT_ENABLED          "${HOURLY_REPORT_ENABLED:-true}" \
            --arg CHECKIN_NOTIFICATIONS_ENABLED  "${CHECKIN_NOTIFICATIONS_ENABLED:-true}" \
            --arg CHECKOUT_NOTIFICATIONS_ENABLED "${CHECKOUT_NOTIFICATIONS_ENABLED:-true}" \
            --arg BOOKING_NOTIFICATIONS_ENABLED  "${BOOKING_NOTIFICATIONS_ENABLED:-true}" \
            --arg RUST_LOG                      "${RUST_LOG:-hotel_backend::scheduler::sync=debug,hotel_backend::scheduler::jobs=debug,hotel_backend=info,writeback=info,sync=info,tower_http=info}" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token },
              env: {
                DB_SERVER:                    $DB_SERVER,
                DB_NAME:                      $DB_NAME,
                DB_USER:                      $DB_USER,
                DB_PASSWORD:                  $DB_PASSWORD,
                MSSQL_PORT:                   $MSSQL_PORT,
                POSTGRES_DB:                  $POSTGRES_DB,
                POSTGRES_USER:                $POSTGRES_USER,
                POSTGRES_PASSWORD:            $POSTGRES_PASSWORD,
                SLACK_WEBHOOK_URL:            $SLACK_WEBHOOK_URL,
                READER_RESOLVE_SECRET:        $READER_RESOLVE_SECRET,
                CF_ACCESS_HK_AUD:             $CF_ACCESS_HK_AUD,
                LEGACY_SYNC_ENABLED:          $LEGACY_SYNC_ENABLED,
                LEGACY_SYNC_SHADOW_MODE:      $LEGACY_SYNC_SHADOW_MODE,
                AUTH_ENABLED:                 $AUTH_ENABLED,
                ROUND_WRITEBACK_ENABLED:        $ROUND_WRITEBACK_ENABLED,
                CHECKOUT_SERVER_TOTAL_ENABLED:  $CHECKOUT_SERVER_TOTAL_ENABLED,
                BOOKING_VALIDATION_ENABLED:     $BOOKING_VALIDATION_ENABLED,
                HFVILLE_WRITES_ENABLED:         $HFVILLE_WRITES_ENABLED,
                GUEST_DOCUMENT_STORAGE_ENABLED:   $GUEST_DOCUMENT_STORAGE_ENABLED,
                TM30_COMPANION_WRITEBACK_ENABLED: $TM30_COMPANION_WRITEBACK_ENABLED,
                LAYOUT_WRITEBACK_ENABLED:         $LAYOUT_WRITEBACK_ENABLED,
                RECONCILE_FORCE_CONVERGE_ENABLED:         $RECONCILE_FORCE_CONVERGE_ENABLED,
                HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED: $HFVILLE_RECONCILE_FORCE_CONVERGE_ENABLED,
                RECONCILE_REINGEST_MISSING_PG_ENABLED:         $RECONCILE_REINGEST_MISSING_PG_ENABLED,
                HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED: $HFVILLE_RECONCILE_REINGEST_MISSING_PG_ENABLED,
                HFVILLE_WORKER_RECONCILE_ENABLED:         $HFVILLE_WORKER_RECONCILE_ENABLED,
                SYNC_PER_TABLE_WATERMARK:         $SYNC_PER_TABLE_WATERMARK,
                HFVILLE_SYNC_PER_TABLE_WATERMARK: $HFVILLE_SYNC_PER_TABLE_WATERMARK,
                HOURLY_REPORT_ENABLED:          $HOURLY_REPORT_ENABLED,
                CHECKIN_NOTIFICATIONS_ENABLED:  $CHECKIN_NOTIFICATIONS_ENABLED,
                CHECKOUT_NOTIFICATIONS_ENABLED: $CHECKOUT_NOTIFICATIONS_ENABLED,
                BOOKING_NOTIFICATIONS_ENABLED:  $BOOKING_NOTIFICATIONS_ENABLED,
                RUST_LOG:                     $RUST_LOG,
              },
              secrets: {
                db_password:        $DB_PASSWORD,
                postgres_password:  $POSTGRES_PASSWORD,
                ville_db_password:  $VILLE_DB_PASSWORD,
                slack_webhook_url:  $SLACK_WEBHOOK_URL,
              }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org
