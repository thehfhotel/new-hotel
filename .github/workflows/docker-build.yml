name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Note: no cancel-previous job. The workflow only triggers on master pushes
  # and workflow_dispatch (no PR builds), so cancelling earlier runs only
  # serves to orphan in-flight deploys when commits land back-to-back. We let
  # all runs complete; the deploy step is idempotent (docker compose up -d).
  changes:
    # Migrated 2026-04-30 from `ubuntu-latest` to the existing self-hosted
    # runner on evergreen ([self-hosted, linux, deploy]). Driver: GH Actions
    # Free-tier quota exhaustion. Self-hosted minutes don't count against
    # billing, so spending limit at $0 + this label = $0 forever, no
    # surprise. Trade-off accepted: jobs serialize on the single runner
    # (~10–15 min wall vs. ~4 min parallel previously) and CI is unavailable
    # if evergreen is down. See CHANGELOG 2.54.31 for the full rationale.
    runs-on: [self-hosted, linux, deploy]
    # GITHUB_TOKEN least-privilege: this job only reads the working tree.
    permissions:
      contents: read
    outputs:
      # `frontend` (was: `code`) — Next.js webapp + tooling files only.
      # Anything else (backend, infra, docs) leaves it false.
      frontend: ${{ steps.filter.outputs.frontend }}
      # `backend` — Rust workspace + schema files (sqlx compile-time queries
      # depend on schema). A migrations/ change retests + rebuilds the
      # backend so a schema/code mismatch can never reach a green deploy.
      backend: ${{ steps.filter.outputs.backend }}
      # `deploy` — files that ONLY affect the running services (compose,
      # migrations, deploy/runner scripts). When any of these fires WITHOUT
      # a build, the deploy job re-rolls the existing :latest images.
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Check for changes
        # v4.0.1 pinned to commit SHA. Bumped 2026-04-30 from v3 to clear
        # the Node.js 20 deprecation warning (forced node24 by 2026-06-02).
        # v4 release was a runtime-only update (PR #294) — no syntax change.
        # Bumps surface as Dependabot PRs (.github/dependabot.yml).
        #
        # ## Filter design
        #
        # Each filter is the COMPLETE list of paths whose change MUST trigger
        # the corresponding job(s). Paths NOT covered by any filter (e.g.
        # CHANGELOG.md, docs/**, README.md, AGENTS.md) cause every job to skip
        # — which is the correct outcome for doc-only commits: no rebuild,
        # no deploy, no wasted runner minutes.
        #
        # If you add a new top-level path, decide which filter it belongs
        # under and add it. Catch-all globs (`**` at the root) are deliberately
        # NOT used here — explicit lists make the test/build matrix legible.
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - '__tests__/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'Dockerfile'
              - '.dockerignore'
            backend:
              - 'hotel-backend/**'
              # Schema changes affect sqlx::query!() compile-time validation,
              # so any migration / init-db DDL change must retest + rebuild
              # the backend. Without this the .sqlx/ cache could go stale
              # without CI catching it before deploy.
              - 'migrations/pg/**'
              - 'init-db/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'
              - 'migrations/pg/**'
              - 'scripts/migrate.sh'
              - 'scripts/backup-db.sh'

  test-frontend:
    runs-on: [self-hosted, linux, deploy]
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Setup pnpm
        # v4 pinned to SHA. Resolved via gh api git/refs/tags/v4.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: pnpm test:components

  test-backend:
    runs-on: [self-hosted, linux, deploy]
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # TEST_POSTGRES_PASSWORD is a CI-only throwaway secret; the value is
        # constrained to URL-safe characters (A-Za-z0-9) so it can be embedded
        # in DATABASE_URL below without percent-encoding.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      # MUST run before "Initialize database" — that step shells `psql`,
      # which is in `postgresql-client` and isn't pre-installed on the
      # self-hosted runner the way it was on github-hosted ubuntu-latest.
      # Also installs mold + clang, both required by hotel-backend's
      # `-fuse-ld=mold` linker pin in `.cargo/config.toml`.
      # `apt-get install -y` is idempotent so re-runs on a warm runner skip
      # already-installed packages.
      - name: Install build + test prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold clang postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: psql -h localhost -p 5439 -U postgres -d hotelnew -f init-db/init-hotelnew.sql

      - name: Install Rust toolchain
        # Pinned to a `1.89` branch SHA (per Batch D). The `@stable` ref the
        # action publishes is a moving target — pinning it caps the toolchain
        # at the version used to generate `.sqlx/` cache files.
        uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e  # 1.89
        with:
          toolchain: "1.89"

      # sccache wraps every rustc invocation and caches its output keyed on the
      # exact crate inputs. It complements Swatinem/rust-cache (which caches
      # the whole target/ dir). Treated as opportunistic: if the action fails
      # OR the GHA Cache service is unreachable at server-start time, we skip
      # RUSTC_WRAPPER and fall through to a plain build instead of failing
      # the job. The probe step does the real check — the action above only
      # installs the binary.
      - name: Set up sccache
        id: sccache_setup
        # v0.0.9+ uses the GHA Cache v2 API (`ACTIONS_RESULTS_URL`).
        # GitHub sunset the v1 cache API on 2026-02-01, after which v0.0.6
        # got 400s from artifactcache.actions.githubusercontent.com on every
        # probe. Pinned to v0.0.10 (Batch D pinned to commit SHA — the
        # tag itself was last moved on the v0.0.10 release).
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        continue-on-error: true

      - name: Probe sccache (verify GHA Cache reachable)
        id: sccache_probe
        if: steps.sccache_setup.outcome == 'success'
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        run: |
          sccache --start-server
          sccache --show-stats
          sccache --stop-server

      - name: Cache Rust dependencies
        # v2 pinned to SHA. Resolved via gh api git/refs/tags/v2.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: hotel-backend

      - name: Run backend tests
        working-directory: hotel-backend
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5439/hotelnew
          SQLX_OFFLINE: "true"
          SCCACHE_GHA_ENABLED: ${{ steps.sccache_probe.outcome == 'success' && 'true' || 'false' }}
          RUSTC_WRAPPER: ${{ steps.sccache_probe.outcome == 'success' && 'sccache' || '' }}
        # `--locked` aborts if Cargo.lock is out of date with Cargo.toml.
        # CI parity with the production Dockerfile build (also uses --locked).
        #
        # `--test-threads=1`: integration tests share ONE PostgreSQL instance
        # and ONE `ht_*` schema namespace. Running them in parallel races
        # against shared rows — see the `customer_search_by_name` flake
        # (CI run 24957295146) where a concurrent `customer_crud_lifecycle`
        # cleanup nuked the search test's freshly-inserted rows mid-assertion.
        # The cleanup helper in `tests/common/mod.rs` was tightened to use
        # exact-match markers instead of `LIKE 'TEST_%'`; this flag is
        # belt-and-suspenders against any future shared-DB race we haven't
        # yet enumerated. Cost is ~5-10s on a 13-test suite — acceptable.
        run: cargo test --locked -- --test-threads=1

  # init-db / migrations drift check (Batch E of post-Phase-5.5 audit).
  #
  # Why this exists: a fresh deployment runs `init-db/init-hotelnew.sql` (the
  # canonical seed) and then `scripts/migrate.sh` against the same database.
  # If a developer adds a migration to `migrations/pg/` but forgets to mirror
  # the change into `init-hotelnew.sql`, the seed lands one schema and migrate
  # then re-applies the same DDL on top — producing inconsistent schema_migrations
  # rows on fresh deploys vs. upgrade paths and (worse) silently masking that
  # the seed file is incomplete.
  #
  # The check spins up a throwaway Postgres, applies the init seed, then runs
  # migrate.sh. The contract is: zero migrations applied on top of the seed.
  # The migration runner emits "No pending migrations" when it has nothing
  # to do — we grep for that. Any other outcome fails the job loudly.
  #
  # Runs on EVERY push (not just master) so PRs catch drift before merge.
  init-db-migrations-drift-check:
    runs-on: [self-hosted, linux, deploy]
    needs: changes
    # Only worth running when init-db, migrations, the runner script, OR this
    # workflow itself was touched. The `deploy` paths-filter already covers
    # init-db + migrations + migrate.sh; piggyback on it.
    if: needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # Same digest as the runtime newdb container in docker-compose.yml
        # (Batch C). Pinning the test runner to the same image ensures the
        # drift check exercises the exact PostgreSQL version production sees.
        image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --name drift-check-db
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      # MUST run before "Apply init-db seed" — that step shells `psql`,
      # which is in `postgresql-client` and isn't pre-installed on the
      # self-hosted runner (github-hosted ubuntu-latest shipped it).
      # `apt-get install -y` is idempotent.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply init-db seed
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        # ON_ERROR_STOP=1 fails the step on the first SQL error so a broken
        # seed doesn't masquerade as "drift detected".
        run: |
          psql -h localhost -p 5439 -U postgres -d hotelnew \
            -v ON_ERROR_STOP=1 \
            -f init-db/init-hotelnew.sql

      - name: Run migrate.sh against seeded database
        env:
          # migrate.sh shells `docker exec ${DB_CONTAINER:-new-hotel-db} ...`.
          # The service container is renamed `drift-check-db` here to avoid
          # colliding with the prod `new-hotel-db` container that lives on
          # the same self-hosted runner host (post-Phase-7 self-hosted
          # migration). DB_CONTAINER overrides the default for this step.
          DB_CONTAINER: drift-check-db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          POSTGRES_DB: hotelnew
          PGPORT: "5439"
        run: |
          set -uo pipefail   # NOT -e: we want to inspect the runner's exit code
          OUTPUT=$(./scripts/migrate.sh 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          echo "----- migrate.sh exit code: $STATUS -----"

          # Contract: a fresh init-db + migrate.sh must apply ZERO migrations.
          # The runner prints exactly "Database is up to date. No pending
          # migrations." when the schema_migrations table already lists every
          # version found in migrations/pg/. Any other terminal state means
          # init-hotelnew.sql is missing something a migration adds.
          if [ "$STATUS" -eq 0 ] && echo "$OUTPUT" | grep -q "No pending migrations"; then
            echo "PASS: init-db/init-hotelnew.sql is in sync with migrations/pg/."
            exit 0
          fi

          echo "::error::Drift detected: init-db/init-hotelnew.sql is out of sync with migrations/pg/."
          echo "::error::Update init-db/init-hotelnew.sql to include the contents of the pending migrations (DDL + matching schema_migrations seed row)."
          exit 1

  build-frontend:
    runs-on: [self-hosted, linux, deploy]
    # Block pushing :latest if frontend tests fail (Batch D of audit).
    needs: [changes, test-frontend]
    if: needs.changes.outputs.frontend == 'true' && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: frontend` (Batch D): isolates the GHA cache namespace
          # so build-backend can't evict it.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}

  build-backend:
    runs-on: [self-hosted, linux, deploy]
    # Block pushing :latest if backend tests fail (Batch D of audit).
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ./hotel-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: backend` per Batch D — isolates GHA cache namespace.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    runs-on: [self-hosted, linux, deploy]
    needs: [changes, test-frontend, test-backend, init-db-migrations-drift-check, build-frontend, build-backend]
    # Least-privilege: the deploy step only needs to pull images from GHCR
    # (read on packages) and read the working tree.
    permissions:
      contents: read
      packages: read
    # Serialise deploys to evergreen so two back-to-back master pushes can
    # never have their `docker compose up` interleave. cancel-in-progress
    # is OFF because the in-flight deploy already pulled images + is
    # mid-migration; aborting it leaves PG and the backend container in
    # mismatched-schema state.
    concurrency:
      group: deploy-prod-evergreen
      cancel-in-progress: false
    # Gate on the new drift check too (Batch E): if init-db/init-hotelnew.sql
    # is out of sync with migrations/pg/, we refuse to deploy so the operator
    # can't accidentally leave production with a half-seeded schema.
    # `success || skipped` mirrors the test-* jobs — the check is skipped
    # when no migration / init-db / migrate.sh files changed.
    if: |
      always() &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.init-db-migrations-drift-check.result == 'success' || needs.init-db-migrations-drift-check.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.0

      # Inline retry loop instead of docker/login-action: the snap-installed
      # docker daemon on evergreen periodically returns "network is
      # unreachable" on outbound TCP to ghcr.io's IP (`20.205.243.164`) due
      # to snap's mount-namespace shim flapping under container churn.
      # Symptoms: ~30 % of `docker login` / `docker pull` calls fail
      # immediately with ENETUNREACH while host curl to the same IP works
      # fine. This is a band-aid until snap-docker is replaced with
      # Docker CE (planned, requires a maintenance window). 5 attempts
      # with 5/10/15/20s linear backoff covers the worst flap windows
      # we've observed (~60 s); failing the whole step after that is the
      # right outcome.
      - name: Log in to Container Registry (retry-wrapped)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              echo "ghcr login OK on attempt $attempt"
              exit 0
            fi
            sleep_s=$((attempt * 5))
            echo "::warning::ghcr login attempt $attempt failed; retrying in ${sleep_s}s (snap-docker network flap workaround)"
            sleep $sleep_s
          done
          echo "::error::ghcr login failed after 5 attempts; investigate snap-docker on evergreen"
          exit 1

      - name: Deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Optional override — when the secret isn't set the deploy
          # script defaults to 1433 (HF Hotel). HF Ville will set this
          # to 1436 when its pipeline lands (task #69).
          MSSQL_PORT: ${{ secrets.MSSQL_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Phase 5 cutover: persist operator's enable + shadow-mode flip
          # across deploys (otherwise this .env would revert them every push,
          # per the known pitfall documented in docs/runbook-sync.md §4a).
          LEGACY_SYNC_ENABLED: ${{ secrets.LEGACY_SYNC_ENABLED }}
          LEGACY_SYNC_SHADOW_MODE: ${{ secrets.LEGACY_SYNC_SHADOW_MODE }}
        run: |
          set -e
          DEPLOY_DIR=/home/nut/new-hotel-production

          # Create deployment directory and copy files
          mkdir -p $DEPLOY_DIR/init-db
          mkdir -p $DEPLOY_DIR/migrations/pg
          mkdir -p $DEPLOY_DIR/scripts
          mkdir -p $DEPLOY_DIR/backups
          cp docker-compose.yml $DEPLOY_DIR/
          cp -r init-db/* $DEPLOY_DIR/init-db/
          cp -r migrations/pg/* $DEPLOY_DIR/migrations/pg/ 2>/dev/null || true
          cp scripts/migrate.sh $DEPLOY_DIR/scripts/
          chmod +x $DEPLOY_DIR/scripts/migrate.sh

          cd $DEPLOY_DIR

          # Validate every required secret is non-empty BEFORE writing .env.
          # Fail loud here so a misconfigured GH secret never silently produces
          # an empty value that the runtime would accept and then misuse.
          for var in DB_SERVER DB_NAME DB_USER DB_PASSWORD \
                     POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
                     SLACK_WEBHOOK_URL \
                     LEGACY_SYNC_ENABLED LEGACY_SYNC_SHADOW_MODE; do
            if [ -z "${!var:-}" ]; then
              echo "::error::required secret $var is empty — refusing to write .env"
              exit 1
            fi
          done

          # Tighten umask BEFORE creating .env so the file is born 600 (not
          # 644-then-chmod, which leaves a brief world-readable window).
          umask 077

          # MSSQL_PORT is optional — default 1433 if the GH secret isn't
          # set so existing HF Hotel deploys are unchanged. HF Ville
          # will provide this secret to point at SS2025 Express on 1436.
          MSSQL_PORT_VALUE="${MSSQL_PORT:-1433}"

          # Write .env file from GitHub Secrets (values single-quoted for special chars)
          {
            echo "DB_SERVER='${DB_SERVER}'"
            echo "DB_NAME='${DB_NAME}'"
            echo "DB_USER='${DB_USER}'"
            echo "DB_PASSWORD='${DB_PASSWORD}'"
            echo "MSSQL_PORT='${MSSQL_PORT_VALUE}'"
            echo "POSTGRES_DB='${POSTGRES_DB}'"
            echo "POSTGRES_USER='${POSTGRES_USER}'"
            echo "POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'"
            echo "SLACK_WEBHOOK_URL='${SLACK_WEBHOOK_URL}'"
            echo "LEGACY_SYNC_ENABLED='${LEGACY_SYNC_ENABLED}'"
            echo "LEGACY_SYNC_SHADOW_MODE='${LEGACY_SYNC_SHADOW_MODE}'"
          } > .env
          chmod 600 .env

          # ----- ghcr.io retry helper ------------------------------------
          # Same snap-docker workaround documented on the login step above:
          # `docker compose pull` calls go through the same daemon and hit
          # the same intermittent ENETUNREACH on ghcr.io. Wrap each pull in
          # 5 attempts with linear backoff. Without this, a single dropped
          # connection during pull silently fails the whole deploy because
          # `set -e` is in effect.
          # Caller passes the full subcommand after `docker compose`,
          # i.e. `retry_compose_pull pull` or
          # `retry_compose_pull --profile legacy pull writeback`. This keeps
          # the original argument order intact (compose is picky: profile
          # flags come before the verb, service names after).
          retry_compose_pull() {
            for attempt in 1 2 3 4 5; do
              if docker compose "$@"; then
                return 0
              fi
              sleep_s=$((attempt * 5))
              echo "::warning::compose pull (args: $*) attempt $attempt failed; retrying in ${sleep_s}s (snap-docker network flap)"
              sleep $sleep_s
            done
            echo "::error::compose pull (args: $*) failed after 5 attempts"
            return 1
          }

          # ----- container-state helpers ----------------------------------
          # `wait_healthy` polls a container's healthcheck until it reports
          # "healthy" (or, for services without a healthcheck, until the
          # container reaches "running"). Replaces the previous mix of
          # fixed `sleep 3/5/5` waits, which were both too long on the happy
          # path and too short under load.
          wait_healthy() {
            local container=$1
            local timeout=${2:-60}
            local elapsed=0
            while [ $elapsed -lt $timeout ]; do
              local health
              health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || echo "not_found")
              case "$health" in
                healthy|running) return 0 ;;
                not_found) ;;
                *) ;;
              esac
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "::error::$container did not become healthy within ${timeout}s (last state: $health)"
            docker logs "$container" --tail 50 2>&1 || true
            return 1
          }

          # ----- bring up the database FIRST and run migrations ----------
          # New ordering (B2 of the post-Phase-5.5 audit):
          #   pull -> up -d newdb -> migrate -> up -d (backend + web)
          # Migrations run against the EXISTING backend so the schema
          # change is in place before the new backend image starts.
          # Operator note: migrations that are NOT backwards-compatible
          # with the previously-deployed backend code MUST be split into
          # an expand/contract sequence, OR the operator must scale
          # backend to 0 first, migrate, then redeploy. This step does
          # not auto-handle that case.
          retry_compose_pull pull
          docker compose up -d newdb

          echo "Waiting for database to be healthy..."
          wait_healthy new-hotel-db 120

          echo "Running database migrations against running newdb..."
          ./scripts/migrate.sh

          # ----- bring up the rest of the stack --------------------------
          docker compose up -d

          echo "Waiting for backend healthcheck..."
          wait_healthy new-hotel-production-backend-1 90

          # Force-recreate the writeback worker too. It lives under
          # `profiles: [legacy]` so plain `docker compose up -d` (above)
          # skips it. It also shares the backend image, but Docker won't
          # swap an existing container's image without --force-recreate
          # — so without this step the worker keeps running OLD code
          # while the backend is fresh, which is how a 2026-04-25 incident
          # produced bookings missing back-population.
          retry_compose_pull --profile legacy pull writeback
          docker compose --profile legacy up -d --force-recreate writeback

          # Force-recreate the CT-watcher worker (Phase 5.5). Same image as
          # backend + writeback, lives under `profiles: [legacy]`, ships
          # default-DISABLED via LEGACY_SYNC_ENABLED=false in docker-compose.yml.
          # When disabled the binary exits cleanly (Ok(0)) so the container
          # state is "exited" — that's intentional, not a failure. The
          # operator flips LEGACY_SYNC_ENABLED=true after running --bootstrap;
          # see docs/runbook-sync.md.
          retry_compose_pull --profile legacy pull sync
          docker compose --profile legacy up -d --force-recreate sync

          # Phase 5 (Ville) worker pair — same image, different env (Ville
          # MSSQL via WG, hotelville PG, SITE_ID=hfville). Lives under
          # `profiles: [hfville]`. Ships default-DISABLED (HFVILLE_LEGACY_SYNC_ENABLED=false,
          # HFVILLE_WRITEBACK_ENABLED=false) so the binaries exit Ok(0) on
          # first deploy and the containers sit in "exited" state — that's
          # intentional until task #74 (bootstrap) flips the switch.
          # Force-recreate so a fresh image rollout actually swaps the
          # running binary, same reasoning as the legacy profile above.
          retry_compose_pull --profile hfville pull sync-hfville writeback-hfville
          docker compose --profile hfville up -d --force-recreate sync-hfville writeback-hfville

          echo "Deployment complete!"
          docker compose ps

          # Backend health re-check via the actual healthcheck (not just
          # State.Status). State.Status=running can be true mid-crash-loop;
          # State.Health.Status=healthy means it's actually serving HTTP.
          if ! wait_healthy new-hotel-production-backend-1 30; then
            echo "::error::Backend container failed post-deploy healthcheck"
            docker logs new-hotel-production-backend-1 --tail 50
            exit 1
          fi
          echo "Backend is healthy."

          # Verify writeback worker is running. It refuses to start on
          # legacy-MSSQL schema fingerprint mismatch (per writeback/fingerprint.rs)
          # — that's an intentional fail-loud, but CI/CD must surface it
          # as a deploy failure, not silently leave the worker dead.
          WRITEBACK_STATUS=$(docker inspect --format='{{.State.Status}}' new-hotel-production-writeback-1 2>/dev/null || echo "not_found")
          if [ "$WRITEBACK_STATUS" != "running" ]; then
            echo "WARNING: Writeback worker is not running (status: $WRITEBACK_STATUS)"
            echo "--- Writeback logs (last 50 lines) ---"
            docker logs new-hotel-production-writeback-1 --tail 50 2>&1 || true
            # Don't fail the deploy — writeback being down means the
            # outbox accumulates pending jobs (recoverable when the
            # worker comes back up), not data loss. But operators need
            # the loud warning to investigate.
            echo "::warning::Writeback worker not running after deploy — outbox jobs will queue"
          else
            echo "Writeback worker is running."
          fi

          # Verify CT-watcher worker (Phase 5.5). It ships default-disabled
          # — `LEGACY_SYNC_ENABLED=false` causes the binary to log + exit 0.
          # That is the EXPECTED post-deploy state until an operator flips
          # the flag. We surface both states ("running" or "exited")
          # without failing the deploy; only an unexpected restart loop or
          # missing container is a problem.
          SYNC_STATUS=$(docker inspect --format='{{.State.Status}}' new-hotel-production-sync-1 2>/dev/null || echo "not_found")
          case "$SYNC_STATUS" in
            running)
              echo "CT-watcher worker is running (LEGACY_SYNC_ENABLED=true)."
              ;;
            exited)
              echo "CT-watcher worker exited cleanly (LEGACY_SYNC_ENABLED=false — expected default)."
              ;;
            not_found)
              echo "::warning::CT-watcher container not found — verify docker-compose.yml `sync` service block"
              ;;
            *)
              echo "::warning::CT-watcher worker in unexpected state: $SYNC_STATUS"
              echo "--- Sync logs (last 50 lines) ---"
              docker logs new-hotel-production-sync-1 --tail 50 2>&1 || true
              ;;
          esac

