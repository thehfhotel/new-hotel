name: Build, Push, and Deploy new-hotel Web App

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Note: no cancel-previous job. The workflow only triggers on master pushes
  # and workflow_dispatch (no PR builds), so cancelling earlier runs only
  # serves to orphan in-flight deploys when commits land back-to-back. We let
  # all runs complete; the deploy step is idempotent (docker compose up -d).
  changes:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN least-privilege: this job only reads the working tree.
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      deploy: ${{ steps.filter.outputs.deploy }}
      hfville: ${{ steps.filter.outputs.hfville }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changes
        # v3 pinned to commit SHA per Batch D of post-Phase-5.5 audit.
        # Resolved via `gh api /repos/dorny/paths-filter/git/refs/tags/v3`.
        # Bumps surface as Dependabot PRs (.github/dependabot.yml).
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile'
              - 'next.config.js'
              - 'tailwind.config.ts'
              - 'tsconfig.json'
              - 'postcss.config.mjs'
            backend:
              - 'hotel-backend/**'
            deploy:
              - 'docker-compose.yml'
              - 'init-db/**'
              - 'migrations/pg/**'
              - 'scripts/migrate.sh'
            hfville:
              - 'hotel-backend/**'
              - 'deploy/hfville/**'

  test-frontend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # v4 pinned to SHA. Resolved via gh api git/refs/tags/v4.
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e  # v6.0.3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run component tests
        run: pnpm test:components

  test-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    services:
      postgres:
        # TEST_POSTGRES_PASSWORD is a CI-only throwaway secret; the value is
        # constrained to URL-safe characters (A-Za-z0-9) so it can be embedded
        # in DATABASE_URL below without percent-encoding.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hotelnew
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          PGPORT: "5439"
        ports:
          - 5439:5439
        options: >-
          --health-cmd "pg_isready -U postgres -p 5439"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize database
        env:
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: psql -h localhost -p 5439 -U postgres -d hotelnew -f init-db/init-hotelnew.sql

      - name: Install Rust toolchain
        # Pinned to a `1.89` branch SHA (per Batch D). The `@stable` ref the
        # action publishes is a moving target — pinning it caps the toolchain
        # at the version used to generate `.sqlx/` cache files.
        uses: dtolnay/rust-toolchain@193d6aa1dbbc28bd2c0a6b0e327cfdce68baaf6e  # 1.89
        with:
          toolchain: "1.89"

      # hotel-backend/.cargo/config.toml pins `-fuse-ld=mold` for x86_64-linux
      # so local + Docker builds link fast. The GitHub runner ships neither
      # mold nor clang by default — install both so `cargo test` can link.
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold clang

      # sccache wraps every rustc invocation and caches its output keyed on the
      # exact crate inputs. It complements Swatinem/rust-cache (which caches
      # the whole target/ dir). Treated as opportunistic: if the action fails
      # OR the GHA Cache service is unreachable at server-start time, we skip
      # RUSTC_WRAPPER and fall through to a plain build instead of failing
      # the job. The probe step does the real check — the action above only
      # installs the binary.
      - name: Set up sccache
        id: sccache_setup
        # v0.0.9+ uses the GHA Cache v2 API (`ACTIONS_RESULTS_URL`).
        # GitHub sunset the v1 cache API on 2026-02-01, after which v0.0.6
        # got 400s from artifactcache.actions.githubusercontent.com on every
        # probe. Pinned to v0.0.10 (Batch D pinned to commit SHA — the
        # tag itself was last moved on the v0.0.10 release).
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10
        continue-on-error: true

      - name: Probe sccache (verify GHA Cache reachable)
        id: sccache_probe
        if: steps.sccache_setup.outcome == 'success'
        continue-on-error: true
        env:
          SCCACHE_GHA_ENABLED: "true"
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        run: |
          sccache --start-server
          sccache --show-stats
          sccache --stop-server

      - name: Cache Rust dependencies
        # v2 pinned to SHA. Resolved via gh api git/refs/tags/v2.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: hotel-backend

      - name: Run backend tests
        working-directory: hotel-backend
        env:
          DATABASE_URL: postgres://postgres:${{ secrets.TEST_POSTGRES_PASSWORD }}@localhost:5439/hotelnew
          SQLX_OFFLINE: "true"
          SCCACHE_GHA_ENABLED: ${{ steps.sccache_probe.outcome == 'success' && 'true' || 'false' }}
          RUSTC_WRAPPER: ${{ steps.sccache_probe.outcome == 'success' && 'sccache' || '' }}
        # `--locked` aborts if Cargo.lock is out of date with Cargo.toml.
        # CI parity with the production Dockerfile build (also uses --locked).
        run: cargo test --locked

  build-frontend:
    runs-on: ubuntu-latest
    # Block pushing :latest if frontend tests fail (Batch D of audit).
    needs: [changes, test-frontend]
    if: needs.changes.outputs.code == 'true' && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: frontend` (Batch D): isolates the GHA cache namespace
          # so build-backend and build-ville-sync can't evict it.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_CARD_READER_URL=${{ secrets.CARD_READER_URL }}

  build-backend:
    runs-on: ubuntu-latest
    # Block pushing :latest if backend tests fail (Batch D of audit).
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: backend` per Batch D — isolates GHA cache namespace.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-ville-sync:
    runs-on: ubuntu-latest
    # Block pushing :latest if backend tests fail (Batch D of audit).
    # ville-sync shares the hotel-backend workspace, so test-backend
    # exercising it is the right gate.
    needs: [changes, test-backend]
    if: needs.changes.outputs.hfville == 'true' && (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/thehfhotel/ville-sync
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ville-sync
        uses: docker/build-push-action@v6
        with:
          context: ./hotel-backend
          file: ./hotel-backend/Dockerfile.ville-sync
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `scope: ville-sync` per Batch D — isolates GHA cache namespace.
          cache-from: type=gha,scope=ville-sync
          cache-to: type=gha,mode=max,scope=ville-sync

  deploy:
    runs-on: [self-hosted, linux, deploy]
    needs: [changes, test-frontend, test-backend, build-frontend, build-backend]
    # Least-privilege: the deploy step only needs to pull images from GHCR
    # (read on packages) and read the working tree.
    permissions:
      contents: read
      packages: read
    # Serialise deploys to evergreen so two back-to-back master pushes can
    # never have their `docker compose up` interleave. cancel-in-progress
    # is OFF because the in-flight deploy already pulled images + is
    # mid-migration; aborting it leaves PG and the backend container in
    # mismatched-schema state.
    concurrency:
      group: deploy-prod-evergreen
      cancel-in-progress: false
    if: |
      always() &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || (needs.changes.outputs.deploy == 'true' && needs.changes.outputs.code != 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          DB_SERVER: ${{ secrets.DB_SERVER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -e
          DEPLOY_DIR=/home/nut/new-hotel-production

          # Create deployment directory and copy files
          mkdir -p $DEPLOY_DIR/init-db
          mkdir -p $DEPLOY_DIR/migrations/pg
          mkdir -p $DEPLOY_DIR/scripts
          mkdir -p $DEPLOY_DIR/backups
          cp docker-compose.yml $DEPLOY_DIR/
          cp -r init-db/* $DEPLOY_DIR/init-db/
          cp -r migrations/pg/* $DEPLOY_DIR/migrations/pg/ 2>/dev/null || true
          cp scripts/migrate.sh $DEPLOY_DIR/scripts/
          chmod +x $DEPLOY_DIR/scripts/migrate.sh

          cd $DEPLOY_DIR

          # Validate every required secret is non-empty BEFORE writing .env.
          # Fail loud here so a misconfigured GH secret never silently produces
          # an empty value that the runtime would accept and then misuse.
          for var in DB_SERVER DB_NAME DB_USER DB_PASSWORD \
                     POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
                     SLACK_WEBHOOK_URL; do
            if [ -z "${!var:-}" ]; then
              echo "::error::required secret $var is empty — refusing to write .env"
              exit 1
            fi
          done

          # Tighten umask BEFORE creating .env so the file is born 600 (not
          # 644-then-chmod, which leaves a brief world-readable window).
          umask 077

          # Write .env file from GitHub Secrets (values single-quoted for special chars)
          {
            echo "DB_SERVER='${DB_SERVER}'"
            echo "DB_NAME='${DB_NAME}'"
            echo "DB_USER='${DB_USER}'"
            echo "DB_PASSWORD='${DB_PASSWORD}'"
            echo "POSTGRES_DB='${POSTGRES_DB}'"
            echo "POSTGRES_USER='${POSTGRES_USER}'"
            echo "POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'"
            echo "SLACK_WEBHOOK_URL='${SLACK_WEBHOOK_URL}'"
          } > .env
          chmod 600 .env

          # ----- container-state helpers ----------------------------------
          # `wait_healthy` polls a container's healthcheck until it reports
          # "healthy" (or, for services without a healthcheck, until the
          # container reaches "running"). Replaces the previous mix of
          # fixed `sleep 3/5/5` waits, which were both too long on the happy
          # path and too short under load.
          wait_healthy() {
            local container=$1
            local timeout=${2:-60}
            local elapsed=0
            while [ $elapsed -lt $timeout ]; do
              local health
              health=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || echo "not_found")
              case "$health" in
                healthy|running) return 0 ;;
                not_found) ;;
                *) ;;
              esac
              sleep 2
              elapsed=$((elapsed + 2))
            done
            echo "::error::$container did not become healthy within ${timeout}s (last state: $health)"
            docker logs "$container" --tail 50 2>&1 || true
            return 1
          }

          # ----- bring up the database FIRST and run migrations ----------
          # New ordering (B2 of the post-Phase-5.5 audit):
          #   pull -> up -d newdb -> migrate -> up -d (backend + web)
          # Migrations run against the EXISTING backend so the schema
          # change is in place before the new backend image starts.
          # Operator note: migrations that are NOT backwards-compatible
          # with the previously-deployed backend code MUST be split into
          # an expand/contract sequence, OR the operator must scale
          # backend to 0 first, migrate, then redeploy. This step does
          # not auto-handle that case.
          docker compose pull
          docker compose up -d newdb

          echo "Waiting for database to be healthy..."
          wait_healthy new-hotel-db 120

          echo "Running database migrations against running newdb..."
          ./scripts/migrate.sh

          # ----- bring up the rest of the stack --------------------------
          docker compose up -d

          echo "Waiting for backend healthcheck..."
          wait_healthy new-hotel-production-backend-1 90

          # Force-recreate the writeback worker too. It lives under
          # `profiles: [legacy]` so plain `docker compose up -d` (above)
          # skips it. It also shares the backend image, but Docker won't
          # swap an existing container's image without --force-recreate
          # — so without this step the worker keeps running OLD code
          # while the backend is fresh, which is how a 2026-04-25 incident
          # produced bookings missing back-population.
          docker compose --profile legacy pull writeback
          docker compose --profile legacy up -d --force-recreate writeback

          # Force-recreate the CT-watcher worker (Phase 5.5). Same image as
          # backend + writeback, lives under `profiles: [legacy]`, ships
          # default-DISABLED via LEGACY_SYNC_ENABLED=false in docker-compose.yml.
          # When disabled the binary exits cleanly (Ok(0)) so the container
          # state is "exited" — that's intentional, not a failure. The
          # operator flips LEGACY_SYNC_ENABLED=true after running --bootstrap;
          # see docs/runbook-sync.md.
          docker compose --profile legacy pull sync
          docker compose --profile legacy up -d --force-recreate sync

          echo "Deployment complete!"
          docker compose ps

          # Backend health re-check via the actual healthcheck (not just
          # State.Status). State.Status=running can be true mid-crash-loop;
          # State.Health.Status=healthy means it's actually serving HTTP.
          if ! wait_healthy new-hotel-production-backend-1 30; then
            echo "::error::Backend container failed post-deploy healthcheck"
            docker logs new-hotel-production-backend-1 --tail 50
            exit 1
          fi
          echo "Backend is healthy."

          # Verify writeback worker is running. It refuses to start on
          # legacy-MSSQL schema fingerprint mismatch (per writeback/fingerprint.rs)
          # — that's an intentional fail-loud, but CI/CD must surface it
          # as a deploy failure, not silently leave the worker dead.
          WRITEBACK_STATUS=$(docker inspect --format='{{.State.Status}}' new-hotel-production-writeback-1 2>/dev/null || echo "not_found")
          if [ "$WRITEBACK_STATUS" != "running" ]; then
            echo "WARNING: Writeback worker is not running (status: $WRITEBACK_STATUS)"
            echo "--- Writeback logs (last 50 lines) ---"
            docker logs new-hotel-production-writeback-1 --tail 50 2>&1 || true
            # Don't fail the deploy — writeback being down means the
            # outbox accumulates pending jobs (recoverable when the
            # worker comes back up), not data loss. But operators need
            # the loud warning to investigate.
            echo "::warning::Writeback worker not running after deploy — outbox jobs will queue"
          else
            echo "Writeback worker is running."
          fi

          # Verify CT-watcher worker (Phase 5.5). It ships default-disabled
          # — `LEGACY_SYNC_ENABLED=false` causes the binary to log + exit 0.
          # That is the EXPECTED post-deploy state until an operator flips
          # the flag. We surface both states ("running" or "exited")
          # without failing the deploy; only an unexpected restart loop or
          # missing container is a problem.
          SYNC_STATUS=$(docker inspect --format='{{.State.Status}}' new-hotel-production-sync-1 2>/dev/null || echo "not_found")
          case "$SYNC_STATUS" in
            running)
              echo "CT-watcher worker is running (LEGACY_SYNC_ENABLED=true)."
              ;;
            exited)
              echo "CT-watcher worker exited cleanly (LEGACY_SYNC_ENABLED=false — expected default)."
              ;;
            not_found)
              echo "::warning::CT-watcher container not found — verify docker-compose.yml `sync` service block"
              ;;
            *)
              echo "::warning::CT-watcher worker in unexpected state: $SYNC_STATUS"
              echo "--- Sync logs (last 50 lines) ---"
              docker logs new-hotel-production-sync-1 --tail 50 2>&1 || true
              ;;
          esac

  deploy-hfville:
    runs-on: [self-hosted, linux, deploy]
    # `deploy` must succeed first so the canonical HF Hotel newdb is up to
    # date before the HF Ville push target accepts new ville-schema rows
    # (the ville-sync push goes straight at newdb on 10.10.10.4:5441).
    needs: [changes, test-backend, build-ville-sync, deploy]
    # Least-privilege: pull ville-sync image from GHCR (read on packages),
    # read the tree.
    permissions:
      contents: read
      packages: read
    # Serialise hfville deploys (parallel pushes would race on jump box
    # docker daemon + the same .env file).
    concurrency:
      group: deploy-hfville
      cancel-in-progress: false
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.build-ville-sync.result == 'success' || (needs.changes.outputs.hfville == 'true' && needs.changes.outputs.backend != 'true'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: needs.build-ville-sync.result == 'success'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load HF Ville SSH key into agent
        # Replaces the previous `sshpass -p banana` literal — pubkey is
        # installed on the jump box once by the operator (see commit body
        # for the operator setup). The action wipes the agent at job end.
        # v0.9.0 pinned to commit SHA per Batch D.
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387  # v0.9.0
        with:
          ssh-private-key: ${{ secrets.HFVILLE_SSH_KEY }}

      - name: Pin HF Ville host key
        env:
          JUMP_BOX: ${{ secrets.HFVILLE_SSH_HOST }}
        # Pre-populate known_hosts so we never need StrictHostKeyChecking=no.
        # `ssh-keyscan -H` hashes the hostname so it isn't readable in the
        # log. If the jump box host key ever rotates, the operator must
        # re-run this once locally and re-pin (or accept TOFU here).
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H -T 15 "$JUMP_BOX" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Validate required HF Ville secrets
        env:
          HFVILLE_SSH_HOST: ${{ secrets.HFVILLE_SSH_HOST }}
          HFVILLE_SSH_USER: ${{ secrets.HFVILLE_SSH_USER }}
          HFVILLE_PG_PASSWORD: ${{ secrets.HFVILLE_PG_PASSWORD }}
          HFVILLE_MSSQL_PASSWORD: ${{ secrets.HFVILLE_MSSQL_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          for var in HFVILLE_SSH_HOST HFVILLE_SSH_USER \
                     HFVILLE_PG_PASSWORD HFVILLE_MSSQL_PASSWORD \
                     POSTGRES_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::required secret $var is empty — refusing to deploy"
              exit 1
            fi
          done

      - name: Deploy to HF Ville jump box
        env:
          NEW_IMAGE: ${{ needs.build-ville-sync.result == 'success' }}
          JUMP_BOX: ${{ secrets.HFVILLE_SSH_HOST }}
          SSH_USER: ${{ secrets.HFVILLE_SSH_USER }}
          HFVILLE_PG_PASSWORD: ${{ secrets.HFVILLE_PG_PASSWORD }}
          HFVILLE_MSSQL_PASSWORD: ${{ secrets.HFVILLE_MSSQL_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -e
          # NOTE: -o StrictHostKeyChecking=no removed — known_hosts pinned above.
          SSH_OPTS="-o ConnectTimeout=15"

          echo "Deploying to HF Ville jump box ($JUMP_BOX) via WireGuard..."

          # Ensure remote directory layout exists.
          ssh $SSH_OPTS "$SSH_USER@$JUMP_BOX" "mkdir -p ~/hfville/init-db"

          # Copy deployment files to jump box
          scp $SSH_OPTS \
            deploy/hfville/docker-compose.yml "$SSH_USER@$JUMP_BOX:~/hfville/"
          scp $SSH_OPTS \
            deploy/hfville/init-db/init-hfville.sql "$SSH_USER@$JUMP_BOX:~/hfville/init-db/"

          # Write .env on the jump box from GH Secrets. umask 077 BEFORE the
          # heredoc so the file is born 600 with no world-readable window.
          # `printf %s "$ENV_BODY"` sends the body verbatim — no shell expansion
          # on the remote side (vars already expanded locally), no leading-space
          # weirdness from heredoc indentation under YAML's run-block stripping.
          ENV_BODY="HFVILLE_PG_PASSWORD='${HFVILLE_PG_PASSWORD}'
          HFVILLE_MSSQL_PASSWORD='${HFVILLE_MSSQL_PASSWORD}'
          POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'"
          # Strip the YAML-induced leading whitespace before transmission.
          ENV_BODY=$(printf '%s\n' "$ENV_BODY" | sed -e 's/^[[:space:]]\{10\}//')
          printf '%s\n' "$ENV_BODY" | \
            ssh $SSH_OPTS "$SSH_USER@$JUMP_BOX" \
              "umask 077 && cat > ~/hfville/.env && chmod 600 ~/hfville/.env"

          # Transfer new image only if ville-sync was rebuilt
          if [ "$NEW_IMAGE" = "true" ]; then
            echo "Transferring new ville-sync image..."
            docker pull ghcr.io/thehfhotel/ville-sync:latest
            docker save ghcr.io/thehfhotel/ville-sync:latest | gzip > /tmp/ville-sync.tar.gz

            scp $SSH_OPTS \
              /tmp/ville-sync.tar.gz "$SSH_USER@$JUMP_BOX:~/hfville/"

            # `sudo` on the jump box must be configured NOPASSWD for docker
            # (see commit body). No password literal anywhere in this pipeline.
            ssh $SSH_OPTS "$SSH_USER@$JUMP_BOX" \
              "sudo docker load -i ~/hfville/ville-sync.tar.gz && rm ~/hfville/ville-sync.tar.gz"

            rm -f /tmp/ville-sync.tar.gz
          else
            echo "Config-only deploy, skipping image transfer"
          fi

          # Start/restart services
          ssh $SSH_OPTS "$SSH_USER@$JUMP_BOX" \
            "cd ~/hfville && sudo docker compose up -d"

          echo "HF Ville deployment complete!"
