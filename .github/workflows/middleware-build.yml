name: Build Thai ID Middleware

on:
  push:
    paths:
      - 'thai-id-middleware-tauri/**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0) - leave empty to skip release'
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS Universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: thai-id-middleware-tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Rust targets (Windows)
        if: matrix.platform == 'windows-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: thai-id-middleware-tauri/src-tauri -> target
          cache-on-failure: true

      - name: Install npm dependencies
        working-directory: thai-id-middleware-tauri
        run: npm install

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: thai-id-middleware-tauri
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: thai-id-middleware-tauri
        run: npm run tauri build

      - name: Upload macOS artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            thai-id-middleware-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            thai-id-middleware-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: Upload Windows artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            thai-id-middleware-tauri/src-tauri/target/release/bundle/msi/*.msi
            thai-id-middleware-tauri/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.release_version != ''
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: List artifacts
        run: find dist -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: middleware-${{ github.event.inputs.release_version }}
          name: Thai ID Middleware ${{ github.event.inputs.release_version }}
          body: |
            ## Thai ID Middleware ${{ github.event.inputs.release_version }}

            Native Tauri-based middleware with Rust PC/SC implementation.

            ### Features
            - Smaller binary size (~10MB vs ~150MB Electron)
            - Better macOS Gatekeeper compatibility
            - Lower memory usage
            - Native Rust performance

            ### Downloads
            - **macOS**: `.dmg` - Universal binary (Apple Silicon + Intel)
            - **Windows**: `.msi` or `.exe` installer

            ### Installation

            **macOS:**
            1. Download the `.dmg` file
            2. Open it and drag the app to Applications
            3. If macOS blocks the app, go to System Settings > Privacy & Security and click "Open Anyway"

            **Windows:**
            1. Download the `.msi` or `.exe` installer
            2. Run the installer
            3. The middleware will be installed in Program Files

            ### Usage
            1. Launch Thai ID Middleware
            2. The HTTP server starts automatically on port 9898
            3. Open the card reader page in your browser
            4. Insert a Thai National ID card and click Read
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.exe
          draft: false
          prerelease: false
