# Dependabot configuration — added in Batch D of post-Phase-5.5 audit.
# Ecosystem coverage:
#   cargo            -> backend Rust crates
#   npm              -> frontend, Tauri middleware
#   github-actions   -> workflows under .github/
#   docker           -> base images in Dockerfiles + docker-compose.yml
#
# All on a weekly cadence. Tune intervals per ecosystem if PR volume gets noisy.
# Reviewer + assignee fields intentionally omitted — repo defaults apply.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /hotel-backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /thai-id-middleware-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # Frontend Dockerfile.
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # Backend Dockerfile.
    directory: /hotel-backend
    schedule:
      interval: weekly
