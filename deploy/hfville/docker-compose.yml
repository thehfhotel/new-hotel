services:
  # PostgreSQL mirror database for HF Ville
  # Receives synced data from SQL Server 2005 at 192.168.11.51
  hfville-db:
    image: postgres:17-alpine
    container_name: hfville-db
    environment:
      - POSTGRES_DB=hfville
      - POSTGRES_USER=postgres
      # Required: HFVILLE_PG_PASSWORD must come from .env (deploy pipeline writes it).
      # ${VAR:?msg} fails fast at compose-up if the value is unset/empty.
      - POSTGRES_PASSWORD=${HFVILLE_PG_PASSWORD:?HFVILLE_PG_PASSWORD is required}
      - PGPORT=5440
    ports:
      - "5440:5440"
    volumes:
      - hfville_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5440"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Sync binary: MSSQL -> local PG mirror + push to production newdb (ville schema)
  # Runs every 90 seconds, uses SHA256 hash-based change detection
  # Uses host networking to reach MSSQL on local LAN (192.168.11.51)
  ville-sync:
    image: ghcr.io/thehfhotel/ville-sync:latest
    container_name: ville-sync
    network_mode: host
    environment:
      - MSSQL_SERVER=192.168.11.51
      - MSSQL_DATABASE=hotel
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=${HFVILLE_MSSQL_PASSWORD:?HFVILLE_MSSQL_PASSWORD is required}
      - PG_SERVER=127.0.0.1
      - PG_PORT=5440
      - PG_DATABASE=hfville
      - PG_USER=postgres
      - PG_PASSWORD=${HFVILLE_PG_PASSWORD:?HFVILLE_PG_PASSWORD is required}
      - SYNC_INTERVAL_SECS=90
      - RUST_LOG=ville_sync=info
      # Push to production newdb (ville schema) via WireGuard
      - PUSH_PG_SERVER=10.10.10.4
      - PUSH_PG_PORT=5441
      - PUSH_PG_NAME=hotelnew
      - PUSH_PG_USER=postgres
      # Push target is the production HF Hotel newdb — its password lives
      # under the existing POSTGRES_PASSWORD secret (NOT a separate one).
      - PUSH_PG_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      hfville-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hfville_data:
