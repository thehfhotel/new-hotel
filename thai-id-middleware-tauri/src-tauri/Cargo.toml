[package]
name = "thai-id-middleware"
version = "1.1.0"
description = "Thai ID Card Reader Middleware"
authors = [""]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
pcsc = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
log = "0.4"
base64 = "0.22"
tauri-plugin-autostart = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Build-speed release profile. This is a PC/SC card-reader HTTP bridge, not a
# CPU-bound workload, so we trade the default `opt-level = 3` + 16 codegen units
# for a much faster compile with negligible runtime cost — it cuts cold-cache CI
# builds and the always-recompiled workspace crate on every build.
[profile.release]
opt-level = 1        # 1 is plenty for a card bridge; far faster to compile than 3
codegen-units = 256  # maximise codegen parallelism (default 16)
lto = false          # LTO is a large build-time cost with no benefit here
strip = true         # smaller binary/installer + faster artifact upload

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

