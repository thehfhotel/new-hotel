[package]
name = "thai-id-middleware"
version = "1.1.0"
description = "Thai ID Card Reader Middleware"
authors = [""]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
pcsc = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
log = "0.4"
base64 = "0.22"
tauri-plugin-autostart = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Build-speed release profile. This is a PC/SC card-reader HTTP bridge, not a
# CPU-bound workload, so we trade the default `opt-level = 3` + 16 codegen units
# for a much faster compile with negligible runtime cost — it cuts cold-cache CI
# builds and the always-recompiled workspace crate on every build.
[profile.release]
opt-level = 1        # 1 is plenty for a card bridge; far faster to compile than 3
codegen-units = 256  # maximise codegen parallelism (default 16)
lto = false          # LTO is a large build-time cost with no benefit here
strip = true         # smaller binary/installer + faster artifact upload

# Windows-only. Scoped here (`cfg(windows)` ≡ `cfg(target_os = "windows")`)
# so the macOS/CI leg never fetches or compiles any of it.
[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
# UI Automation + Win32 messaging for the iHOTEL refresh action
# (src/ihotel/windows_impl.rs). Pinned to the same 0.61.x `tauri` itself
# resolves, so feature unification adds features to a crate already in the
# build rather than dragging in a second copy of the Windows metadata.
windows = { version = "0.61.3", features = [
  "Win32_Foundation",                   # HWND, LPARAM, WPARAM, RECT, CloseHandle
  "Win32_System_Com",                   # CoInitializeEx / CoCreateInstance
  "Win32_System_Diagnostics_ToolHelp",  # process enumeration (HOTEL.exe)
  "Win32_System_Ole",                   # required by VARIANT
  "Win32_System_Variant",               # VARIANT for CreatePropertyCondition
  "Win32_UI_Accessibility",             # IUIAutomation, AutomationId search
  "Win32_UI_Input_KeyboardAndMouse",    # IsWindowEnabled (modal guard)
  "Win32_UI_WindowsAndMessaging",       # EnumWindows, PostMessageW, styles
] }

[dev-dependencies]
tower = { version = "0.5.3", default-features = false, features = ["util"] }

